/* =========================================================
   MAPA SVĚTA
   ========================================================= */
const PLACE_ICONS = [
  [/hrad|pevnost|tvrz|citadel/,'🏰'], [/hostin|krčm|hospod|taverna/,'🍺'], [/chrám|kostel|klášter|svatyn|kaple|oltář/,'⛪'],
  [/jeskyn|důl|doly|sluj|podzem/,'🕳️'], [/ruin|zřícenin|hrob|krypt|hřbitov|mohyl/,'🏚️'], [/bažin|močál|slatin|blat/,'🐸'],
  [/přístav|pobřeží|moře|ostrov|zátok|maják/,'⚓'], [/hor|skal|průsmyk|vrch|štít/,'⛰️'], [/les|hvozd|háj|bor/,'🌲'],
  [/řek|brod|most|jezer|rybník/,'🌊'], [/měst/,'🏙️'], [/ves|vesnic|osad|dvůr|statek|mlýn|chalup/,'🏡']
];
const placeBase = n => String(n || '').split(/\s+[–—-]\s+|,\s*|\s*\(/)[0].trim().slice(0,60);
const placeKey = n => low(placeBase(n));
const placeIcon = n => (PLACE_ICONS.find(([re]) => re.test(low(n))) || [0,'📍'])[1];
const hashStr = s => { let h = 2166136261; for(const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };

/* Zapíše místo na mapu. Nové místo se umístí od předchozího podle délky cesty. */
function registerPlace(name, fromKey, hours, danger){
  const key = placeKey(name);
  if(!key) return;
  S.places ||= {}; S.roads ||= [];
  let p = S.places[key];
  if(!p){
    const from = fromKey && S.places[fromKey];
    let x = 0, y = 0;
    if(from){
      const dist = 26 + clamp(hours || 1, 0.5, 24) * 16;
      let ang = (hashStr(key) % 360) * Math.PI / 180;
      for(let i = 0; i < 12; i++){
        x = Math.round(from.x + Math.cos(ang) * dist); y = Math.round(from.y + Math.sin(ang) * dist);
        if(!Object.values(S.places).some(o => Math.hypot(o.x - x, o.y - y) < 34)) break;
        ang += 0.55;
      }
    }
    p = S.places[key] = { nazev:placeBase(name), x, y, ikona:placeIcon(name), den:S.time.day, navstev:0 };
    addLog({ t:'fx', notes:[{ c:'loc', t:`🗺️ Nové místo na mapě: ${p.nazev}` }] });
  }
  p.navstev++;
  if(fromKey && fromKey !== key && S.places[fromKey] && !S.roads.some(r => (r.a === fromKey && r.b === key) || (r.a === key && r.b === fromKey)))
    S.roads.push({ a:fromKey, b:key, h:Math.round((hours || 1) * 10) / 10, d:danger || 'stredni' });
  S.here = key;
}

function tabMap(){
  const P = S.places || {}, keys = Object.keys(P);
  if(!keys.length) return '<div class="empty">Mapa je zatím prázdná. Místa se na ni zapisují, jak je navštěvuješ.</div>';
  const half = k => Math.max(20, P[k].nazev.length * 3.4 + 6);   /* polovina šířky popisku */
  const minX = Math.min(...keys.map(k => P[k].x - half(k))) - 10, maxX = Math.max(...keys.map(k => P[k].x + half(k))) + 10;
  const minY = Math.min(...keys.map(k => P[k].y)) - 40, maxY = Math.max(...keys.map(k => P[k].y)) + 44;
  const w = Math.max(300, maxX - minX), h = Math.max(260, maxY - minY);
  const dcol = { nizke:'#3d6a26', stredni:'#9a6a12', vysoke:'#8c2216' };
  const roads = (S.roads || []).filter(r => P[r.a] && P[r.b]).map(r => {
    const a = P[r.a], b = P[r.b], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${dcol[r.d] || '#6d573a'}" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/>
      <text x="${mx}" y="${my - 3}" class="mroad">${esc(fmtHours(r.h))}</text>`; }).join('');
  const places = keys.map(k => { const p = P[k], here = k === S.here;
    return `<g class="mplace" data-place="${esc(k)}">
      ${here ? `<circle cx="${p.x}" cy="${p.y}" r="17" fill="none" stroke="#8c2216" stroke-width="2.5"><animate attributeName="r" values="15;19;15" dur="2s" repeatCount="indefinite"/></circle>` : ''}
      <circle cx="${p.x}" cy="${p.y}" r="13" fill="#f6ecd2" stroke="#6d573a" stroke-width="1.2"/>
      <text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="15">${p.ikona}</text>
      <text x="${p.x}" y="${p.y + 28}" class="mname ${here ? 'here' : ''}">${esc(p.nazev)}</text></g>`; }).join('');
  return `<div class="sec"><span>Mapa kraje</span><span>${keys.length} míst</span></div>
    <div class="mapwrap"><svg class="mapsvg" viewBox="${minX} ${minY} ${w} ${h}" style="width:${Math.max(100, w / 3.4)}%;min-width:100%">
      <rect x="${minX}" y="${minY}" width="${w}" height="${h}" fill="none" stroke="#9c7f4f" stroke-width="2" stroke-dasharray="1 0"/>
      <text x="${minX + w - 24}" y="${minY + 30}" font-size="26" text-anchor="middle" opacity=".55">🧭</text>
      ${roads}${places}</svg></div>
    <div class="dnote">Klepni na místo pro detail a cestu. Barva cesty: <span style="color:#3d6a26">bezpečná</span> · <span style="color:#9a6a12">střední</span> · <span style="color:#8c2216">nebezpečná</span></div>`;
}
function placeSheet(key){
  const p = S.places?.[key]; if(!p) return;
  const roads = (S.roads || []).filter(r => r.a === key || r.b === key).map(r => {
    const o = S.places[r.a === key ? r.b : r.a]; return o ? `${o.ikona} ${o.nazev} – ${fmtHours(r.h)}` : ''; }).filter(Boolean);
  const rep = S.rep?.[key];
  const rows = [['Poprvé navštíveno', `den ${p.den}`], ['Návštěv', p.navstev]];
  if(rep !== undefined) rows.push(['Tvoje pověst', repLabel(rep)]);
  if(roads.length) rows.push(['Cesty', roads.join(' · ')]);
  const here = key === S.here;
  openSheet(`<div class="dhead"><div class="ico">${p.ikona}</div><div><h2>${esc(p.nazev)}</h2><small>${here ? '📍 Jsi tady' : 'Známé místo'}</small></div></div>
    <div class="dstats">${rows.map(([k,v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${here ? '' : `<div class="dbtns"><button class="main" data-act="goto" data-place="${esc(key)}" ${canAct() ? '' : 'disabled'}>🧭 Vyrazit sem</button></div>`}
    <button class="cancel" data-act="closesheet">Zavřít</button>`, 'r0');
}

/* =========================================================
   VZTAHY S NPC A POVĚST
   ========================================================= */
const relLabel = s => s >= 60 ? 'věrný přítel' : s >= 25 ? 'přátelský' : s > -25 ? 'neutrální' : s > -60 ? 'nepřátelský' : 'úhlavní nepřítel';
const repLabel = s => `${s >= 50 ? 'oslavovaný hrdina' : s >= 20 ? 'vážený' : s > -20 ? 'neznámý' : s > -50 ? 'nedůvěryhodný' : 'psanec'} (${s > 0 ? '+' : ''}${s})`;
const relColor = s => s >= 25 ? 'var(--green)' : s > -25 ? 'var(--gold)' : 'var(--blood)';

/* =========================================================
   ROČNÍ OBDOBÍ A POČASÍ
   ========================================================= */
const SEASONS = [['jaro','Jaro','🌱'], ['leto','Léto','☀️'], ['podzim','Podzim','🍂'], ['zima','Zima','❄️']];
const season = () => SEASONS[Math.floor(((S.time.day - 1) % 120) / 30)];
const WEATHER = {
  jasno:{ n:'Jasno', i:'☀️', ni:'✨', travel:1 },
  oblacno:{ n:'Zataženo', i:'☁️', travel:1 },
  dest:{ n:'Déšť', i:'🌧️', travel:1.25, unava:1, wet:true },
  bourka:{ n:'Bouřka', i:'⛈️', travel:1.5, unava:2, wet:true },
  mlha:{ n:'Mlha', i:'🌫️', travel:1.2 },
  vedro:{ n:'Vedro', i:'🥵', travel:1.1, unava:1 },
  snih:{ n:'Sněžení', i:'🌨️', travel:1.4, unava:1, cold:true },
  mraz:{ n:'Mráz', i:'🥶', travel:1.1, cold:true }
};
const WEATHER_W = {
  jaro:{ jasno:30, oblacno:30, dest:25, bourka:5, mlha:10 },
  leto:{ jasno:45, oblacno:20, vedro:15, dest:10, bourka:10 },
  podzim:{ jasno:15, oblacno:30, dest:30, mlha:20, bourka:5 },
  zima:{ jasno:15, oblacno:25, snih:30, mraz:25, mlha:5 }
};
const wx = () => WEATHER[S.weather?.typ] || WEATHER.jasno;
const wxIcon = () => (isNight() && wx().ni) || wx().i;
function rollWeather(force){
  const w = WEATHER_W[season()[0]];
  if(!force && S.weather && w[S.weather.typ] && Math.random() < 0.55) return;
  const t = pickWeighted(Object.entries(w).map(([k,v]) => ({ k, w:v }))).k;
  if(S.weather?.typ !== t){
    S.weather = { typ:t };
    if(!force){ addLog({ t:'fx', notes:[{ c:'loc', t:`${WEATHER[t].i} ${WEATHER[t].n}` }] }); hist(`Počasí se změnilo: ${WEATHER[t].n}.`); }
  }
}
const hasWarm = () => S.inv.some(i => i.teple || /plášť|plast|kožich|kabát|teplé|vlněn|kožešin|deka|houně/i.test(i.nazev));
const INDOOR_RE = /hostin|krčm|hospod|taverna|chalup|dům|domě|sklep|chrám|kostel|klášter|kaple|jeskyn|důl|krypt|hrad|síň|pokoj|komnat|věž|mlýn|kovárn|obchod|krám|podzem|stáj|stodol|chýš|chatrč/;
const indoors = () => INDOOR_RE.test(low(S.location)) && !S.travel;
/* Pobyt venku v chladu nebo dešti může přinést prochladnutí. */
function exposure(hours){
  const w = wx();
  if(!(w.cold || w.wet) || hasWarm() || S.effects.some(e => e.nazev === 'Prochladnutí')) return;
  const ch = Math.min(0.6, (w.cold ? 0.12 : 0.05) * hours);
  if(Math.random() < ch){
    S.effects.push({ id:newId('e'), nazev:'Prochladnutí', typ:'nemoc', popis:'Rýma, zimnice a bolavé klouby.', postih:{ odolnost:-1, vse:-1 }, hp:-2, trvani:48, lecba:'teplo, odpočinek, horký odvar', blokuje:false });
    addLog({ t:'fx', notes:[{ c:'bad', t:'🤧 Prochladnutí' }] });
    hist(`Hráč prochladl (${w.n.toLowerCase()} bez teplého oblečení).`);
  }
}

/* =========================================================
   VÁHA, NOSNOST A JEZDECKÁ ZVÍŘATA
   ========================================================= */
const MOUNTS = { kun:{ n:'Kůň', i:'🐎', travel:0.6, unava:0.5, cap:100 }, mula:{ n:'Mula', i:'🫏', travel:0.85, unava:0.7, cap:80 }, vuz:{ n:'Vůz s koněm', i:'🛒', travel:0.8, unava:0.6, cap:400 } };
function itemWeight(it){
  if(it.vaha !== undefined && it.vaha !== null) return it.vaha * it.pocet;
  let w = 1;
  if(it.typ === 'zbran'){ const d = parseDice(it.zraneni) || { n:1, s:6, p:0 }; w = clamp(Math.round(d.n * d.s / 3), 1, 8); }

function ambientKind(){

  if(S.foes.length) return 'battle';
  const loc = low(S.location), w = S.weather?.typ, inside = indoors();
  if(!inside && w === 'bourka') return 'storm';
  if(!inside && w === 'dest') return 'rain';
  if(/hostin|krčm|hospod|taverna/.test(loc)) return 'tavern';
  if(/jeskyn|důl|doly|krypt|sklep|podzem|sluj/.test(loc)) return 'cave';
  if(isNight()) return inside ? 'fire' : 'night';
  if(/měst|trh|náměst|přístav/.test(loc)) return 'town';
  return inside ? 'fire' : 'wind';
}
function updateAmbient(){
  const k = ambOn() ? ambientKind() : null;
  if(k === SND.kind) return;
  stopAmbient();
  if(!k || !audio() || !audioReady()){ SND.kind = undefined; return; }
  SND.kind = k;
  try{ startAmbient(k); }catch(e){}
}
function stopAmbient(){
  const A = SND.amb; SND.amb = null;

  A.timers.forEach(clearTimeout);
  const t = SND.ctx.currentTime;
  A.g.gain.cancelScheduledValues(t); A.g.gain.setValueAtTime(A.g.gain.value, t); A.g.gain.linearRampToValueAtTime(0, t + 1.2);
  setTimeout(() => { A.nodes.forEach(n => { try{ n.stop ? n.stop() : 0; }catch(e){} try{ n.disconnect(); }catch(e){} }); A.g.disconnect(); }, 1400);
}

  const c = SND.ctx, g = c.createGain(), A = SND.amb = { g, nodes:[], timers:[] };
  g.gain.value = 0; g.connect(SND.ambG); g.gain.linearRampToValueAtTime(1, c.currentTime + 2);
  const bed = (type, f, q, vol, lfo) => {
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), v = c.createGain();
    s.buffer = SND.noise; s.loop = true; fl.type = type; fl.frequency.value = f; fl.Q.value = q; v.gain.value = vol;
    s.connect(fl); fl.connect(v); v.connect(g); s.start(0, Math.random());
    A.nodes.push(s, fl, v);
    if(lfo){ const o = c.createOscillator(), og = c.createGain(); o.frequency.value = lfo.rate; og.gain.value = lfo.depth; o.connect(og); og.connect(lfo.target === 'gain' ? v.gain : fl.frequency); o.start(); A.nodes.push(o, og); }
  };
  const every = (min, max, fn) => { const tick = () => { if(SND.amb !== A) return; try{ fn(); }catch(e){} A.timers.push(setTimeout(tick, min + Math.random() * (max - min))); }; A.timers.push(setTimeout(tick, Math.random() * max)); };

  switch(k){
    case 'wind': bed('bandpass', 500, 0.7, 0.22, { rate:0.08, depth:300 });
      every(3000, 9000, () => { const f = 2500 + Math.random() * 1500; tone(f, 0.12, { vol:0.035, slide:1.3, dest:g }); tone(f * 1.1, 0.1, { vol:0.03, slide:1.25, at:0.16, dest:g }); }); break;
    case 'night': bed('lowpass', 400, 0.5, 0.06);
      every(700, 1600, () => { const n = 3 + Math.floor(Math.random() * 4); for(let i = 0; i < n; i++) tone(4300 + Math.random() * 200, 0.025, { vol:0.025, at:i * 0.06, dest:g }); }); break;
    case 'rain': bed('highpass', 1400, 0.4, 0.2); bed('lowpass', 500, 0.5, 0.06); break;
    case 'storm': bed('highpass', 1200, 0.4, 0.26); bed('lowpass', 300, 0.5, 0.1);
      every(8000, 20000, () => { noiseHit(3, { f:110, type:'lowpass', vol:0.55, a:0.2, dest:g }); flashLightning(); }); break;
    case 'tavern': bed('bandpass', 380, 1.2, 0.1, { rate:0.3, depth:0.04, target:'gain' });
      every(80, 450, () => noiseHit(0.02, { f:3000 + Math.random() * 3000, q:2, vol:0.04 + Math.random() * 0.07, dest:g }));
      every(4000, 11000, () => { tone(2200, 0.2, { type:'triangle', vol:0.03, dest:g }); tone(2900, 0.25, { type:'triangle', vol:0.025, at:0.05, dest:g }); }); break;
    case 'fire': bed('lowpass', 250, 0.6, 0.07);
      every(80, 500, () => noiseHit(0.02, { f:3000 + Math.random() * 3000, q:2, vol:0.03 + Math.random() * 0.07, dest:g })); break;
    case 'cave': { bed('lowpass', 140, 0.6, 0.16, { rate:0.05, depth:40 }); const e = echo();
      every(1400, 4200, () => tone(900 + Math.random() * 700, 0.16, { vol:0.09, slide:0.7, dest:e })); break; }
    case 'town': bed('bandpass', 600, 0.5, 0.08, { rate:0.15, depth:0.03, target:'gain' });
      every(2000, 6000, () => { for(let i = 0; i < 4; i++) noiseHit(0.05, { f:900, q:2, vol:0.04, at:i * 0.4, dest:g }); }); break;
    case 'battle': bed('lowpass', 200, 0.7, 0.07);

  }
}

/* =========================================================
   3D KOSTKA d20 (canvas, bez knihoven)
   ========================================================= */
const ICO_V = (() => { const p = (1 + Math.sqrt(5)) / 2; return [[-1,p,0],[1,p,0],[-1,-p,0],[1,-p,0],[0,-1,p],[0,1,p],[0,-1,-p],[0,1,-p],[p,0,-1],[p,0,1],[-p,0,-1],[-p,0,1]]; })();

let diceSkip = null;

const qMul = (a, b) => [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2], a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];

function qRot(q, v){
  const [w, x, y, z] = q;
  const ix = w*v[0] + y*v[2] - z*v[1], iy = w*v[1] + z*v[0] - x*v[2], iz = w*v[2] + x*v[1] - y*v[0], iw = -x*v[0] - y*v[1] - z*v[2];
  return [ix*w - iw*x - iy*z + iz*y, iy*w - iw*y - iz*x + ix*z, iz*w - iw*z - ix*y + iy*x];
}
/* Natočení, ve kterém stěna s číslem `final` míří přímo k hráči (osa +z). */
function diceTarget(final, twist){
  const fi = Math.max(0, ICO_N.indexOf(final)), f = ICO_F[fi];
  const c = [0,1,2].map(k => (ICO_V[f[0]][k] + ICO_V[f[1]][k] + ICO_V[f[2]][k]) / 3), n = Math.hypot(...c), u = c.map(x => x / n);

  return qMul(qAxis([0,0,1], twist || 0), align);
}
function diceAnim(final){

  if(ls.get('dz_dice3d') === 'off' || reduce || !can2d) return new Promise(r => setTimeout(() => { if(final === 20) sfx('crit'); else if(final === 1) sfx('fail'); r(); }, reduce ? 0 : 250));

    const dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.min(window.innerWidth || 390, 440), H = 320;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    x2.setTransform(dpr, 0, 0, dpr, 0, 0);
    ov.className = 'diceov on'; num.textContent = '';
    const qT = diceTarget(final, (Math.random() - 0.5) * 0.9);
    const sAxis = [Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5], spin = (3 + Math.random() * 2) * Math.PI * 2;
    const T = 1150, t0 = performance.now(), R = 62;

    function frame(now){

        const n = Math.hypot(nx, ny, nz);
        return { f, i, nx:nx/n, ny:ny/n, nz:nz/n, cen };
      }).filter(o => o.nz > 0).sort((p, q) => p.cen[2] - q.cen[2]);
      const pr = v => [cx + v[0] * R / 1.75, cy - v[1] * R / 1.75];
      for(const o of faces){
        const pts = o.f.map(k => pr(P[k]));
        let lit = Math.max(0.25, o.nx * L[0] + o.ny * L[1] + o.nz * L[2]);
        const col = [250, 240, 216].map(v => Math.round(v * (0.55 + 0.45 * lit)));
        x2.beginPath(); x2.moveTo(...pts[0]); x2.lineTo(...pts[1]); x2.lineTo(...pts[2]); x2.closePath();
        x2.fillStyle = `rgb(${col})`; x2.fill();
        x2.strokeStyle = '#6b5530'; x2.lineWidth = 1.4; x2.stroke();
        if(o.nz > 0.35){
          const [px, py] = pr(o.cen);
          x2.fillStyle = `rgba(60,30,10,${Math.min(1, o.nz * 1.2)})`;
          x2.font = `700 ${Math.round(9 + o.nz * 11)}px Cinzel, serif`; x2.textAlign = 'center'; x2.textBaseline = 'middle';
          x2.fillText(ICO_N[o.i], px, py);
        }
      }
      if(t < 1 && !finished) raf = requestAnimationFrame(frame);
      else end();
    }
    function end(){
      if(finished) return; finished = true; cancelAnimationFrame(raf);
      num.textContent = final;
      ov.classList.add('done', final === 20 ? 'crit' : final === 1 ? 'fail' : 'norm');
      if(final === 20) sfx('crit'); else if(final === 1) sfx('fail');
      setTimeout(close, final === 20 || final === 1 ? 1100 : 700);
    }
    function close(){ ov.className = 'diceov'; diceSkip = null; res(); }
    diceSkip = () => { if(!finished){ force = true; cancelAnimationFrame(raf); frame(performance.now()); } else close(); };   /* přeskočení = kostka hned leží na hozeném čísle */
    raf = requestAnimationFrame(frame);
  });
}

const twOn = () => ls.get('dz_tw') !== 'off';
let TW = null;
function twApply(){
  const el = document.querySelector('#log .e.dm.tw');
  if(!el){ if(TW){ clearInterval(TW.timer); TW = null; } return; }
  const entry = S.log[int(el.dataset.li)];
  if(!entry || !entry.anim){ el.classList.remove('tw'); return; }
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode:n => n.parentElement.closest('.dmtools') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT }), nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const n of nodes){
    if(!n.nodeValue.trim()) continue;
    const frag = document.createDocumentFragment();
    for(const part of n.nodeValue.split(/(\s+)/)){
      if(!part) continue;
      if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); continue; }
      const s = document.createElement('span'); s.className = 'w'; s.textContent = part; frag.appendChild(s);
    }
    n.parentNode.replaceChild(frag, n);
  }
  const spans = el.querySelectorAll('span.w');
  if(!TW || TW.entry !== entry){ if(TW) clearInterval(TW.timer); TW = { entry, shown:0, timer:null }; }
  spans.forEach((s, i) => { if(i >= TW.shown) s.classList.add('hid'); });
  if(!TW.timer) TW.timer = setInterval(() => {
    const sp = document.querySelectorAll('#log .e.dm.tw span.w');
    if(TW.shown >= sp.length){ twFinish(); return; }
    sp[TW.shown].classList.remove('hid'); TW.shown++;
    if(TW.shown % 3 === 0) sfx('quill');
  }, 34);
}
function twFinish(){
  if(!TW) return;
  clearInterval(TW.timer);
  TW.entry.anim = false;
  document.querySelectorAll('#log .e.dm.tw').forEach(el => { el.classList.remove('tw'); el.querySelectorAll('span.hid').forEach(s => s.classList.remove('hid')); });

    ${c.on ? `<div class="dbtns" style="margin-top:8px"><button data-act="cloudup">⬆️ Nahrát teď</button><button data-act="clouddown">⬇️ Stáhnout</button></div>` : ''}
    <div class="dnote">${c.on ? '✅ Cloud zapnutý – ukládá se automaticky.' : 'Cloud je vypnutý.'}${last ? ' Naposledy: ' + new Date(last).toLocaleString('cs-CZ') : ''}</div>
    <button class="cancel" data-act="closesheet">Zavřít</button>`);

/* =========================================================
   BOJ PODLE PRAVIDEL 2024: kola, iniciativa, tah, reakce, stavy, mistrovství zbraní
   ========================================================= */
const MASTERY = {
  cleave:{ n:'Rozpolcení', d:'Při zásahu zaútočíš i na druhého nepřítele (zranění bez opravy, 1× za tah).' },
  graze:{ n:'Škrábnutí', d:'I když mineš, cíl utrží zranění ve výši tvé opravy vlastnosti.' },
  push:{ n:'Odstrčení', d:'Zásah odhodí cíl o 3 m od tebe.' },
  topple:{ n:'Sražení', d:'Zasažený cíl hází záchranu na odolnost, jinak padne k zemi (útoky zblízka na něj s výhodou).' },
  vex:{ n:'Výhoda', d:'Po zásahu máš na stejný cíl výhodu u dalšího útoku.' },
  sap:{ n:'Oslabení', d:'Zasažený cíl má nevýhodu u svého příštího útoku.' },
  slow:{ n:'Zpomalení', d:'Zasažený cíl je zpomalen o 3 m.' },
  nick:{ n:'Rychlý bod', d:'Lehký úder navíc: k zásahu přidáš ještě kostku zbraně (bez opravy).' }
};
const MASTERY_BY_NAME = [
  [/obouruční sekera|velká sekera|halapartn|kosa/,'cleave'], [/velký meč|obouruční meč|glévi/,'graze'],
  [/válečné kladivo|píka|beranidl/,'push'], [/hůl|trojzubec|palice|kyj/,'topple'],
  [/rapír|krátký meč|krátký luk|ruční kuše|sekerk|tesák/,'vex'], [/dlouhý meč|palcát|cep|kopí|řemdih|morgenštern|meč/,'sap'],
  [/dlouhý luk|kuše|prak|oštěp|šíp/,'slow'], [/dýk|nůž|srp|šavl|lehké kladivo/,'nick']
];
const masteryOn = () => ['barbar','valecnik','paladin','hranicar','zlodej'].includes(S.char.cls);
function weaponMastery(it){
  if(!it || it.typ !== 'zbran') return null;
  if(MASTERY[it.mistrovstvi]) return it.mistrovstvi;
  return (MASTERY_BY_NAME.find(([re]) => re.test(low(it.nazev))) || [])[1] || null;
}
const isRanged = it => !!it && /luk|kuše|prak|oštěp|vrh|šíp/.test(low(it.nazev));

/* Stavy hráče v boji. */
const PCOND = {
  srazen:{ n:'Sražen k zemi', i:'🤕', d:'Útoky zblízka proti tobě mají výhodu, tvoje útoky nevýhodu. Vstaň (stojí půl pohybu).' },
  uchopen:{ n:'Uchopen', i:'🫳', d:'Rychlost 0 – nemůžeš se pohnout, dokud se nevyprostíš.' },
  vystrasen:{ n:'Zastrašen', i:'😱', d:'Nevýhoda na útoky i zkoušky, dokud vidíš zdroj strachu.' },
  neschopen:{ n:'Neschopen akce', i:'😵', d:'Nemůžeš provádět akce ani reakce.' },
  skryty:{ n:'Skrytý', i:'🫥', d:'Nepřátelé tě nevidí: tvůj příští útok má výhodu, jejich útoky na tebe nevýhodu.' },
  uhyb:{ n:'Úhyb', i:'🛡️', d:'Do tvého dalšího tahu mají útoky proti tobě nevýhodu.' },
  odpoutani:{ n:'Odpoután', i:'↩️', d:'Tento tah tvůj pohyb nevyvolává příležitostné útoky.' }
};
const pc = () => (S.pc ||= {});
const pcondList = () => Object.keys(PCOND).filter(k => pc()[k]).map(k => ({ nazev:PCOND[k].n, i:PCOND[k].i, popis:PCOND[k].d, postih:{}, derived:true, combat:true, lecba:
  k === 'srazen' ? 'tlačítko Vstát' : k === 'uchopen' ? `vyprostit se (obtížnost ${pc().uchopen === true ? 12 : pc().uchopen})` : k === 'skryty' ? 'zmizí, když zaútočíš' : '' }));
const FOE_ST = { srazen:'🤕 sražen', vystrasen:'😱 zastrašen', neschopen:'😵 neschopen', uchopen:'🫳 uchopen', sap:'🌀 oslaben', vex:'🎯 odkrytý' };

function sanitizeFoe(raw, fresh){
  if(!raw || !raw.jmeno) return null;
  let name = String(raw.jmeno).replace(/\s+/g, ' ').trim().slice(0,30);
  /* AI občas znovu pošle nepřítele, který už bojuje – nesmí se zdvojit („Kořen 2 2“). */
  if(fresh && S.foes.some(f => !fresh.has(f.id) && low(f.jmeno) === low(name))) return null;
  if(S.foes.some(f => low(f.jmeno) === low(name))){
    const base = name.replace(/\s+\d+$/, '').slice(0,27);
    let k = 2; while(S.foes.some(f => low(f.jmeno) === low(base + ' ' + k))) k++;
    name = base + ' ' + k;
  }
  const hp = clamp(int(raw.hp) || 8, 1, 150), utok = clamp(int(raw.utok) || 3, 0, 12);
  return { id:newId('f'), jmeno:name, hp, maxHp:hp, obrana:clamp(int(raw.obrana) || 12, 6, 22), utok, zraneni:capDice(raw.zraneni, 30, '1d6'),
    iniB:clamp(raw.iniciativa === undefined ? 1 : int(raw.iniciativa), -2, 6), save:clamp(raw.zachrana === undefined ? Math.floor(utok / 2) : int(raw.zachrana), -2, 9),
    dalka:raw.dalka === true || raw.dalka === 'true', st:{} };
}

/* Začátek boje: iniciativa d20 + obratnost, překvapení = nevýhoda. */
function startCombat(prekvapeni){
  const roll2 = dis => dis ? Math.min(d20(), d20()) : d20();
  const pd = roll2(prekvapeni === 'hrac'), pIni = pd + mod(S.char.stats.obratnost);
  for(const f of S.foes) if(f.ini === undefined) f.ini = roll2(prekvapeni === 'nepratele') + f.iniB;
  S.cb = { round:1, pIni, first:true, prekvapeni:prekvapeni || null };
  S.tah = { bonus:false, slot:false, reakce:false, cleave:false };
  const order = [{ n:'Ty', v:pIni }].concat(S.foes.map(f => ({ n:f.jmeno, v:f.ini }))).sort((a,b) => b.v - a.v);
  addLog({ t:'ini', order, prekvapeni:prekvapeni || null });
  hist(`BOJ ZAČAL. Iniciativa: ${order.map(o => o.n + ' ' + o.v).join(', ')}.${prekvapeni === 'hrac' ? ' Hráč byl zaskočen.' : prekvapeni === 'nepratele' ? ' Nepřátelé byli zaskočeni.' : ''}`);
  sfx('clash');
}
/* Pozdě přidaný nepřítel dostane iniciativu taky. */
function joinCombat(){ for(const f of S.foes) if(f.ini === undefined){ f.ini = d20() + f.iniB; } }
function endCombat(){
  S.cb = null; S.tah = { bonus:false, slot:false, reakce:false, cleave:false };
  for(const k of ['skryty','uhyb','odpoutani','neschopen','vystrasen','uchopen']) delete pc()[k];
  S.effects = S.effects.filter(e => !e.kola);
}
/* Konec kola: všichni nepřátelé odehráli, začíná tvůj nový tah. */
function newPlayerTurn(){
  if(!S.cb) return;
  if(S.cb.first){ S.cb.first = false; S.tah = { bonus:false, slot:false, reakce:false, cleave:false }; return; }   /* tvůj první tah v 1. kole */
  S.cb.round++;
  S.tah = { bonus:false, slot:false, reakce:false, cleave:false };
  delete pc().uhyb; delete pc().odpoutani;
  for(const k of ['vystrasen','neschopen']) if(typeof pc()[k] === 'number'){ pc()[k]--; if(pc()[k] <= 0) delete pc()[k]; }
  for(const f of S.foes) for(const k of ['vystrasen','neschopen']) if(typeof f.st[k] === 'number'){ f.st[k]--; if(f.st[k] <= 0) delete f.st[k]; }
  S.effects = S.effects.filter(e => { if(!e.kola) return true; e.kola--; return e.kola > 0; });
}

/* Stavy v boji od AI. */
function applyCombatConds(sb){
  if(!sb || typeof sb !== 'object') return;
  const notes = [], P = pc();
  const setP = (k, v) => {
    if(v === false || v === null){ if(P[k]){ delete P[k]; notes.push({ c:'good', t:`✔️ ${PCOND[k].n} – už ne` }); } return; }
    if(!P[k]) notes.push({ c:'bad', t:`${PCOND[k].i} ${PCOND[k].n}` });
    P[k] = k === 'uchopen' ? (int(v) >= 5 ? clamp(int(v), 5, 25) : 12) : ['vystrasen','neschopen'].includes(k) ? (int(v) > 1 ? clamp(int(v), 1, 5) : 2) : true;
  };
  if(sb.hrac && typeof sb.hrac === 'object') for(const k of ['srazen','uchopen','vystrasen','neschopen']) if(k in sb.hrac) setP(k, sb.hrac[k]);
  if(sb.nepratele && typeof sb.nepratele === 'object') for(const [name, st] of Object.entries(sb.nepratele)){
    const f = findFoe(name); if(!f || !st || typeof st !== 'object') continue;
    for(const k of ['srazen','vystrasen','neschopen','uchopen']) if(k in st){
      if(st[k] === false || st[k] === null) delete f.st[k];
      else { f.st[k] = ['vystrasen','neschopen'].includes(k) ? (int(st[k]) > 1 ? clamp(int(st[k]), 1, 5) : 2) : true; notes.push({ c:'good', t:`${f.jmeno}: ${FOE_ST[k]}` }); }
    }
  }
  if(notes.length) addLog({ t:'fx', notes });
}

/* ---------- Reakce (1× za kolo, samy od sebe) ---------- */
const reactOn = () => ls.get('dz_autoreact') !== 'off';
const reactAbil = kind => knownAbilities().find(a => a.reaction === kind && abilityLeft(a) > 0);
function spendAbil(a){ if(a.slot) S.slots--; else S.res[a.id] = abilityLeft(a) - 1; }
/* Před zásahem: Štít může útok odrazit. */
function reactShield(total, d, ac){
  if(!reactOn() || S.tah?.reakce || pc().neschopen || d === 20) return false;
  const a = reactAbil('shield');
  if(!a || total >= ac + 5) return false;
  spendAbil(a); S.tah.reakce = true;
  S.effects.push({ id:newId('e'), nazev:'Štít', typ:'pozehnani', popis:'+5 k obraně do tvého dalšího tahu.', postih:{}, obrana:5, kola:1, hp:0, lecba:'', blokuje:false });
  addLog({ t:'fx', notes:[{ c:'good', t:`🛡️ Reakce: Štít (+5 obrana) – útok odražen` }] });
  hist('Hráč reakcí seslal Štít (+5 k obraně do svého tahu) a útok tím odrazil.');
  return true;
}
/* Po zásahu: snížení zranění. Vrací nové zranění. */
function reactReduce(dmg){
  if(!reactOn() || S.tah?.reakce || pc().neschopen || dmg <= 0) return dmg;
  const c = S.char;
  for(const kind of ['deflect','reduce','half']){
    const a = reactAbil(kind); if(!a) continue;
    let red = kind === 'half' ? Math.ceil(dmg / 2) : rollDice(kind === 'deflect' ? '1d10' : '1d12').total + Math.max(0, mod(c.stats[kind === 'deflect' ? 'obratnost' : 'odolnost'])) + (kind === 'deflect' ? c.level : 0);
    red = Math.min(dmg, red);
    spendAbil(a); S.tah.reakce = true;
    addLog({ t:'fx', notes:[{ c:'good', t:`${a.i} Reakce: ${a.nazev} (−${red} zranění)` }] });
    hist(`Hráč reakcí použil ${a.nazev} a snížil zranění o ${red}.`);
    return dmg - red;
  }
  return dmg;
}
/* Po utrženém zranění: odveta (Pekelné pokárání). */
function reactRebuke(f){
  if(!reactOn() || S.tah?.reakce || pc().neschopen || !S.foes.includes(f)) return;
  const a = reactAbil('rebuke'); if(!a) return;
  spendAbil(a); S.tah.reakce = true;
  const dmg = Math.max(1, rollDice(aDice(a)).total + castMod(a));
  addLog({ t:'fx', notes:[{ c:'gold', t:`${a.i} Reakce: ${a.nazev} → ${f.jmeno}` }] });
  hist(`Hráč reakcí seslal ${a.nazev} na ${f.jmeno} za ${dmg} zranění. ${hurtFoe(f, dmg)}`);
}

/* ---------- Útoky nepřátel ---------- */
function foeAttacks(names){
  const done = new Set();
  for(const n of names.slice(0,6)){
    if(S.char.hp <= 0 || S.dying) break;
    const f = findFoe(n);
    if(!f || done.has(f.id)) continue;
    done.add(f.id);
    if(f.st.neschopen){ addLog({ t:'fx', notes:[{ c:'good', t:`😵 ${f.jmeno} nemůže jednat` }] }); hist(`${f.jmeno} je neschopen akce a neútočí.`); continue; }
    if(f.st.srazen){ delete f.st.srazen; addLog({ t:'fx', notes:[{ c:'foe', t:`🧍 ${f.jmeno} vstává` }] }); }
    let adv = 0; const why = [];
    if(pc().srazen){ adv += f.dalka ? -1 : 1; why.push(f.dalka ? 'ležíš – na dálku hůř' : 'ležíš na zemi'); }
    if(pc().skryty){ adv--; why.push('jsi skrytý'); }
    if(pc().uhyb){ adv--; why.push('uhýbáš'); }
    if(f.st.vystrasen){ adv--; why.push('je zastrašen'); }
    if(f.st.sap){ adv--; why.push('oslaben'); delete f.st.sap; }
    adv = clamp(adv, -1, 1);
    const d1 = d20(), d2 = adv ? d20() : null, d = adv > 0 ? Math.max(d1, d2) : adv < 0 ? Math.min(d1, d2) : d1;
    let ac = armorClass(), total = d + f.utok;
    let hit = d === 20 || (d !== 1 && total >= ac);
    if(hit && reactShield(total, d, ac)){ hit = false; ac = armorClass(); }
    let dmg = 0, absorbed = 0;
    if(hit){
      dmg = Math.max(1, rollDice(f.zraneni, d === 20).total);
      if(S.effects.some(e => e.odolnost)) dmg = Math.max(1, Math.floor(dmg / 2));
      dmg = reactReduce(dmg);
      absorbed = Math.min(S.char.temp || 0, dmg); S.char.temp = (S.char.temp || 0) - absorbed;
      S.char.hp = Math.max(0, S.char.hp - (dmg - absorbed));
      wear(equipped('zbroj'), 2); wear(equipped('stit'), 1);
      if(pc().skryty) delete pc().skryty;
    }
    sfx(hit ? 'hit' : 'miss');
    addLog({ t:'roll', enemy:true, title:`${f.jmeno} útočí${adv ? (adv > 0 ? ' · výhoda' : ' · nevýhoda') + ' (' + why.join(', ') + ')' : ''}`, d, d2:adv ? (d === d1 ? d2 : d1) : null,
      parts:[{ n:'útok', v:f.utok }], total, dc:ac, dcl:'tvá obrana', ok:!hit,
      res: hit ? `Zásah! −${dmg - absorbed} HP${absorbed ? ` (${absorbed} pohltily dočasné životy)` : ''}${d === 20 ? ' (kritický)' : ''}` : (d === 1 ? 'Minul (kritický neúspěch)' : 'Minul') });
    hist(`${f.jmeno} útočí: d20=${d}${adv ? (adv > 0 ? ' s výhodou' : ' s nevýhodou') : ''} +${f.utok} = ${total} proti obraně hráče ${ac} → ${hit ? `ZÁSAH za ${dmg} zranění${d === 20 ? ' (kritický)' : ''}, hráč má ${S.char.hp}/${S.char.maxHp} HP` : 'MINUL'}.`);
    if(hit && dmg > 0 && S.char.hp > 0) reactRebuke(f);
  }
}

/* ---------- Mistrovství zbraní a útok navíc ---------- */
/* Efekt mistrovství po útoku; vrací text pro AI. */
function applyMastery(m, hit, foe, dmgDice, sm, d){
  if(!m || !masteryOn() || !foe) return '';
  const notes = [], M = MASTERY[m];
  let txt = '';
  if(hit && m === 'vex' && S.foes.includes(foe)){ foe.vex = true; txt = `Mistrovství ${M.n}: další útok na ${foe.jmeno} s výhodou.`; notes.push({ c:'gold', t:`🎯 ${M.n}` }); }
  if(hit && m === 'sap' && S.foes.includes(foe)){ foe.st.sap = true; txt = `Mistrovství ${M.n}: ${foe.jmeno} má nevýhodu u příštího útoku.`; notes.push({ c:'gold', t:`🌀 ${M.n}: ${foe.jmeno}` }); }
  if(hit && m === 'push'){ txt = `Mistrovství ${M.n}: ${foe.jmeno} byl odhozen o 3 m.`; notes.push({ c:'gold', t:`💨 ${M.n}` }); }
  if(hit && m === 'slow'){ txt = `Mistrovství ${M.n}: ${foe.jmeno} je zpomalen.`; notes.push({ c:'gold', t:`🐌 ${M.n}` }); }
  if(hit && m === 'topple' && S.foes.includes(foe)){
    const dc = 8 + profBonus() + sm, sv = d20() + foe.save;
    if(sv < dc){ foe.st.srazen = true; txt = `Mistrovství ${M.n}: ${foe.jmeno} neuspěl v záchraně (${sv} < ${dc}) a leží na zemi.`; notes.push({ c:'gold', t:`🤕 ${foe.jmeno} sražen` }); }
    else { txt = `Mistrovství ${M.n}: ${foe.jmeno} se udržel na nohou (${sv} ≥ ${dc}).`; notes.push({ c:'foe', t:`${foe.jmeno} se udržel` }); }
  }
  if(hit && m === 'nick' && S.foes.includes(foe)){
    const v = Math.max(1, rollDice(dmgDice).total);
    notes.push({ c:'gold', t:`🗡️ ${M.n}` });
    txt = `Mistrovství ${M.n}: lehký úder navíc za ${v}. ${hurtFoe(foe, v)}`;
  }
  if(hit && m === 'cleave' && !S.tah?.cleave){
    const other = S.foes.find(f => f !== foe);
    if(other){
      S.tah.cleave = true;
      const r = d20(), parts = rollParts({ utok:'zbran', vlastnost:usableWeapon()?.vlastnost || 'sila' }), tot = r + parts.reduce((a,x) => a + x.v, 0);
      if(r === 20 || (r !== 1 && tot >= other.obrana)){ const v = Math.max(1, rollDice(dmgDice, r === 20).total); notes.push({ c:'gold', t:`🪓 ${M.n}: ${other.jmeno}` }); txt = `Mistrovství ${M.n}: zásah i do ${other.jmeno} (${tot} vs ${other.obrana}) za ${v}. ${hurtFoe(other, v)}`; }
      else { notes.push({ c:'foe', t:`🪓 ${M.n}: ${other.jmeno} minut` }); txt = `Mistrovství ${M.n}: druhý úder na ${other.jmeno} minul (${tot} vs ${other.obrana}).`; }
    }
  }
  if(!hit && m === 'graze' && sm > 0 && S.foes.includes(foe)){ notes.push({ c:'gold', t:`🩸 ${M.n}` }); txt = `Mistrovství ${M.n}: i přes minutí ${sm} zranění. ${hurtFoe(foe, sm)}`; }
  if(notes.length) addLog({ t:'fx', notes });
  return txt;
}
/* Útok navíc (5. úroveň) – druhý plnohodnotný hod. */
function extraAttack(firstTarget){
  const w = usableWeapon(), a = attackInfo({ utok:'zbran' });
  const foe = S.foes.includes(firstTarget) ? firstTarget : S.foes[0];
  if(!foe) return '';
  const vl = w ? w.vlastnost : fists().stat, sm = mod(S.char.stats[vl]);
  let adv = 0;
  if(foe.st.srazen) adv += isRanged(w) ? -1 : 1;
  if(foe.vex){ adv++; delete foe.vex; }
  if(pc().srazen || pc().vystrasen) adv--;
  adv = clamp(adv, -1, 1);
  const d1 = d20(), d2 = adv ? d20() : null, d = adv > 0 ? Math.max(d1, d2) : adv < 0 ? Math.min(d1, d2) : d1;
  const parts = rollParts({ utok:'zbran', vlastnost:vl }), total = d + parts.reduce((s,x) => s + x.v, 0);
  const crit = d >= (S.char.level >= 3 && perk('crit19') ? 19 : 20), hit = crit || (d !== 1 && total >= foe.obrana);
  let dmg = 0, txt = `Útok navíc na ${foe.jmeno}: d20=${d}${adv ? (adv > 0 ? ' s výhodou' : ' s nevýhodou') : ''} = ${total} vs ${foe.obrana} → ${hit ? 'ZÁSAH' : 'MINUL'}.`;
  if(hit){
    dmg = Math.max(1, rollDiceMult(a.dice, crit ? 2 : 1) + sm + a.bonus);
    for(const e of S.effects){ if(e.extraDmg) dmg += rollDice(e.extraDmg, crit).total; if(e.dmgBonus) dmg += e.dmgBonus; }
    if(S.char.level >= 3 && perk('extraHit')) dmg += rollDice(perk('extraHit'), crit).total;
  }
  addLog({ t:'roll', title:`Útok navíc – ${a.nazev} na ${foe.jmeno}${adv ? (adv > 0 ? ' · výhoda' : ' · nevýhoda') : ''}`, d, d2:adv ? (d === d1 ? d2 : d1) : null, parts, total, dc:foe.obrana, dcl:'obrana', ok:hit, res:hit ? `Zásah! · zranění ${dmg}` : 'Minul' });
  sfx(hit ? 'clash' : 'miss');
  if(hit) txt += ` Zranění ${dmg}. ${hurtFoe(foe, dmg)}`;
  const mt = applyMastery(weaponMastery(w), hit, foe, a.dice, sm, d);
  if(w) wear(w, 1);
  return txt + (mt ? ' ' + mt : '');
}

/* ---------- Bojové akce (tlačítka) ---------- */
const inCombat = () => S && S.foes.length > 0;
async function attackAction(kind){
  if(!canAct() || !inCombat()) return;
  const foe = S.foes.length === 1 ? S.foes[0] : await pick(kind === 'kouzlo' ? `${spell().nazev} – na koho?` : 'Na koho zaútočíš?', S.foes.map(f => ({ label:`${f.jmeno} (${f.hp}/${f.maxHp} HP${Object.keys(f.st).length ? ' · ' + Object.keys(f.st).map(k => FOE_ST[k] || k).join(', ') : ''})`, value:f })));
  if(!foe || !canAct()) return;
  const w = usableWeapon();
  const txt = kind === 'kouzlo' ? `Sešlu ${spell().nazev} na ${foe.jmeno}.` : `Zaútočím ${w ? w.nazev.toLowerCase() : 'holýma rukama'} na ${foe.jmeno}.`;
  twFinish(); stopSpeak();
  addLog({ t:'player', text:(kind === 'kouzlo' ? '✨ ' : '⚔️ ') + txt }); book('hrac', txt);
  S.history.push({ kdo:'hrac', text:txt + ' (akce Útok)' });
  setPending({ utok:kind, cil:foe.jmeno, duvod:'Akce Útok' });
  render(); save();
}
function hideAction(){
  if(!canAct()) return;
  addLog({ t:'player', text:'🫥 Pokusím se schovat (akce Schování).' }); book('hrac', 'Pokusí se schovat.');
  S.history.push({ kdo:'hrac', text:'Pokusím se schovat (akce Schování, Nenápadnost proti obtížnosti 15).' });
  setPending({ vlastnost:'obratnost', obtiznost:15, duvod:'Schování – Nenápadnost DC 15' });
  if(S.pending) S.pending.hide = true;
  render(); save();
}
function standUp(){
  if(!pc().srazen || busy || S.dead || S.dying) return;
  delete pc().srazen;
  addLog({ t:'fx', notes:[{ c:'good', t:'🧍 Vstal jsi (půl pohybu)' }] }); hist('Hráč vstal ze země (stálo ho to polovinu pohybu).');
  render(); save();
}
function escapeAction(){
  if(!canAct() || !pc().uchopen) return;
  const st = S.char.stats.sila >= S.char.stats.obratnost ? 'sila' : 'obratnost';
  addLog({ t:'player', text:'🔓 Pokusím se vyprostit.' });
  S.history.push({ kdo:'hrac', text:`Pokusím se vyprostit ze sevření (${statName(st)}).` });
  setPending({ vlastnost:st, obtiznost:pc().uchopen === true ? 12 : pc().uchopen, duvod:'Vyproštění ze sevření' });
  if(S.pending) S.pending.escape = true;
  render(); save();
}
function combatChip(k){
  if(k === 'atk') return attackAction('zbran');
  if(k === 'cast') return attackAction('kouzlo');
  if(k === 'hide') return hideAction();
  if(k === 'stand') return standUp();
  if(k === 'escape') return escapeAction();
  if(k === 'dodge'){ pc().uhyb = true; return act('Kryji se a uhýbám (akce Úhyb) – do mého dalšího tahu mají útoky proti mně nevýhodu.', '🛡️ Úhyb'); }
  if(k === 'dis'){ pc().odpoutani = true; return act('Odpoutám se od nepřátel a ustoupím (akce Odpoutání) – můj pohyb nevyvolá příležitostné útoky.', '↩️ Odpoutání'); }
  if(k === 'wait') return act('[Hráč je neschopen akce a tento tah nemůže nic dělat.]', '⏳ Nemohu jednat…');
  const pre = { dash:'Sprintuji (akce Sprint) ', help:'Pomůžu (akce Pomoc) ', ready:'Připravím se (akce Příprava): až ' }[k];
  if(pre){ $('#input').value = pre; autosize(); $('#input').focus(); }
}
function combatActions(){
  const q = [];
  if(pc().neschopen) return [['wait','⏳ Přečkat kolo']];
  if(pc().srazen) q.push(['stand','🧍 Vstát']);
  if(pc().uchopen) q.push(['escape','🔓 Vyprostit se']);
  const w = usableWeapon();
  q.push(['atk', `⚔️ Útok${w ? ' – ' + w.nazev : ''}`]);
  if(spell()) q.push(['cast', `✨ ${spell().nazev}`]);
  return q;
}
const combatActions2 = () => pc().neschopen ? [] : [['hide','🫥 Schovat se'],['dodge','🛡️ Úhyb'],['dis','↩️ Odpoutání'],['dash','🏃 Sprint'],['help','🤝 Pomoc'],['ready','⏳ Příprava']];
function iniBar(){
  if(!S.cb) return '';
  const order = [{ n:'Ty', v:S.cb.pIni, me:true }].concat(S.foes.map(f => ({ n:f.jmeno, v:f.ini ?? 0 }))).sort((a,b) => b.v - a.v);
  return `<div class="inibar"><b>⚔️ Kolo ${S.cb.round}</b><small>${S.tah?.bonus ? '⚡ bonus použit' : '⚡ bonus volný'} · ${S.tah?.reakce ? '↺ reakce použita' : '↺ reakce volná'}</small>
    <span class="ord">Pořadí: ${order.map(o => `<i class="${o.me ? 'me' : ''}">${esc(o.n)} (${o.v})</i>`).join(' → ')}</span></div>`;
}

/* =========================================================
   DEMO PÁN JESKYNĚ (bez AI – na test mechaniky)
   ========================================================= */
async function mockDM(req){
  await new Promise(r => setTimeout(r, 500));
  const v = req.vstup, t = low(v.text), foes = S.foes, alive = foes.map(f => f.jmeno);
  const base = { zkouska:null, shrnuti:req.potrebaShrnuti ? 'Demo shrnutí příběhu.' : null };
  if(v.typ === 'start' && story()){ const P = story(); return { ...base,
    vypraveni:`${P.uvod}\n\n${P.hacek.replace(/\s*\(.*\)$/, '')} *(demo)*`,
    efekty:{ lokace:P.mista[0][0], novy_ukol:{ nazev:P.nazev, popis:P.kratce }, npc:[{ jmeno:P.npc[0][0], popis:P.npc[0][1], vztah:'neutrální' }] },
    navrhy:['Rozhlédnu se','Utíkám'] }; }
  if(v.typ === 'start') return { ...base,
    vypraveni:`Déšť bubnuje do okenic hostince **U Zlomeného kola**. U krbu sedí jen pár unavených pocestných.\n\nHostinský se k tobě nakloní přes pult: „Hledáš práci, cizinče? Ve sklepě se po nocích něco ozývá. Dám ti deset zlaťáků, když zjistíš co.“`,
    efekty:{ lokace:'Hostinec U Zlomeného kola', novy_ukol:{ nazev:'Tajemství sklepa', popis:'Hostinský Bořek slíbil 10 zlatých, když zjistíš, co se po nocích ozývá ve sklepě.' },
      npc:[{ jmeno:'Bořek', popis:'Zavalitý hostinský s jizvou přes nos', vztah:'přátelský' }] },
    navrhy:['Sejdu do sklepa','Koupím si zbroj','Objednám si pivo'] };
  if(v.typ === 'prichod') return { ...base, vypraveni:`Po ${v.hodiny} h cesty dorazíš do **${v.cil}**. *(demo)*`, efekty:{ lokace:v.cil }, navrhy:['Rozhlédnu se'] };
  if(v.typ === 'udalost') return { ...base, vypraveni:`Na cestě do ${v.cil} se něco stane: ${v.popis.slice(0,60)}… *(demo)*`, efekty:{}, navrhy:['Pokračuji do ' + v.cil] };
  if(v.typ === 'noc') return { ...base, vypraveni:`Vzbudíš se uprostřed noci. ${v.popis.slice(0,50)}… *(demo)*`, efekty:{}, navrhy:['Rozhlédnu se'] };
  if(v.typ === 'bezvedomi') return { ...base, vypraveni:`Probouzíš se. ${v.zazrak ? 'Zázrakem.' : 'Někdo tě okradl.'} *(demo)*`, efekty:v.zazrak ? {} : { zlato:-3 }, navrhy:['Vstanu'] };
  if(/kovář|oprav/.test(t)) return { ...base, vypraveni:'Kovář ti vše opraví. *(demo)*', efekty:{ oprava:'vse', zlato:-5, npc:[{ jmeno:'Kovář Ota', popis:'Svalnatý kovář', vztah:'neutrální', zmena:5 }] }, navrhy:[] };
  if(/kůň|koně/.test(t)) return { ...base, vypraveni:'Koupíš koně. *(demo)*', efekty:{ jezdecke:{ typ:'kun', nazev:'Hnědák' }, zlato:-8 }, navrhy:[] };
  if(/pomůžu|pomoc/.test(t)) return { ...base, vypraveni:'Bořek je ti vděčný. *(demo)*', efekty:{ xp:60, npc:[{ jmeno:'Bořek', zmena:15 }], povest:[{ misto:S.location, zmena:10 }] }, navrhy:[] };
  if(/splněn|hotovo/.test(t)) return { ...base, vypraveni:'Úkol je hotov. *(demo)*', efekty:{ splneny_ukol:S.quests.find(q => !q.done)?.title || '' }, navrhy:[] };
  if(/kámen|balvan/.test(t)) return { ...base, vypraveni:'Zvedneš obří balvan. *(demo)*', efekty:{ pridat:[{ nazev:'Žulový balvan', typ:'ostatni', vaha:60 }] }, navrhy:[] };
  if(/pokračuj/.test(t) && S.travel) return { ...base, vypraveni:`Dorazíš do **${S.travel.cil}**. *(demo)*`, efekty:{ lokace:S.travel.cil }, navrhy:['Rozhlédnu se'] };
  if(/vyrazím|na cestu/.test(t)) return { ...base, vypraveni:'Vyrazíš na cestu do Okova. *(demo)*', efekty:{ cesta:{ cil:'Okov', hodiny:4, nebezpeci:'vysoke' } }, navrhy:[] };
  if(/vyspat|vyspím|utábořím|spát/.test(t)) return { ...base, vypraveni:'Uložíš se ke spánku. *(demo)*', efekty:{ spanek:{ hodiny:8, bezpecne:/pokoj/.test(t) } }, navrhy:['Vstanu'] };
  if(/bažin|napiju/.test(t)) return { ...base, vypraveni:'Voda chutná zatuchle. Brzy tě zamrazí. *(demo)*', efekty:{ cas_hodiny:1, stavy:[{ nazev:'Bahenní horečka', typ:'nemoc', popis:'Třesou se ti ruce, máš horečku.', postih:{ odolnost:-2, vse:-1 }, hp_za_den:-4, trvani_hodin:null, lecba:'bylinkář nebo kněz', blokuje_leceni:true }] }, navrhy:[] };
  if(/bylink|vylé/.test(t)) return { ...base, vypraveni:'Bylinkářka ti uvaří odvar. Horečka ustoupí. *(demo)*', efekty:{ odebrat_stavy:['Bahenní horečka'], zlato:-5, jidlo:true }, navrhy:[] };
  if(v.typ === 'hod'){
    if(foes.length) return { ...base, vypraveni:'Krysy syčí a vrhají se na tebe. *(demo)*', efekty:{ utoci:alive }, navrhy:['Zaútočím znovu','Vypiju lektvar'] };
    return { ...base, vypraveni:/padl|boj skončil/i.test(v.popis) ? 'Poslední krysa padla. Ve sklepě je ticho. *(demo)*' : 'Hotovo. *(demo)*', efekty:{}, navrhy:['Prohledám truhlu','Vrátím se nahoru'] };
  }
  if(/kup|zbroj/.test(t)) return { ...base, vypraveni:'Bořek ti nabídne plátovou zbroj za 400 zlatých. *(demo)*',
    efekty:{ zlato:-400, pridat:[{ nazev:'Plátová zbroj', typ:'zbroj', obrana:5 }] }, navrhy:['Prohledám truhlu'] };
  if(/truhl|prohled/.test(t)) return { ...base, vypraveni:'Víko truhly zaskřípe. Uvnitř se něco zaleskne. *(demo)*',
    efekty:{ nalezeno:{ zlato:14, predmety:[
      { nazev:'Plamenný meč', typ:'zbran', vzacnost:'vzacna', zraneni:'1d8', vlastnost:'sila', bonus:2, popis:'Čepel slabě žhne do ruda.' },
      { nazev:'Lektvar léčení', typ:'lektvar', leceni:'2d4+2', pocet:2, popis:'Rudá tekutina.' },
      { nazev:'Amulet sovy', typ:'doplnek', vzacnost:'neobvykla', vlastnost:'moudrost', bonus:1, popis:'Stříbrná sova s jantarovýma očima.' },
      { nazev:'Meč bohů', typ:'zbran', vzacnost:'bezna', zraneni:'10d20', bonus:9, popis:'Test limitů – AI to přehnala.' } ] } },
    navrhy:['Vrátím se nahoru'] };
  if(/sklep|krys|útoč|utoc|zaútoč/.test(t)){
    if(!foes.length) return { ...base, vypraveni:'Ze tmy vyrazí dvě **obří krysy**! *(demo)*',
      efekty:{ nepratele:[{ jmeno:'Obří krysa', hp:7, obrana:12, utok:3, zraneni:'1d4' }, { jmeno:'Obří krysa', hp:7, obrana:12, utok:3, zraneni:'1d4' }], lokace:'Sklep hostince' },
      navrhy:['Zaútočím na krysu','Vypiju lektvar'] };
    return { ...base, vypraveni:`Napřáhneš se proti **${alive[0]}**… *(demo)*`, efekty:{},
      zkouska:{ vlastnost:'sila', obtiznost:10, utok:'zbran', cil:alive[0], duvod:'Útok' }, navrhy:[] };
  }
  return { ...base, vypraveni:'Bořek pokývá hlavou: „Zajímavá volba.“ *(demo)*', efekty:foes.length ? { utoci:alive } : {}, navrhy:['Sejdu do sklepa','Prohledám truhlu'] };
}
