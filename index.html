  if(on){ audio(); SND.ctx?.resume?.(); }
  SND.kind = undefined; render();
};

/* ---------- Detail předmětu ---------- */
const avgDice = s => { const d = parseDice(s); return d ? d.n * (d.s + 1) / 2 + d.p : 0; };
const fmtNum = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
function diffHTML(a, b, f = fmtNum){
  const d = Math.round((b - a) * 10) / 10;
  return `${f(a)} → <b class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${f(b)}</b>`;
}
/* Bojové hodnoty, které by měla daná zbraň v rukou této postavy. */
function weaponCalc(w){
  const c = S.char;
  const pb = profBonus();
  if(!w || wearPenalty(w) >= 99){ const f = fists(); return { hit:mod(c.stats[f.stat]) + pb + (gearBonus(f.stat)?.v || 0), dmg:Math.max(1, avgDice(f.dice) + mod(c.stats[f.stat])), dice:f.dice, m:mod(c.stats[f.stat]) }; }
  const m = mod(c.stats[w.vlastnost]), b = w.bonus - wearPenalty(w);
  return { hit:m + b + pb + (gearBonus(w.vlastnost)?.v || 0), dmg:Math.max(1, avgDice(w.zraneni) + m + b), dice:w.zraneni, m:m + b };
}
function itemDetail(it){
  const c = S.char, rows = [], slot = TYPES[it.typ].slot, eq = isEquipped(it);
  rows.push(['Typ', TYPES[it.typ].n], ['Vzácnost', RAR[it.vzacnost].n]);
  let cmp = '';
  if(it.typ === 'zbran'){
    const me = weaponCalc(it), cur = equipped('zbran');
    rows.push(['Útok', `d20 ${fmtMod(me.hit)}`], ['Zranění', `${it.zraneni} ${fmtMod(me.m)}`], ['Průměrné zranění', fmtNum(me.dmg)],
      ['Používá', statName(it.vlastnost) + ` (${fmtMod(mod(c.stats[it.vlastnost]))})`]);
    if(it.bonus) rows.push(['Magický bonus', `+${it.bonus} k útoku i zranění`]);
    const ms = weaponMastery(it);
    if(ms) rows.push(['Mistrovství', `${MASTERY[ms].n}${masteryOn() ? '' : ' (tvé povolání ho nevyužije)'} – ${MASTERY[ms].d}`]);
    if(isRanged(it)) rows.push(['Dosah', 'na dálku']);
    if(!eq){ const o = weaponCalc(cur);
      cmp = `<div class="cmp"><b>Oproti ${cur ? esc(cur.nazev) : 'holým pěstem'}</b>Útok ${diffHTML(o.hit, me.hit, fmtMod)} · Prům. zranění ${diffHTML(o.dmg, me.dmg)}</div>`; }
  }else if(it.typ === 'zbroj' || it.typ === 'stit'){
    const val = it.obrana + it.bonus, cur = equipped(slot), now = armorClass();
    rows.push(['Obrana', `+${val}${it.bonus ? ` (${it.obrana} + ${it.bonus} magie)` : ''}`]);
    if(!eq){ const after = now - (cur ? cur.obrana + cur.bonus : 0) + val;
      cmp = `<div class="cmp"><b>Tvoje obrana ${cur ? 'místo ' + esc(cur.nazev) : 'po nasazení'}</b>🛡️ ${diffHTML(now, after)}</div>`; }
  }else if(it.typ === 'doplnek'){
    rows.push(['Účinek', `+${it.bonus} ke všem hodům na ${statName(it.vlastnost).toLowerCase()}`]);
    const cur = equipped('doplnek');
    if(!eq && cur) cmp = `<div class="cmp"><b>Nahradí ${esc(cur.nazev)}</b>+${cur.bonus} ${esc(statName(cur.vlastnost))} → <b>+${it.bonus} ${esc(statName(it.vlastnost))}</b></div>`;
  }else if(it.typ === 'lektvar'){
    if(it.leceni) rows.push(['Léčení', `${it.leceni} HP (prům. ${fmtNum(avgDice(it.leceni))})`], ['Tvoje životy', `${c.hp}/${c.maxHp}`]);
    if(it.efekt) rows.push(['Účinek', it.efekt]);
    rows.push(['Počet', `${it.pocet} ks`]);
  }else if(it.typ === 'svitek'){
    if(it.zraneni) rows.push(['Zranění', `${it.zraneni} (prům. ${fmtNum(avgDice(it.zraneni))})`], ['Zásah', 'vždy, na zvolený cíl']);
    if(it.efekt) rows.push(['Účinek', it.efekt]);
    rows.push(['Počet', `${it.pocet} ks`, ]);
  }else if(it.pocet > 1) rows.push(['Počet', `${it.pocet} ks`]);
  if(['zbran','zbroj','stit'].includes(it.typ) && wearOn()) rows.push(['Stav výbavy', wearOf(it) <= 0 ? '💔 rozbité – oprav u kováře' : wearOf(it) <= 25 ? `⚠️ ${wearOf(it)} % (postih −1)` : `${wearOf(it)} %`]);
  rows.push(['Váha', `${fmtNum(itemWeight(it))} kg`]);
  if(it.teple) rows.push(['Teplé', '🧥 chrání před zimou a deštěm']);
  if(eq) rows.push(['Nasazeno', '✅ ano']);

  const free = !busy && !S.dead, usable = canAct(), btn = [];
  if(slot) btn.push(eq ? `<button data-act="unequip" data-slot="${slot}" ${free?'':'disabled'}>Sundat</button>`
                       : `<button class="main" data-act="equip" data-id="${it.id}" ${free?'':'disabled'}>Nasadit</button>`);
  if(['lektvar','svitek','ostatni','jidlo'].includes(it.typ))
    btn.push(`<button class="main" data-act="use" data-id="${it.id}" ${usable?'':'disabled'}>${it.typ === 'lektvar' ? 'Vypít' : it.typ === 'svitek' ? 'Přečíst' : it.typ === 'jidlo' ? 'Sníst' : 'Použít'}</button>`);
  btn.push(`<button class="danger" data-act="drop" data-id="${it.id}" ${free?'':'disabled'}>🗑️</button>`);
  const why = !usable && ['lektvar','svitek','ostatni','jidlo'].includes(it.typ) && !S.dead
    ? `<div class="dnote">${busy ? 'Pán jeskyně právě vypráví…' : S.pending ? 'Nejdřív hoď kostkou.' : S.loot ? 'Nejdřív vyřeš nález.' : ''}</div>` : '';

  return `<div class="dhead"><div class="ico">${TYPES[it.typ].i}</div><div><h2>${esc(it.nazev)}${it.pocet > 1 ? ' ×' + it.pocet : ''}</h2><small>${RAR[it.vzacnost].n} ${TYPES[it.typ].n.toLowerCase()}</small></div></div>
    ${it.popis ? `<div class="ddesc">${esc(it.popis)}</div>` : ''}
    <div class="dstats">${rows.map(([k,v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${cmp}<div class="dbtns">${btn.join('')}</div>${why}`;
}
function showItem(id){
  const it = S.inv.find(x => x.id === id);
  if(!it){ closeSheet(); return; }
  detailId = id;
  openSheet(itemDetail(it), RAR[it.vzacnost].c);

/* Zápisky pod vyprávěním (úkol, postava, místo, zlato…) – jednotný úhledný seznam; na co jde klepnout, má šipku. */
const FX_KIND = { quest:['Úkol','quests'], npc:['Postava','npcs'], loc:['Místo','map'], wx:['Počasí',''], clue:['Stopa','quests'], fact:['Paměť','chron'], shop:['Obchod','shop'] };
function fxHTML(notes){
  let list = notes.map(n => ({ ...n }));
  /* noví nepřátelé do jednoho řádku (podrobnosti jsou v liště boje nahoře) */
  const nf = list.filter(n => n.c === 'foe' && /^👹 /.test(n.t));
  if(nf.length > 1){ const first = list.indexOf(nf[0]); list = list.filter(n => !nf.includes(n)); list.splice(first, 0, { c:'foe', t:'👹 ' + nf.map(n => n.t.slice(3)).join(', ') }); }
  /* „Nové místo na mapě: X“ + „📍 X…“ → jeden řádek */
  const mapN = list.find(n => n.c === 'loc' && n.t.startsWith('🗺️'));
  if(mapN){
    const name = mapN.t.replace(/^🗺️\s*Nové místo na mapě:\s*/, '');
    const locN = list.find(n => n !== mapN && n.c === 'loc' && n.t.startsWith('📍') && low(n.t).includes(low(name)));
    if(locN){ locN.nove = true; list.splice(list.indexOf(mapN), 1); }
    else { mapN.t = '📍 ' + name; mapN.nove = true; }
  }
  const row = n => {
    const m = n.t.match(/^(\S+)\s+([\s\S]*)$/), emo = m && !/^[\p{L}\p{N}+\-−]/u.test(m[1]);
    const ic = emo ? m[1] : ({ gold:'💰', good:'✨', bad:'⚠️', foe:'👹', quest:'📜', loc:'📍', npc:'👤' }[n.c] || '•'), txt = emo ? m[2] : n.t;
    const k = FX_KIND[n.c];
    let lbl = '';
    if(k && n.c === 'quest') lbl = ic === '✅' ? 'Splněno' : ic === '📖' ? 'Příběh' : 'Nový úkol';
    else if(k && n.c === 'npc') lbl = ic === '🤝' ? 'Družiník' : ic === '🧠' ? 'Postava si to zapamatuje' : 'Nová postava';
    else if(k && n.c === 'loc' && (ic === '📍' || ic === '🗺️')) lbl = n.nove ? 'Nové místo' : 'Jsi v';
    else if(n.c === 'wx') lbl = 'Počasí';
    else if(n.c === 'clue') lbl = 'Nová stopa';
    else if(n.c === 'foe' && ic === '👹') lbl = 'Nepřátelé';
    else if(n.c === 'fact') lbl = 'Svět si to zapamatuje';
    else if(n.c === 'npc' && ic === '🧠') lbl = 'Postava si to zapamatuje';
    else if(n.c === 'shop') lbl = 'Obchod – klepni a nakupuj';
    else if(n.c === 'npc' && ic === '🤝') lbl = 'Družiník';
    const go = k && lbl && k[1] ? k[1] : '';
    return `<${go ? `button data-goto="${go}"` : 'div'} class="fxr ${n.c === 'foe' ? 'fxfoe' : n.c}"><span class="fi">${esc(ic)}</span><span class="ft">${lbl ? `<i>${lbl}</i>` : ''}${esc(txt)}</span>${go ? '<span class="fa">›</span>' : ''}</${go ? 'button' : 'div'}>`;
  };
  return `<div class="e fx">${list.map(row).join('')}</div>`;
}
function logHTML(e, i){
  if(e.t === 'older') return `<button class="older" data-older="1">📜 Zobrazit starší záznamy (${e.n}) – celý příběh je i v Kronice jako kniha</button>`;
  switch(e.t){
    case 'dm': return `<div class="e dm${e.anim ? ' tw' : ''}" data-li="${i}">${dmRich(e.text)}
      ${e.img ? `<img class="illu" data-src="${esc(e.img)}" alt="Ilustrace scény">` : ''}
      <div class="dmtools">${e.star ? '<span class="sstar" title="Tuto chvíli vyprávěl Claude Sonnet">⭐</span>' : ''}${e.imgBusy ? '<span class="busyimg">🖌️ Kreslím ilustraci…</span>' : imgMode() !== 'off' && !e.img ? `<button data-illu="${i}">🖼️ Ilustrace</button>` : ''}${window.speechSynthesis ? `<button data-say="${i}">🔊 Přečíst</button>` : ''}${canRegen(e) ? `<button data-regen="1" title="Napsat odpověď znovu">🔄 Jinak</button><button data-fix="1" title="Opravit Pána jeskyně">✋ Nesedí</button>` : ''}</div></div>`;
    case 'lvl': return `<div class="e lvl"><b>${esc(e.title || '⭐ ' + e.level + '. úroveň!')}</b><small>${e.gain ? '+' + e.gain + ' max. HP' : ''}${e.nove.length ? (e.gain ? ' · nové: ' : '') + esc(e.nove.join(', ')) : ''}${e.title ? '' : ' · zvyš si vlastnost'}</small></div>`;
    case 'player': return `<div class="e player"><span>${esc(e.text)}</span></div>`;
    case 'fx': return fxHTML(e.notes);
    case 'roll': return `<div class="e roll ${e.ok ? 'good' : 'bad'} ${e.enemy ? 'enemy' : ''}"><div class="die">${e.d}</div><div><b>${esc(e.res)}</b><small>${esc(e.title)}</small>${e.parts?.length ? partsHTML(e.parts, true) : ''}<small>🎲 ${e.d}${e.d2 ? ` <s>${e.d2}</s>` : ''}${e.parts?.length ? ` ${fmtMod(e.parts.reduce((a,x) => a + x.v, 0))}` : ''} = <b>${e.total}</b> vs. ${esc(e.dcl)} ${e.dc}</small>${advLine(e.advUp, e.advDown, true)}</div></div>`;
    case 'loot': return lootHTML(e);
    case 'sys': return `<div class="e sys">${esc(e.text)}</div>`;
    case 'ini': return `<div class="e ini"><b>⚔️ Boj! Iniciativa${e.prekvapeni === 'hrac' ? ' (byl jsi zaskočen)' : e.prekvapeni === 'nepratele' ? ' (zaskočil jsi je)' : ''}</b><span>${e.order.map((o,i) => `${i + 1}. ${esc(o.n)} <i>${o.v}</i>`).join(' · ')}</span></div>`;
    case 'err': return `<div class="e err">${esc(e.text)}${i === S.log.length-1 && S.lastFailed ? '<button id="retry">Zkusit znovu</button>' : ''}</div>`;
  }
  return '';
}

  S.log.forEach((e, i) => { if(i < from) return; const last = merged[merged.length - 1]; if(e.t === 'fx' && last && last.e.t === 'fx') last.e = { ...last.e, notes:last.e.notes.concat(e.notes) }; else merged.push({ e, i }); });
  log.innerHTML = merged.map(x => logHTML(x.e, x.i)).join('') + choicesHTML();
  twApply(); hydrateImages();
  /* Po novém vyprávění skoč na jeho začátek, ať se čte odshora. Jinak dolů. */

  $('#rollPanel').classList.toggle('on', mode === 'roll');
  $('#lootPanel').classList.toggle('on', mode === 'loot');

  $('#inspBtn').style.display = mode === 'roll' && S.pending && !S.dying && S.char.insp && !S.pending.insp ? 'block' : 'none';

  else if(S.pending){

      : `${p.zachrana ? 'Záchranný hod' : 'Zkouška'}: <b>${esc(p.dovednost ? skillName(p.dovednost) : statName(p.vlastnost))}</b>${p.dovednost ? ' <i>(' + esc(statName(p.vlastnost)) + ')</i>' : ''}${p.adv > 0 ? ' · výhoda' : p.adv < 0 ? ' · nevýhoda' : ''} (d20 ${esc(partsText(parts))}) · obtížnost <b>${p.obtiznost}</b> <i class="dcl">${dcLabel(p.obtiznost)}</i>${p.duvod ? '<br>' + esc(p.duvod) : ''}`;
  }

  const locked = !canAct();
  $('#chips').innerHTML = S.dead
    ? `<button class="chip" id="newChip">⚔️ Nový hrdina</button>`
    : quickActions().map(([k,l,c2]) => `<button class="chip ${c2 ? '' : 'quick'}" data-quick="${k}" ${locked && k !== 'c:stand' ? 'disabled' : ''}>${l}</button>`).join('')
      ;
  $('#input').disabled = locked; $('#send').disabled = locked;
  $('#input').placeholder = S.dead ? 'Příběh skončil.' : 'Co uděláš?';
  renderDrawer();
  updateAtmo(); updateAmbient();
  if(S.statPicks && canAct() && !$('#sheet').classList.contains('on') && !S._lvlAsked){ S._lvlAsked = true; setTimeout(levelUpPick, 900); }
}

const dcLabel = dc => dc <= 6 ? 'velmi snadná' : dc <= 9 ? 'snadná' : dc <= 11 ? 'běžná' : dc <= 14 ? 'trochu náročná' : dc <= 17 ? 'těžká' : dc <= 22 ? 'velmi těžká' : 'téměř nemožná';

function choicesHTML(){
  if(!S || busy || S.dead || S.dying || S.pending || S.loot || !canAct()) return '';
  const last = S.log[S.log.length - 1];
  if(!S.suggestions?.length || !last || last.t === 'player') return '';
  return `<div class="e choices"><div class="chh">Co uděláš?</div>${S.suggestions.map((t, i) => `<button class="cho" data-choice="${i}"><b>${i + 1}</b><span>${esc(t)}</span></button>`).join('')}
    <button class="cho own" data-choice="own"><b>✍️</b><span>Vlastní akce – napiš, co uděláš</span></button></div>`;
}
/* Rychlé akce podle situace – nabízí se jen, když dávají smysl. */
const healPotion = () => S.inv.find(i => i.typ === 'lektvar' && i.leceni);
const food = () => S.inv.find(i => i.typ === 'jidlo');
function quickActions(){
  const q = [], c = S.char;
  if(inCombat() && !S.dying){
    const qa = combatActions().map(([k,l]) => ['c:' + k, l]);
    if(!pc().neschopen){
      if(knownAbilities().length) qa.push(['abil', `✨ Schopnosti${slotMax() ? ' ' + S.slots + '/' + slotMax() : ''}`]);
      if(c.hp < c.maxHp && healPotion()) qa.push(['heal', `🧪 Lektvar (${healPotion().pocet})`]);
      qa.push(...combatActions2().map(([k,l]) => ['c:' + k, l, 'sec']));
    }
    return qa;
  }
  if(S.statPicks) q.push(['lvl', '⭐ Zvýšit vlastnost']);
  else if(S.featPicks) q.push(['feat', '🏅 Zvolit odbornost']);
  else if(S.char.level >= 3 && !S.char.obor && OBORY[S.char.cls]) q.push(['obor', '🎓 Zvolit specializaci']);
  if(knownAbilities().length) q.push(['abil', `✨ Schopnosti${slotMax() ? ' ' + S.slots + '/' + slotMax() : ''}`]);
  if(c.hp < c.maxHp && healPotion()) q.push(['heal', `🧪 Lektvar (${healPotion().pocet})`]);
  if(shopHere()) q.unshift(['shop', `🛒 ${S.shop.obchodnik}`]);
  if(S.needs.hlad >= 40 && food() && !S.foes.length) q.push(['eat', `🍖 Najíst se (${food().pocet})`]);
  if(S.spellPicks && learnableSpells().length) q.push(['spells', '📖 Nové kouzlo']);
  if(!S.foes.length && (c.hp < c.maxHp && hdLeft() > 0 || shortRestPreview().length)) q.push(['rest', '☕ Krátký odpočinek']);
  if((S.needs.unava >= 50 || isNight()) && !S.foes.length) q.push(['sleep', '🏕️ Vyspat se']);
  return q;
}
function condDetail(x){
  const rows = [['Druh', x.combat ? 'Stav v boji' : x.derived ? 'Únava / hlad' : EFF_TYPES[x.typ].n]];
  if(postihText(x.postih)) rows.push([x.typ === 'pozehnani' ? 'Bonus' : 'Postih', postihText(x.postih)]);
  if(x.hp) rows.push(['Životy', `${x.hp > 0 ? '+' : ''}${x.hp} HP za den`]);
  if(x.blokuje) rows.push(['Spánek', 'neléčí, dokud stav trvá']);
  if(!x.derived) rows.push(['Trvání', x.trvani === null ? 'do vyléčení' : 'odezní za ' + fmtHours(x.trvani)]);
  if(x.lecba) rows.push(['Léčba', x.lecba]);
  return `<div class="dhead"><div class="ico">${x.i}</div><div><h2>${esc(x.nazev)}</h2><small>${x.derived ? 'stav těla' : EFF_TYPES[x.typ].n}</small></div></div>
    ${x.popis ? `<div class="ddesc">${esc(x.popis)}</div>` : ''}
    <div class="dstats">${rows.map(([k,v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
    <button class="cancel" data-act="closesheet">Zavřít</button>`;
}

/* =========================================================
   DENÍK POSTAVY – jako papírový osobní deník (character sheet)

function tabSheet(){
  const c = S.char, Sp = species(), Z = ZAZEMI[c.zazemi], O = obor(), C = CLASSES[c.cls];
  const nx = nextXP(), prev = XP_LEVELS[c.level] || 0, pct = nx ? Math.min(100, 100 * ((c.xp || 0) - prev) / (nx - prev)) : 100;
  const rib = (ic, t, extra = '') => `<div class="rib"><span class="rbi">${ic}</span><b>${t}</b>${extra ? `<small>${extra}</small>` : ''}</div>`;
  const box = (v, l, cls = '') => `<span class="bx ${cls}"><i>${l}</i><b>${v}</b></span>`;
  /* zbraně: nasazená + ostatní v batohu */
  const weps = sortItems(S.inv.filter(i => i.typ === 'zbran')).slice(0, 4);
  const wrow = (n, hit, dmg, note, id, eq) => `<${id ? `button data-detail="${id}"` : 'div'} class="wrow${eq ? ' eq' : ''}"><span class="wn">${eq ? '✋ ' : ''}${esc(n)}</span>${box(fmtMod(hit), 'útok')}${box(esc(dmg), 'zranění')}<span class="wm">${esc(note || '')}</span></${id ? 'button' : 'div'}>`;
  const wl = weps.map(w => { const k = weaponCalc(w), m = weaponMastery(w); return wrow(w.nazev, k.hit, k.dice + (k.m ? ' ' + fmtMod(k.m) : ''), (wearPenalty(w) >= 99 ? '💔 rozbitá' : '') || (m && masteryOn() ? MASTERY[m].n : ''), w.id, isEquipped(w)); });
  if(!weps.length){ const k = weaponCalc(null); wl.push(wrow('Pěsti', k.hit, k.dice + (k.m ? ' ' + fmtMod(k.m) : ''), 'beze zbraně')); }
  const sp = spell();
  if(sp){ const h = mod(c.stats[sp.vlastnost]) + profBonus() + (gearBonus(sp.vlastnost)?.v || 0); wl.push(wrow('✨ ' + sp.nazev, h, sp.zraneni + ' ' + fmtMod(mod(c.stats[sp.vlastnost])), statName(sp.vlastnost))); }
  const zb = equipped('zbroj'), st = equipped('stit'), dz = equipped('doplnek');
  const arow = (ic, it, empty, cat) => it
    ? `<button class="arow" data-detail="${it.id}"><span>${ic}</span><span class="wn">${esc(it.nazev)}</span>${box('+' + Math.max(0, (it.obrana || 0) + (it.bonus || 0) - wearPenalty(it)), 'kvalita')}</button>`
    : `<button class="arow none" data-cat="${cat}"><span>${ic}</span><span class="wn">${empty}</span>${box('–', 'kvalita')}</button>`;
  const ds = S.dying || { ok:0, ko:0 }, dots = (n, ch) => [0,1,2].map(i => `<i class="${i < n ? 'on' : ''}">${i < n ? ch : '○'}</i>`).join('');
  const kn = knownAbilities(), lr = loadRatio();
  const lvls = Array.from({ length:20 }, (_, i) => i + 1);
  const groups = (bagCat === 'vse' ? CATS.slice(1) : CATS.filter(([k]) => k === bagCat)).map(([k,n,i,t]) => {
    const list = sortItems(S.inv.filter(it => t.includes(it.typ)));
    return list.length ? `<div class="vcat">${i} ${n}</div>${list.map(it => `<button class="vline ${RAR[it.vzacnost].c}" data-detail="${it.id}"><span class="vn">${isEquipped(it) ? '✋ ' : ''}${esc(it.nazev)}${it.pocet > 1 ? ' <em>×' + it.pocet + '</em>' : ''}${wearOn() && ['zbran','zbroj','stit'].includes(it.typ) && wearOf(it) <= 25 ? (wearOf(it) <= 0 ? ' 💔' : ' ⚠️') : ''}</span><span class="vs">${esc(shortStat(it))}</span></button>`).join('')}` : '';
  }).join('');
  const counts = Object.fromEntries(CATS.map(([k,,,t]) => [k, t ? S.inv.filter(i => t.includes(i.typ)).length : S.inv.length]));
  const filters = `<div class="filters">${CATS.filter(([k]) => k === 'vse' || counts[k]).map(([k,n,i]) => `<button class="fchip ${bagCat===k?'on':''}" data-cat="${k}">${i} ${n} <span style="opacity:.6">${counts[k]}</span></button>`).join('')}</div>`;

  return `<div class="dsheet">
  <button class="idn" data-act="heroinfo">
    <span class="scroll"><span class="heropic${c.img ? '' : ' none'}" data-act="heropic">${c.img ? `<img class="heroimg" data-src="${esc(c.img)}" alt="">` : c.imgBusy ? '🖌️' : '🎨<small>portrét</small>'}</span><i>JMÉNO</i><b>${esc(c.name)}</b></span>
    <span class="ids">
      <span class="tagr"><i>POVOLÁNÍ</i><b>${C.ikona} ${esc(C.nazev)}${O ? ' · ' + esc(O.nazev) : ''}</b></span>
      <span class="tagr"><i>RASA</i><b>${Sp.i} ${esc(Sp.nazev)}${c.linie && Sp.volba ? ' (' + esc(Sp.volba.moznosti[c.linie]) + ')' : ''}</b></span>
      <span class="tagr"><i>ZÁZEMÍ</i><b>${Z ? Z.i + ' ' + esc(Z.nazev) : '—'}</b></span>
    </span>
  </button>
  <div class="lvtrack">${lvls.map(l => `<i class="${l === c.level ? 'on' : l < c.level ? 'past' : ''}">${l}</i>`).join('')}</div>
  <div class="xpline"><span>Úroveň <b>${c.level}</b> · zdatnost <b>+${profBonus()}</b> <small>(útoky, ${profStats().map(k => statName(k).slice(0,3).toLowerCase() + '.').join(', ')})</small></span><span>${c.xp || 0}${nx ? ' / ' + nx : ''} XP</span></div>
  <div class="xpbar"><div style="width:${pct}%"></div></div>
  ${S.statPicks ? `<button class="btn" data-act="lvlpick" style="margin-top:8px">⭐ Zvýšit vlastnost (${S.statPicks}×)</button>` : ''}
  ${c.level >= 3 && !O ? `<button class="btn" data-act="subclass" style="margin-top:8px">🎓 Zvolit specializaci</button>` : ''}

  <div class="cols">
    <div class="colL">
      ${rib('★', 'Atributy')}
      ${STATS.map(([k,n]) => { const g = gearBonus(k); return `<div class="attr"><div class="an"><i>${n}</i>${box(c.stats[k], 'stupeň')}</div><div class="shield"><b>${fmtMod(mod(c.stats[k]))}</b><i>${n.slice(0,3).toUpperCase()}</i>${g ? `<em>+${g.v}</em>` : ''}</div></div>`; }).join('')}
      ${rib('🪙', 'Peníze')}
      <div class="money">${box(c.zlato, 'zlaté')}</div>
    </div>
    <div class="colR">
      ${rib('✚', 'Životy')}
      <div class="lifebox">
        ${box(c.maxHp, 'max')}${box(c.hp + (c.temp ? '<sup>+' + c.temp + '</sup>' : ''), 'aktuální', c.hp <= c.maxHp / 4 ? 'low' : '')}
        <div class="hpbar"><div style="width:${100*c.hp/c.maxHp}%"></div></div>
        <div class="death"><i>Hody proti smrti</i><span class="ok">${dots(ds.ok, '✔')}</span><span class="ko">${dots(Math.min(3, ds.ko), '✘')}</span></div>
      </div>
      ${rib('🛡', 'Obrana')}
      <div class="acrow"><div class="acshield"><b>${armorClass()}</b><i>OBRANA</i></div><div class="acinfo">10 + obratnost ${fmtMod(mod(c.stats.obratnost))}<br>+ zbroj a štít</div></div>
      ${slotMax() || kn.length ? `${rib('⚡', slotMax() ? 'Magie' : 'Schopnosti')}
      <button class="manabox" data-openabil="1">${slotMax() ? box(slotMax(), 'max slotů') + box(S.slots, 'zbývá') : ''}<span class="abl">${kn.filter(a => !a.learned).slice(0, 6).map(a => `<span class="ab1">${a.i} ${esc(a.nazev)}<b>${a.slot ? '◆' : abilityLeft(a) + '/' + abilityMax(a)}</b></span>`).join('')}${kn.filter(a => a.learned).length ? `<span class="ab1">📖 naučená kouzla<b>${kn.filter(a => a.learned).length}</b></span>` : ''}${kn.filter(a => !a.learned).length > 6 ? `<span class="ab1 more">… a další (klepni)</span>` : ''}</span></button>` : ''}
      ${rib('🍖', 'Suroviny')}
      <div class="needs">
        <div><i>Únava</i><b>${Math.round(S.needs.unava)}</b><div class="bar"><div style="width:${S.needs.unava}%;background:var(--gold)"></div></div></div>
        <div><i>Hlad</i><b>${Math.round(S.needs.hlad)}</b><div class="bar"><div style="width:${S.needs.hlad}%;background:var(--gold)"></div></div></div>
        <div><i>Náklad</i><b>${carried()}<small>/${capacity()} kg</small></b><div class="bar"><div style="width:${Math.min(100, lr * 100)}%;background:${lr > 1 ? 'var(--blood)' : 'var(--gold)'}"></div></div></div>
      </div>
    </div>
  </div>

  ${rib('⚔', 'Zbraně a kouzla', 'útok = k20 + oprava + zdatnost')}
  <div class="wtab">${wl.join('')}</div>

  ${rib('🛡', 'Zbroj a štít')}
  <div class="atab">${arow('🥋', zb, 'bez zbroje', 'obrana')}${arow('🛡️', st, 'bez štítu', 'obrana')}${arow('💍', dz, 'žádný doplněk', 'doplnky')}</div>
  ${S.mount ? `<div class="mountl">${MOUNTS[S.mount.typ].i} Jezdecké zvíře: <b>${esc(S.mount.nazev)}</b></div>` : ''}

  ${allConds().length ? `${rib('☠', 'Stavy a neduhy')}<div class="conds2">${allConds().map((x,i) => `<button class="vline ${x.typ === 'pozehnani' ? 'r1' : x.derived ? 'r3' : 'rb'}" data-cond="${i}"><span class="vn">${x.i} ${esc(x.nazev)}</span><span class="vs">${x.derived ? '' : x.trvani === null ? '∞' : fmtHours(x.trvani)}</span></button>`).join('')}</div>` : ''}

  ${dndSheetHTML()}

  ${rib('🎒', 'Vybavení', `${S.inv.length}/${INV_MAX} věcí`)}
  ${filters}
  <div class="vyb">${groups || '<div class="vline empty"><span class="vn">Batoh je prázdný.</span></div>'}<div class="vline blank"></div><div class="vline blank"></div></div>

  ${S.comp ? `${rib('🤝', 'Družiník')}${compHTML()}` : ''}
  ${rib('👁', 'Jak tě vidí ostatní')}
  <div class="imps">${firstImpression().map(t => `<div>${esc(t)}</div>`).join('')}</div>

  ${Object.keys(S.rep || {}).length ? `${rib('🏛', 'Pověst')}${Object.entries(S.rep).map(([k,v]) => `<div class="vline"><span class="vn">${esc(S.places?.[k]?.nazev || k)}</span><span class="vs">${esc(repLabel(v))}</span></div>`).join('')}` : ''}
  </div>`;
}

function tabBag(){
  const counts = Object.fromEntries(CATS.map(([k,,,t]) => [k, t ? S.inv.filter(i => t.includes(i.typ)).length : S.inv.length]));
  const filters = `<div class="filters">${CATS.filter(([k]) => k === 'vse' || counts[k]).map(([k,n,i]) =>
    `<button class="fchip ${bagCat===k?'on':''}" data-cat="${k}">${i} ${n} <span style="opacity:.6">${counts[k]}</span></button>`).join('')}</div>`;
  if(!S.inv.length) return filters + '<div class="sec">Batoh</div><div class="empty">Batoh je prázdný.</div>';
  const groups = bagCat === 'vse' ? CATS.slice(1) : CATS.filter(([k]) => k === bagCat);
  return filters + groups.map(([k,n,i,t]) => {
    const list = sortItems(S.inv.filter(it => t.includes(it.typ)));
    return list.length ? `<div class="sec"><span>${i} ${n}</span><span>${list.length}</span></div>${list.map(it => itemRow(it)).join('')}` : '';
  }).join('') + `<div class="dnote" style="margin-top:14px">Batoh ${S.inv.length}/${INV_MAX} · klepni na věc pro detail</div>`;
}

function storyHTML(){
  const P = story(); if(!P) return '';
  const st = S.storyStep || 0;
  return `<div class="sec"><span>📖 Hlavní příběh</span><span>${st}/${P.body.length}</span></div>
    <div class="qrow"><b>${P.ikona} ${esc(P.nazev)}</b><div class="stdots">${P.body.map((_, i) => `<i class="${i < st ? 'on' : ''}"></i>`).join('')}</div>
    ${P.body.map(([n], i) => i < st ? `<small>✅ ${i + 1}. ${esc(n)}</small>` : i === st && !S.storyEnd ? `<small>❔ ${i + 1}. kapitola – zatím neznámá</small>` : '').join('')}
    ${S.storyEnd ? `<small>🏁 <b style="display:inline">Konec:</b> ${esc(S.storyEnd)}</small>` : ''}</div>`;
}
function tabQuests(){
  const open = S.quests.filter(q => !q.done), done = S.quests.filter(q => q.done);
  const row = q => `<div class="qrow ${q.done?'done':''}"><b>${q.done ? '✅' : '📜'} ${esc(q.title)}</b>${q.popis ? `<small>${esc(q.popis)}</small>` : ''}</div>`;
  if(!S.quests.length) return storyHTML() + worldHTML() + '<div class="empty">Zatím žádné úkoly.</div>' + cluesHTML();
  return storyHTML() + worldHTML() + cluesHTML() + `<div class="sec"><span>Aktivní</span><span>${open.length}</span></div>${open.length ? open.map(row).join('') : '<div class="empty">Nic rozpracovaného.</div>'}
    ${done.length ? `<div class="sec"><span>Splněné</span><span>${done.length}</span></div>${done.map(row).join('')}` : ''}`;
}

function tabNpcs(){
  return (S.comp ? `<div class="sec"><span>🤝 Družiník</span></div>${compHTML()}<div class="sec"><span>Postavy</span></div>` : '') + tabNpcs0();
}
function tabNpcs0(){
  const npcs = Object.entries(S.npcs);
  if(!npcs.length) return '<div class="empty">Nikoho jsi zatím nepotkal.</div>';

      : n.imgBusy ? `<span class="npcp busy">🖌️</span>`
      : portraitReady() || portraitMode() !== 'off' && cleanKey(ls.get('kroniky_key_gemini')) ? `<button class="npcp none" data-npcdraw="${esc(k)}" title="Nakreslit portrét">🎨</button>` : `<span class="npcp none">👤</span>`;
    return `<div class="qrow npcrow">${pic}<div class="npcm"><b>${esc(k)} <span class="tag npc" style="color:${relColor(sk)}">${esc(relLabel(sk))}</span></b><small>${esc(n.popis)}</small>
      <div class="bar relbar"><div style="width:${(sk + 100) / 2}%;background:${relColor(sk)}"></div></div>${n.imgErr && !n.img ? `<small style="color:var(--blood)">Portrét se nepovedl: ${esc(n.imgErr.slice(0,90))}</small>` : ''}</div></div>`; }).join('')
    + (portraitMode() !== 'off' && !cleanKey(ls.get('kroniky_key_gemini')) ? '<div class="dnote">Pro portréty postav zadej Gemini klíč (Kronika → AI → Gemini → 🔑). Na text může dál běžet Claude.</div>' : '');

function renderDrawer(){
  if(!S) return;
  const c = S.char, openQ = S.quests.filter(q => !q.done).length;
  const tabs = [['hero','<em>📓</em>Deník'],['map','<em>🗺️</em>Mapa'],['quests',`<em>📜${openQ ? `<i>${openQ}</i>` : ''}</em>Úkoly`],['npcs','<em>👤</em>Postavy'],['chron','<em>📖</em>Kronika']];
  if(jTab === 'bag') jTab = 'hero';
  const body = ({ hero:tabSheet, bag:tabSheet, map:tabMap, quests:tabQuests, npcs:tabNpcs, chron:tabChron }[jTab] || tabHero)();
  const sc = $('#drawer .jbody')?.scrollTop || 0;
  $('#drawer').innerHTML = `
    <div class="jhead"><h2>${esc(c.name)}<small>${CLASSES[c.cls].ikona} ${CLASSES[c.cls].nazev} ${c.level}. úrovně · ${SETTINGS[S.setting].nazev}</small><button class="diffbadge" data-act="diffpick">${D().i} Obtížnost: ${D().n} ▾</button></h2><button class="xbtn" data-act="close" aria-label="Zavřít">✕</button></div>
    <div class="tabs">${tabs.map(([k,n]) => `<button class="tab ${jTab===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>
    <div class="jbody">${body}</div>`;
  if(jTab === 'hero' || jTab === 'bag') foldSheet($('#drawer .dsheet'));
  $('#drawer .jbody').scrollTop = sc;
  hydrateImages();
  if(detailId && $('#sheet').classList.contains('on')){

/* =========================================================
   ÚROVNĚ, ZKUŠENOSTI A SCHOPNOSTI
   ========================================================= */
const XP_LEVELS = [0, 0, 300, 900, 2700, 6500, 14000, 23000, 34000, 48000, 64000, 85000, 100000, 120000, 140000, 165000, 195000, 225000, 265000, 305000, 355000];   /* index = úroveň */
const MAX_LEVEL = 20;
/* Ve kterých vlastnostech je postava zběhlá: vlastnosti zázemí + dvě hlavní vlastnosti povolání. */
const profStats = () => [...new Set([...(ZAZEMI[S.char.zazemi]?.stats || []), ...(CLASSES[S.char.cls]?.prio || []).slice(0, 2)])];
const profBonus = () => Math.floor(((S.char.level || 1) - 1) / 4) + 2;   /* zdatnost podle D&D 2024: +2 (1.–4. úr.), +3 (5.–8.), +4 (9.–10.) */
const nextXP = () => S.char.level >= MAX_LEVEL ? null : XP_LEVELS[S.char.level + 1];
const foeXP = f => Math.max(10, Math.round(f.maxHp * 3 + Math.max(0, f.obrana - 10) * 8 + f.utok * 8));

function grantXP(amount, why){
  amount = Math.round(clamp(Number(amount) || 0, 0, 2000));
  if(!amount || S.dead) return;
  const c = S.char;
  c.xp = (c.xp || 0) + amount;
  addLog({ t:'fx', notes:[{ c:'gold', t:`⭐ +${amount} XP${why ? ' · ' + why : ''}` }] });
  sfx('coin');
  while(c.level < MAX_LEVEL && c.xp >= XP_LEVELS[c.level + 1]){
    c.level++; S._lvlAsked = false;
    const gain = Math.max(1, Math.floor(hitDie() / 2) + 1 + mod(c.stats.odolnost) + hpPerLevelBonus());
    c.maxHp += gain; c.hp = Math.min(c.maxHp, c.hp + gain);
    S.statPicks = (S.statPicks || 0) + 1;
    c.hdLeft = hdLeft() + 1;
    if(featLevels(c.cls).includes(c.level)) S.featPicks = (S.featPicks || 0) + 1;
    S.spellPicks = (S.spellPicks || 0) + spellsPerLevel(c.cls);
    S.slots = Math.min(slotMax(), (S.slots || 0) + 1);
    const nove = classAbilities().filter(a => a.lvl === c.level);
    for(const a of nove) if(!a.slot) S.res[a.id] = abilityMax(a);
    const extra = [];
    if(c.level === 5 && CLASSES[c.cls].martial) extra.push('⚔️ Útok navíc');
    if(c.level === 3 && !c.obor) extra.push('🎓 volba specializace');
    if(featLevels(c.cls).includes(c.level)) extra.push('🏅 odbornost nebo +2 k vlastnostem');
    if(spellsPerLevel(c.cls)) extra.push('📖 nové kouzlo');
    if(c.cls === 'valecnik' && (c.level === 11 || c.level === 20)) extra.push('⚔️ další útok navíc');
    if([5, 9, 13, 17].includes(c.level)) extra.push('🎯 zdatnost +' + profBonus());
    addLog({ t:'lvl', level:c.level, gain, nove:nove.map(a => a.i + ' ' + a.nazev).concat(extra) });
    hist(`HRÁČ POSTOUPIL NA ${c.level}. ÚROVEŇ: +${gain} max. HP${nove.length ? ', nové schopnosti: ' + nove.map(a => a.nazev).join(', ') : ''}${extra.length ? ', ' + extra.join(', ') : ''}. Vyprávěj to stručně jako okamžik, kdy hrdina cítí, že zesílil.`);
    book('sys', `⭐ ${c.name} dosáhl ${c.level}. úrovně.`);
    sfx('level');
  }
}

  openSheet(`<h3>🎓 ${esc(CLASSES[c.cls].nazev)} 3. úrovně – zvol specializaci</h3>

function chooseSubclass(id){
  const c = S.char, o = (OBORY[c.cls] || []).find(x => x.id === id);
  if(!o || c.obor) return;
  c.obor = id;
  if(o.perk?.hpPerLevel){ const add = o.perk.hpPerLevel * c.level; c.maxHp += add; c.hp += add; }
  if(o.abil && !o.abil.slot) S.res[o.abil.id] = abilityMax(o.abil);
  if(o.perk?.slotBonus) S.slots = Math.min(slotMax(), (S.slots || 0) + o.perk.slotBonus);
  addLog({ t:'lvl', level:c.level, gain:0, title:`🎓 ${o.nazev}`, nove:[o.popis] });
  hist(`Hráč si zvolil specializaci: ${o.nazev} (${o.popis}). Ať se to promítne do jeho příběhu.`);
  book('sys', `🎓 ${c.name} se stal: ${o.nazev}.`);
  sfx('level'); closeSheet(); render(); save();
}

async function levelUpPick(){
  if(!S || !S.statPicks || busy) return;
  const c = S.char;
  const opts = STATS.filter(([k]) => c.stats[k] < 20).map(([k,n]) => ({ label:`${n}: ${c.stats[k]} → ${c.stats[k] + 1}${mod(c.stats[k] + 1) > mod(c.stats[k]) ? '  (bonus ' + fmtMod(mod(c.stats[k] + 1)) + ')' : ''}`, value:k }));
  if(!opts.length){ S.statPicks = 0; return; }
  const k = await pick(`⭐ ${c.level}. úroveň! Zvyš jednu vlastnost o +1`, opts);
  if(!k || !S.statPicks) return;
  const oldCon = mod(c.stats.odolnost);
  c.stats[k]++; S.statPicks--;
  if(k === 'odolnost' && mod(c.stats.odolnost) > oldCon){ c.maxHp += c.level; c.hp += c.level; }
  addLog({ t:'fx', notes:[{ c:'good', t:`⬆️ ${statName(k)} ${c.stats[k]}` }] });
  hist(`Hráč si zvýšil vlastnost ${statName(k)} na ${c.stats[k]}.`);
  render(); save();
  if(S.statPicks) setTimeout(levelUpPick, 300);
  else if(S.featPicks) setTimeout(featSheet, 400);
  else if(c.level >= 3 && !c.obor) setTimeout(subclassPick, 400);
}

/* Hodnota schopnosti: kostka může záviset na úrovni. */
const aDice = a => typeof a.diceV === 'function' ? a.diceV() : a.dice;
const stK = k => k === '@' ? castStat() : k;
const castMod = a => a.spellStat && (a.learned || perk('spellDmg') && S.char.level >= 3) ? Math.max(0, mod(S.char.stats[stK(a.spellStat)])) : 0;
function addTemp(n, why){
  const c = S.char;
  n = Math.max(0, Math.round(n));
  if(n > (c.temp || 0)){ c.temp = n; addLog({ t:'fx', notes:[{ c:'good', t:`🛡️ Dočasné životy ${n}${why ? ' · ' + why : ''}` }] }); }
}
function wildSurgeCheck(a){
  if(!perk('wildSurge') || !a.slot || Math.random() >= 0.15) return '';
  return ' DIVOKÁ MAGIE: kouzlo vyvolalo nečekaný vedlejší účinek – vymysli zábavný, neškodný nebo dvojsečný efekt.';
}

async function useAbility(id){
  const a = classAbilities().find(x => x.id === id);
  if(!a || !canAct() || a.lvl > S.char.level) return;
  if(abilityLeft(a) < (a.slot ? a.cost || 1 : 1)){ alert(a.slot ? 'Nemáš dost slotů kouzel. Obnoví je spánek (aspoň 6 h).' : 'Tuhle schopnost už jsi vyčerpal. Obnoví ji spánek' + (SHORT_REST[a.id] ? ' nebo krátký odpočinek.' : ' (aspoň 6 h).')); return; }
  if(a.reaction){ alert('Tohle je reakce – hra ji v boji použije sama, když tě zasáhne útok (1× za kolo).'); return; }
  if(inCombat()){
    if(a.bonus && S.tah?.bonus){ alert('Bonusovou akci už jsi v tomto tahu použil.'); return; }
    if(a.slot && S.tah?.slot){ alert('Za jeden tah můžeš seslat jen jedno kouzlo se slotem.'); return; }
  }
  const c = S.char, spend = () => { if(a.slot) S.slots -= (a.cost || 1); else S.res[a.id] = abilityLeft(a) - 1; if(inCombat()){ S.tah ||= {}; if(a.bonus) S.tah.bonus = true; if(a.slot) S.tah.slot = true; } };
  /* bonusová akce nespotřebuje tah – nepřátelé nejednají, AI se dozví v příštím tahu */
  const finish = (t, shown) => {
    if(!a.bonus) return act(t, shown);
    twFinish(); addLog({ t:'player', text:shown + ' · bonusová akce' }); book('hrac', shown);
    hist('Hráč (bonusová akce): ' + t.replace(/\[HRA: /, '(').replace(/\]$/, ')'));
    render(); save();
  };
  closeSheet();

  if(a.kind === 'heal'){
    let r = typeof a.flat === 'function' ? a.flat() : rollDice(aDice(a)).total;
    r += (a.addStat ? Math.max(0, mod(c.stats[stK(a.addStat)])) : 0) + (a.addLevel ? c.level : 0) + (perk('healBonus') && c.level >= 3 ? 2 + c.level : 0);
    const b = c.hp; c.hp = Math.min(c.maxHp, c.hp + r); spend();
    let cured = '';
    if(a.cureToo){ const e = S.effects.find(x => ['jed','nemoc'].includes(x.typ)); if(e){ S.effects = S.effects.filter(x => x !== e); cured = ` a zbavil se stavu ${e.nazev}`; addLog({ t:'fx', notes:[{ c:'good', t:`✔️ Vyléčeno: ${e.nazev}` }] }); } }
    addLog({ t:'fx', notes:[{ c:'good', t:`${a.i} +${c.hp - b} HP` }] }); sfx('heal');
    closeDrawer();
    return finish(`Použiju schopnost ${a.nazev}. [HRA: vyléčeno ${c.hp - b} HP${cured}, hráč má ${c.hp}/${c.maxHp}.${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev}`);
  }
  if(a.kind === 'temp'){
    const r = (typeof a.flat === 'function' ? a.flat() : rollDice(aDice(a)).total) + (a.addStat ? Math.max(0, mod(c.stats[stK(a.addStat)])) : 0);
    spend(); addTemp(r, a.nazev); sfx('heal'); closeDrawer();
    return finish(`Použiju ${a.nazev}. [HRA: hráč získal ${r} dočasných životů – pohltí příští zranění.]`, `${a.i} ${a.nazev}`);
  }
  if(a.kind === 'nextAttack' || a.kind === 'nextRoll'){
    spend();
    const v = a.diceV ? rollDice(a.diceV()).total : a.v || 0;
    if(a.kind === 'nextAttack') S.nextAttack = { nazev:a.nazev, hit:a.hit || 0, double:!!a.double, adv:!!a.adv, spell:!!a.spell, extra:a.extraV ? a.extraV() : a.extra || null };
    else S.nextRoll = { nazev:a.nazev, stat:a.stat, v, adv:!!a.adv, checkOnly:!!a.checkOnly };
    const target = a.kind === 'nextAttack' ? (a.spell ? 'útok' : 'útok zbraní') : a.stat === '*' ? (a.checkOnly ? 'zkoušku' : 'hod') : 'hod na ' + statName(a.stat).toLowerCase();
    addLog({ t:'fx', notes:[{ c:'gold', t:`${a.i} ${a.nazev}${v ? ' (+' + v + ')' : ''}${a.adv ? ' – s výhodou' : ''} · platí pro příští ${target}` }] });
    hist(`Hráč si připravil schopnost ${a.nazev} (${a.popis}).`);
    sfx('page'); render(); save(); return;
  }
  if(a.kind === 'buff'){
    spend();
    const ef = a.eff();
    if(a.conc){ if(concEffect()) endConcentration('nové kouzlo'); ef.conc = true; }
    if(a.rage){
      if(perk('rageExtra')) ef.extraDmg = perk('rageExtra');
      if(perk('rageObrana')) ef.obrana = (ef.obrana || 0) + perk('rageObrana');
      if(perk('rageTemp')) addTemp(c.level, 'světový strom');
    }
    if(a.wild) addTemp(typeof a.temp === 'function' ? a.temp() : c.level * 2, 'zvířecí podoba');
    S.effects = S.effects.filter(e => e.nazev !== ef.nazev);
    S.effects.push({ id:newId('e'), typ:'pozehnani', popis:a.popis, postih:{}, hp:0, lecba:'', blokuje:false, ...ef });
    addLog({ t:'fx', notes:[{ c:'good', t:`${a.i} ${ef.nazev}` }] }); sfx('heal');
    closeDrawer();
    return finish(`Použiju ${a.nazev}. [HRA: ${a.popis}${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev}`);
  }
  if(a.kind === 'cure'){
    const list = S.effects.filter(e => ['nemoc','jed','prokleti'].includes(e.typ));
    if(!list.length){ alert('Nemáš žádnou nemoc, otravu ani kletbu.'); return; }
    const e = list.length === 1 ? list[0] : await pick('Čeho se zbavit?', list.map(x => ({ label:`${EFF_TYPES[x.typ].i} ${x.nazev}`, value:x })));
    if(!e || !canAct()) return;
    spend(); S.effects = S.effects.filter(x => x !== e);
    addLog({ t:'fx', notes:[{ c:'good', t:`✔️ Vyléčeno: ${e.nazev}` }] }); sfx('heal');
    closeDrawer();
    return act(`Použiju ${a.nazev} na ${e.nazev}. [HRA: stav ${e.nazev} byl odstraněn.]`, `${a.i} ${a.nazev}`);
  }
  if(a.kind === 'story'){
    spend();
    if(a.conc){ if(concEffect()) endConcentration('nové kouzlo'); S.effects.push({ id:newId('e'), typ:'pozehnani', nazev:a.nazev, popis:a.popis, postih:{}, hp:0, lecba:'', blokuje:false, trvani:1, conc:true }); }
    addLog({ t:'fx', notes:[{ c:'good', t:`${a.i} ${a.nazev}` }] }); sfx('page'); closeDrawer();
    return act(`Sešlu kouzlo ${a.nazev}. [HRA: kouzlo ${a.kruh ? a.kruh + '. kruhu ' : ''}bylo sesláno, slot je zaplacený: ${a.popis}${a.conc ? ' Trvá, dokud hráč udrží soustředění (nejvýš hodinu).' : ''} Vyprávěj jeho účinek podle situace.]`, `${a.i} ${a.nazev}`);
  }
  /* útočné schopnosti */
  if(!S.foes.length){ alert('Tahle schopnost potřebuje nepřítele.'); return; }
  if(a.kind === 'dmgAll' || a.kind === 'sleepAll'){
    spend(); closeDrawer();
    const r = Math.max(1, rollDice(aDice(a)).total + castMod(a)), names = S.foes.map(f => f.jmeno);
    let txt;
    if(a.kind === 'sleepAll'){
      const out = S.foes.filter(f => f.hp <= r);
      S.foes = S.foes.filter(f => f.hp > r);
      out.forEach(f => grantXP(foeXP(f), f.jmeno));
      addLog({ t:'fx', notes:out.length ? out.map(f => ({ c:'good', t:`🌀 ${f.jmeno} omámen` })) : [{ c:'bad', t:'🌀 Nikdo nepodlehl' }] });
      txt = out.length ? `Omámeni a mimo boj: ${out.map(f => f.jmeno).join(', ')}.` : 'Kouzlo nikoho nepřemohlo.';
    }else{ sfx('clash'); txt = S.foes.slice().map(f => hurtFoe(f, r)).join(' '); }
    return act(`Použiju ${a.nazev} na ${names.join(', ')}. [HRA: ${a.kind === 'dmgAll' ? 'každý nepřítel utržil ' + r + ' zranění. ' : ''}${txt}${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev}`);
  }
  const foe = S.foes.length === 1 ? S.foes[0] : await pick(`${a.nazev} – na koho?`, S.foes.map(f => ({ label:`${f.jmeno} (${f.hp}/${f.maxHp} HP)`, value:f })));
  if(!foe || !canAct() || !S.foes.includes(foe)) return;
  spend(); closeDrawer();
  if(a.kind === 'sleepFoe'){
    const r = rollDice(aDice(a)).total;
    if(foe.hp <= r){
      S.foes = S.foes.filter(f => f !== foe);
      addLog({ t:'fx', notes:[{ c:'good', t:`${a.i} ${foe.jmeno} – ${a.verb || 'vyřazen'}` }] });
      grantXP(foeXP(foe), 'nepřítel vyřazen');
      return act(`Použiju ${a.nazev} na ${foe.jmeno}. [HRA: uspělo (síla ${r} ≥ ${foe.hp} HP), ${foe.jmeno} ${a.verb || 'je vyřazen'} a je mimo boj${S.foes.length ? '' : '. Boj skončil'}.${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev} → ${foe.jmeno}`);
    }
    addLog({ t:'fx', notes:[{ c:'bad', t:`${a.i} ${foe.jmeno} odolal` }] });
    return act(`Použiju ${a.nazev} na ${foe.jmeno}. [HRA: NEZABRALO (síla ${r} < ${foe.hp} HP).${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev} → ${foe.jmeno}`);
  }
  const dmg = Math.max(1, rollDice(aDice(a)).total + castMod(a));
  sfx('clash');
  const txt = hurtFoe(foe, dmg);
  return act(`Použiju ${a.nazev} na ${foe.jmeno}. [HRA: zásah za ${dmg} zranění. ${txt}${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev} → ${foe.jmeno}`);
}

    <button class="cancel" data-act="closesheet">Zavřít</button>`);

/* =========================================================
   MAPA SVĚTA
   ========================================================= */
const PLACE_ICONS = [
  [/hrad|pevnost|tvrz|citadel/,'🏰'], [/hostin|krčm|hospod|taverna/,'🍺'], [/chrám|kostel|klášter|svatyn|kaple|oltář/,'⛪'],
  [/jeskyn|důl|doly|sluj|podzem/,'🕳️'], [/ruin|zřícenin|hrob|krypt|hřbitov|mohyl/,'🏚️'], [/bažin|močál|slatin|blat/,'🐸'],
  [/přístav|pobřeží|moře|ostrov|zátok|maják/,'⚓'], [/hor|skal|průsmyk|vrch|štít/,'⛰️'], [/les|hvozd|háj|bor/,'🌲'],
  [/^(?!.*brod).*(řek|most|jezer|rybník)/,'🌊'], [/měst|brod/,'🏘️'], [/ves|vesnic|osad|dvůr|statek|mlýn|chalup/,'🏡']
];
const placeBase = n => String(n || '').split(/\s+[–—-]\s+|,\s*|\s*\(/)[0].trim().slice(0,60);
const placeKey = n => low(placeBase(n));
const placeIcon = n => (PLACE_ICONS.find(([re]) => re.test(low(n))) || [0,'📍'])[1];
const hashStr = s => { let h = 2166136261; for(const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };

/* Zapíše místo na mapu. Nové místo se umístí od předchozího podle délky cesty. */
function registerPlace(name, fromKey, hours, danger){
  const key = placeKey(name);
  if(!key) return;
  S.places ||= {}; S.roads ||= [];
  let p = S.places[key];
  if(!p){
    const from = fromKey && S.places[fromKey];
    let x = 0, y = 0;
    if(from){
      const dist = 26 + clamp(hours || 1, 0.5, 24) * 16;
      let ang = (hashStr(key) % 360) * Math.PI / 180;
      for(let i = 0; i < 12; i++){
        x = Math.round(from.x + Math.cos(ang) * dist); y = Math.round(from.y + Math.sin(ang) * dist);
        if(!Object.values(S.places).some(o => Math.hypot(o.x - x, o.y - y) < 34)) break;
        ang += 0.55;
      }
    }
    p = S.places[key] = { nazev:placeBase(name), x, y, ikona:placeIcon(name), den:S.time.day, navstev:0 };
    addLog({ t:'fx', notes:[{ c:'loc', t:`🗺️ Nové místo na mapě: ${p.nazev}` }] });
  }
  p.navstev++;
  if(fromKey && fromKey !== key && S.places[fromKey] && !S.roads.some(r => (r.a === fromKey && r.b === key) || (r.a === key && r.b === fromKey)))
    S.roads.push({ a:fromKey, b:key, h:Math.round((hours || 1) * 10) / 10, d:danger || 'stredni' });
  S.here = key;
}

function tabMap(){
  const P = S.places || {}, keys = Object.keys(P);
  if(!keys.length) return '<div class="empty">Mapa je zatím prázdná. Místa se na ni zapisují, jak je navštěvuješ.</div>';
  const half = k => Math.max(20, P[k].nazev.length * 3.4 + 6);   /* polovina šířky popisku */
  let minX = Math.min(...keys.map(k => P[k].x - half(k))) - 10; const maxX = Math.max(...keys.map(k => P[k].x + half(k))) + 10;
  let minY = Math.min(...keys.map(k => P[k].y)) - 40; const maxY = Math.max(...keys.map(k => P[k].y)) + 44;
  let w = maxX - minX, h = maxY - minY;
  if(w < 300){ minX -= (300 - w) / 2; w = 300; }          /* málo míst → doprostřed */
  if(h < 260){ minY -= (260 - h) / 2; h = 260; }
  const dcol = { nizke:'#3d6a26', stredni:'#9a6a12', vysoke:'#8c2216' };
  const roads = (S.roads || []).filter(r => P[r.a] && P[r.b]).map(r => {
    const a = P[r.a], b = P[r.b], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${dcol[r.d] || '#6d573a'}" stroke-width="2" stroke-dasharray="5 4" opacity=".75"/>
      <text x="${mx}" y="${my - 3}" class="mroad">${esc(fmtHours(r.h))}</text>`; }).join('');
  const places = keys.map(k => { const p = P[k], here = k === S.here;
    return `<g class="mplace" data-place="${esc(k)}">
      ${here ? `<circle cx="${p.x}" cy="${p.y}" r="17" fill="none" stroke="#8c2216" stroke-width="2.5"><animate attributeName="r" values="15;19;15" dur="2s" repeatCount="indefinite"/></circle>` : ''}
      <circle cx="${p.x}" cy="${p.y}" r="13" fill="#f6ecd2" stroke="#6d573a" stroke-width="1.2"/>
      <text x="${p.x}" y="${p.y + 5}" text-anchor="middle" font-size="15">${placeIcon(p.nazev) === '📍' ? p.ikona : placeIcon(p.nazev)}</text>
      <text x="${p.x}" y="${p.y + 28}" class="mname ${here ? 'here' : ''}">${esc(p.nazev)}</text></g>`; }).join('');
  return `<div class="sec"><span>Mapa kraje</span><span>${keys.length} míst</span></div>
    <div class="mapwrap"><svg class="mapsvg" viewBox="${minX} ${minY} ${w} ${h}" style="width:${Math.max(100, w / 3.4)}%;min-width:100%">
      <rect x="${minX}" y="${minY}" width="${w}" height="${h}" fill="none" stroke="#9c7f4f" stroke-width="2" stroke-dasharray="1 0"/>
      <text x="${minX + w - 24}" y="${minY + 30}" font-size="26" text-anchor="middle" opacity=".55">🧭</text>
      ${roads}${places}</svg></div>
    <div class="dnote">Klepni na místo pro detail a cestu. Barva cesty: <span style="color:#3d6a26">bezpečná</span> · <span style="color:#9a6a12">střední</span> · <span style="color:#8c2216">nebezpečná</span></div>`;
}
function placeSheet(key){
  const p = S.places?.[key]; if(!p) return;
  const roads = (S.roads || []).filter(r => r.a === key || r.b === key).map(r => {
    const o = S.places[r.a === key ? r.b : r.a]; return o ? `${o.ikona} ${o.nazev} – ${fmtHours(r.h)}` : ''; }).filter(Boolean);
  const rep = S.rep?.[key];
  const rows = [['Poprvé navštíveno', `den ${p.den}`], ['Návštěv', p.navstev]];
  if(rep !== undefined) rows.push(['Tvoje pověst', repLabel(rep)]);
  if(roads.length) rows.push(['Cesty', roads.join(' · ')]);
  const here = key === S.here;
  openSheet(`<div class="dhead"><div class="ico">${p.ikona}</div><div><h2>${esc(p.nazev)}</h2><small>${here ? '📍 Jsi tady' : 'Známé místo'}</small></div></div>
    <div class="dstats">${rows.map(([k,v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${here ? '' : `<div class="dbtns"><button class="main" data-act="goto" data-place="${esc(key)}" ${canAct() ? '' : 'disabled'}>🧭 Vyrazit sem</button></div>`}
    <button class="cancel" data-act="closesheet">Zavřít</button>`, 'r0');
}

const hasWarm = () => S.inv.some(i => i.teple || /plášť|plast|kožich|kabát|teplé|vlněn|kožešin|deka|houně/i.test(i.nazev));

const MOUNTS = { kun:{ n:'Kůň', i:'🐎', travel:0.6, unava:0.5, cap:100 }, mula:{ n:'Mula', i:'🫏', travel:0.85, unava:0.7, cap:80 }, vuz:{ n:'Vůz s koněm', i:'🛒', travel:0.8, unava:0.6, cap:400 } };
function itemWeight(it){
  if(it.vaha !== undefined && it.vaha !== null) return it.vaha * it.pocet;
  let w = 1;
  if(it.typ === 'zbran'){ const d = parseDice(it.zraneni) || { n:1, s:6, p:0 }; w = clamp(Math.round(d.n * d.s / 3), 1, 8); }
  else if(it.typ === 'zbroj') w = [0, 5, 8, 12, 18, 25][it.obrana] || 10;
  else if(it.typ === 'stit') w = 3;
  else if(it.typ === 'doplnek' || it.typ === 'svitek') w = 0.1;
  else if(it.typ === 'lektvar') w = 0.5;
  return w * it.pocet;
}
const carried = () => Math.round((S.inv.reduce((a,i) => a + itemWeight(i), 0) + S.char.zlato / 100) * 10) / 10;
const capacity = () => S.char.stats.sila * 3 * (species().bigCarry ? 2 : 1) + (S.mount ? MOUNTS[S.mount.typ].cap : 0);
const loadRatio = () => carried() / capacity();

const wearOn = () => ls.get('dz_wear') !== 'off';
const wearOf = it => it && it.stav !== undefined ? it.stav : 100;
function wear(it, amount){
  if(!it || !wearOn() || !['zbran','zbroj','stit'].includes(it.typ)) return;
  const before = wearOf(it);
  it.stav = Math.max(0, before - amount);
  if(before > 25 && it.stav <= 25 && it.stav > 0){ addLog({ t:'fx', notes:[{ c:'bad', t:`⚠️ ${it.nazev} je poškozený` }] }); hist(`${it.nazev} je poškozený (horší účinek), potřebuje opravu u kováře.`); }
  if(before > 0 && it.stav === 0){ addLog({ t:'fx', notes:[{ c:'bad', t:`💔 ${it.nazev} se rozbil` }] }); hist(`${it.nazev} se rozbil a je nepoužitelný, dokud ho kovář neopraví.`); sfx('fail'); }
}
const wearPenalty = it => !wearOn() ? 0 : wearOf(it) <= 0 ? 99 : wearOf(it) <= 25 ? 1 : 0;

function startDying(){

async function deathSave(){
  if(!S.dying || busy || rolling) return;
  rolling = true;
  const btn = $('#rollBtn'); btn.disabled = true;
  let d = d20();
  if(S.char.level >= 3 && perk('deathAdv')) d = Math.max(d, d20());
  if(d === 1 && species().lucky) d = d20();
  await diceAnim(d);
  rolling = false; btn.disabled = false;

    return afterDying(true, false);
  }
  if(d === 1) D.ko += 2; else if(d >= 10) D.ok++; else D.ko++;
  addLog({ t:'roll', title:`Záchranný hod proti smrti (${'✔'.repeat(D.ok)}${'✘'.repeat(Math.min(3, D.ko))})`, d, parts:[], total:d, dc:10, dcl:'potřeba', ok:d >= 10, res:d === 1 ? 'Dvě selhání!' : d >= 10 ? 'Držíš se' : 'Život uniká' });
  if(D.ko >= 3 && diff() === 'pribeh'){
    addLog({ t:'sys', text:'🕯️ Smrt si pro tebe tentokrát nepřišla… (obtížnost Příběh)' });
    S.dying = null; S.char.hp = 1; return afterDying(false, true);
  }
  if(D.ko >= 3){
    S.dying = null; S.dead = true;
    addLog({ t:'sys', text:`☠️ ${S.char.name} zemřel. Tady jeho příběh končí.` });

  if(D.ok >= 3){ S.dying = null; S.char.hp = 1; return afterDying(false, true); }

function afterDying(miracle, stabilized){

  if(stabilized && Math.random() < (diff() === 'kruta' ? 0.9 : diff() === 'pribeh' ? 0.25 : 0.6)){

}

/* =========================================================
   ZVUKY – vše syntetizované přes WebAudio, žádné soubory
   ========================================================= */
const SND = { ctx:null, noise:null, master:null, sfxG:null, ambG:null, amb:null, kind:null };
const sfxOn = () => ls.get('dz_sfx') !== 'off';
const ambOn = () => ls.get('dz_amb') !== 'off';
function audio(){
  if(SND.ctx) return SND.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{
    const c = SND.ctx = new AC();
    SND.master = c.createGain(); SND.master.gain.value = 0.9; SND.master.connect(c.destination);
    SND.sfxG = c.createGain(); SND.sfxG.gain.value = 0.7; SND.sfxG.connect(SND.master);
    SND.ambG = c.createGain(); SND.ambG.gain.value = 0.4; SND.ambG.connect(SND.master);
    const b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    SND.noise = b;
    return c;
  }catch(e){ return null; }
}
const audioReady = () => SND.ctx && SND.ctx.state === 'running';
/* Prohlížeč pustí zvuk až po prvním dotyku. */
document.addEventListener('pointerdown', () => {
  const c = audio();
  if(c && c.state === 'suspended') c.resume().then(() => { SND.kind = undefined; updateAmbient(); });
  else updateAmbient();
}, { passive:true });

function envG(g, t, a, peak, dcy){
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dcy);
}
function tone(freq, dur, o = {}){
  const c = SND.ctx, t = c.currentTime + (o.at || 0), osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
  envG(g, t, 0.005, o.vol ?? 0.3, dur);
  osc.connect(g); g.connect(o.dest || SND.sfxG); osc.start(t); osc.stop(t + dur + 0.05);
}
function noiseHit(dur, o = {}){
  const c = SND.ctx, t = c.currentTime + (o.at || 0), s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = SND.noise; s.loop = true;
  f.type = o.type || 'bandpass'; f.frequency.value = o.f || 2000; f.Q.value = o.q ?? 1;
  envG(g, t, o.a || 0.003, o.vol ?? 0.3, dur);
  s.connect(f); f.connect(g); g.connect(o.dest || SND.sfxG); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.1);
}
function sfx(name){
  if(!sfxOn() || !audio() || !audioReady()) return;
  try{
    switch(name){
      case 'dice': for(let i = 0; i < 7; i++) noiseHit(0.05, { f:2500 + Math.random() * 2000, q:4, vol:0.25 * (1 - i / 9), at:i * 0.11 + Math.random() * 0.04 }); noiseHit(0.14, { f:380, vol:0.3, at:0.85 }); break;
      case 'coin': tone(1800, 0.25, { type:'triangle', vol:0.13 }); tone(2400, 0.3, { type:'triangle', vol:0.1, at:0.07 }); break;
      case 'clash': noiseHit(0.25, { f:3500, q:8, vol:0.35 }); tone(1300, 0.6, { type:'triangle', vol:0.07 }); tone(1730, 0.5, { type:'triangle', vol:0.05 }); break;
      case 'hit': tone(120, 0.25, { vol:0.5, slide:0.4 }); noiseHit(0.12, { f:300, type:'lowpass', vol:0.3 }); break;
      case 'miss': noiseHit(0.22, { f:1200, q:0.7, vol:0.12, a:0.06 }); break;
      case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.4, { type:'triangle', vol:0.17, at:i * 0.11 })); break;
      case 'crit': [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.45, { type:'triangle', vol:0.18, at:i * 0.07 })); noiseHit(0.6, { f:6000, q:0.5, type:'highpass', vol:0.07 }); break;
      case 'fail': tone(220, 0.55, { type:'sawtooth', vol:0.07, slide:0.5 }); break;
      case 'heal': [660, 880, 1320].forEach((f, i) => tone(f, 0.5, { vol:0.11, at:i * 0.09 })); break;
      case 'page': noiseHit(0.28, { f:1800, q:0.6, vol:0.12, a:0.05 }); break;
      case 'quill': noiseHit(0.03 + Math.random() * 0.05, { f:4200 + Math.random() * 2500, q:3, vol:0.03 }); break;
      case 'death': tone(196, 1.3, { vol:0.25, slide:0.5 }); tone(147, 1.5, { vol:0.2, at:0.3, slide:0.5 }); break;
    }
  }catch(e){}
}

/* ---------- Atmosférické zvuky podle místa, počasí a situace ---------- */
function ambientKind(){
  if(!S || S.dead || !$('#game').classList.contains('active')) return null;
  if(S.foes.length) return 'battle';
  const loc = low(S.location), w = S.weather?.typ, inside = indoors();
  if(!inside && w === 'bourka') return 'storm';
  if(!inside && w === 'dest') return 'rain';
  if(/hostin|krčm|hospod|taverna/.test(loc)) return 'tavern';
  if(/jeskyn|důl|doly|krypt|sklep|podzem|sluj/.test(loc)) return 'cave';
  if(isNight()) return inside ? 'fire' : 'night';
  if(/měst|trh|náměst|přístav/.test(loc)) return 'town';
  return inside ? 'fire' : 'wind';
}
function updateAmbient(){
  const k = ambOn() ? ambientKind() : null;
  if(k === SND.kind) return;
  stopAmbient();
  if(!k || !audio() || !audioReady()){ SND.kind = undefined; return; }
  SND.kind = k;
  try{ startAmbient(k); }catch(e){}
}
function stopAmbient(){
  const A = SND.amb; SND.amb = null;
  if(!A) return;
  A.timers.forEach(clearTimeout);
  const t = SND.ctx.currentTime;
  A.g.gain.cancelScheduledValues(t); A.g.gain.setValueAtTime(A.g.gain.value, t); A.g.gain.linearRampToValueAtTime(0, t + 1.2);
  setTimeout(() => { A.nodes.forEach(n => { try{ n.stop ? n.stop() : 0; }catch(e){} try{ n.disconnect(); }catch(e){} }); A.g.disconnect(); }, 1400);
}
function startAmbient(k){
  const c = SND.ctx, g = c.createGain(), A = SND.amb = { g, nodes:[], timers:[] };
  g.gain.value = 0; g.connect(SND.ambG); g.gain.linearRampToValueAtTime(1, c.currentTime + 2);
  const bed = (type, f, q, vol, lfo) => {
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), v = c.createGain();
    s.buffer = SND.noise; s.loop = true; fl.type = type; fl.frequency.value = f; fl.Q.value = q; v.gain.value = vol;
    s.connect(fl); fl.connect(v); v.connect(g); s.start(0, Math.random());
    A.nodes.push(s, fl, v);
    if(lfo){ const o = c.createOscillator(), og = c.createGain(); o.frequency.value = lfo.rate; og.gain.value = lfo.depth; o.connect(og); og.connect(lfo.target === 'gain' ? v.gain : fl.frequency); o.start(); A.nodes.push(o, og); }
  };
  const every = (min, max, fn) => { const tick = () => { if(SND.amb !== A) return; try{ fn(); }catch(e){} A.timers.push(setTimeout(tick, min + Math.random() * (max - min))); }; A.timers.push(setTimeout(tick, Math.random() * max)); };
  const echo = () => { const d = c.createDelay(1), fb = c.createGain(); d.delayTime.value = 0.32; fb.gain.value = 0.38; d.connect(fb); fb.connect(d); d.connect(g); A.nodes.push(d, fb); return d; };
  switch(k){
    case 'wind': bed('bandpass', 500, 0.7, 0.22, { rate:0.08, depth:300 });
      every(3000, 9000, () => { const f = 2500 + Math.random() * 1500; tone(f, 0.12, { vol:0.035, slide:1.3, dest:g }); tone(f * 1.1, 0.1, { vol:0.03, slide:1.25, at:0.16, dest:g }); }); break;
    case 'night': bed('lowpass', 400, 0.5, 0.06);
      every(700, 1600, () => { const n = 3 + Math.floor(Math.random() * 4); for(let i = 0; i < n; i++) tone(4300 + Math.random() * 200, 0.025, { vol:0.025, at:i * 0.06, dest:g }); }); break;
    case 'rain': bed('highpass', 1400, 0.4, 0.2); bed('lowpass', 500, 0.5, 0.06); break;
    case 'storm': bed('highpass', 1200, 0.4, 0.26); bed('lowpass', 300, 0.5, 0.1);
      every(8000, 20000, () => { noiseHit(3, { f:110, type:'lowpass', vol:0.55, a:0.2, dest:g }); flashLightning(); }); break;
    case 'tavern': bed('bandpass', 380, 1.2, 0.1, { rate:0.3, depth:0.04, target:'gain' });
      every(80, 450, () => noiseHit(0.02, { f:3000 + Math.random() * 3000, q:2, vol:0.04 + Math.random() * 0.07, dest:g }));
      every(4000, 11000, () => { tone(2200, 0.2, { type:'triangle', vol:0.03, dest:g }); tone(2900, 0.25, { type:'triangle', vol:0.025, at:0.05, dest:g }); }); break;
    case 'fire': bed('lowpass', 250, 0.6, 0.07);
      every(80, 500, () => noiseHit(0.02, { f:3000 + Math.random() * 3000, q:2, vol:0.03 + Math.random() * 0.07, dest:g })); break;
    case 'cave': { bed('lowpass', 140, 0.6, 0.16, { rate:0.05, depth:40 }); const e = echo();
      every(1400, 4200, () => tone(900 + Math.random() * 700, 0.16, { vol:0.09, slide:0.7, dest:e })); break; }
    case 'town': bed('bandpass', 600, 0.5, 0.08, { rate:0.15, depth:0.03, target:'gain' });
      every(2000, 6000, () => { for(let i = 0; i < 4; i++) noiseHit(0.05, { f:900, q:2, vol:0.04, at:i * 0.4, dest:g }); }); break;
    case 'battle': bed('lowpass', 200, 0.7, 0.07);

/* =========================================================
   3D KOSTKA d20 (canvas, bez knihoven)
   ========================================================= */
const ICO_V = (() => { const p = (1 + Math.sqrt(5)) / 2; return [[-1,p,0],[1,p,0],[-1,-p,0],[1,-p,0],[0,-1,p],[0,1,p],[0,-1,-p],[0,1,-p],[p,0,-1],[p,0,1],[-p,0,-1],[-p,0,1]]; })();
const ICO_F = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
const ICO_N = [20,2,14,8,16,18,4,12,6,10,1,19,7,13,5,3,17,9,15,11];
let diceSkip = null;
/* Kvaterniony pro otáčení kostky – kostka musí dopadnout tak, aby na hráče koukalo hozené číslo. */
const qMul = (a, b) => [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2], a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qAxis = (v, ang) => { const n = Math.hypot(v[0], v[1], v[2]) || 1, s = Math.sin(ang / 2); return [Math.cos(ang / 2), v[0] / n * s, v[1] / n * s, v[2] / n * s]; };
function qRot(q, v){
  const [w, x, y, z] = q;
  const ix = w*v[0] + y*v[2] - z*v[1], iy = w*v[1] + z*v[0] - x*v[2], iz = w*v[2] + x*v[1] - y*v[0], iw = -x*v[0] - y*v[1] - z*v[2];
  return [ix*w - iw*x - iy*z + iz*y, iy*w - iw*y - iz*x + ix*z, iz*w - iw*z - ix*y + iy*x];
}
/* Natočení, ve kterém stěna s číslem `final` míří přímo k hráči (osa +z). */
function diceTarget(final, twist){
  const fi = Math.max(0, ICO_N.indexOf(final)), f = ICO_F[fi];
  const c = [0,1,2].map(k => (ICO_V[f[0]][k] + ICO_V[f[1]][k] + ICO_V[f[2]][k]) / 3), n = Math.hypot(...c), u = c.map(x => x / n);
  const axis = [u[1], -u[0], 0], d = clamp(u[2], -1, 1);
  const align = Math.hypot(axis[0], axis[1]) < 1e-6 ? (d > 0 ? [1,0,0,0] : qAxis([1,0,0], Math.PI)) : qAxis(axis, Math.acos(d));
  return qMul(qAxis([0,0,1], twist || 0), align);
}
function diceAnim(final){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  sfx('dice');
  const canv = $('#diceOv')?.querySelector('canvas'), can2d = canv && canv.getContext && (() => { try{ return canv.getContext('2d'); }catch(e){ return null; } })();
  if(ls.get('dz_dice3d') === 'off' || reduce || !can2d) return new Promise(r => setTimeout(() => { if(final === 20) sfx('crit'); else if(final === 1) sfx('fail'); r(); }, reduce ? 0 : 250));
  return new Promise(res => {
    const ov = $('#diceOv'), cv = ov.querySelector('canvas'), x2 = cv.getContext('2d'), num = ov.querySelector('.dres');
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.min(window.innerWidth || 390, 440), H = 320;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    x2.setTransform(dpr, 0, 0, dpr, 0, 0);
    ov.className = 'diceov on'; num.textContent = '';
    const qT = diceTarget(final, (Math.random() - 0.5) * 0.9);
    const sAxis = [Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5], spin = (3 + Math.random() * 2) * Math.PI * 2;
    const T = 1150, t0 = performance.now(), R = 62;
    let finished = false, raf = 0, last = t0, force = false;
    const L = (() => { const v = [-0.45, 0.55, 0.7], n = Math.hypot(...v); return v.map(x => x / n); })();
    function frame(now){
      const t = force ? 1 : Math.min(1, (now - t0) / T), e = 1 - Math.pow(1 - t, 3), dt = Math.min(0.05, (now - last) / 1000); last = now;
      const cx = W * 0.18 + W * 0.32 * e, bounce = Math.abs(Math.sin(e * Math.PI * 3)) * (1 - e) * 80, cy = H * 0.5 - bounce;
      x2.clearRect(0, 0, W, H);
      x2.fillStyle = 'rgba(40,20,5,.28)'; x2.beginPath(); x2.ellipse(cx, H * 0.5 + R * 1.05, R * (0.85 - bounce / 300), 9, 0, 0, Math.PI * 2); x2.fill();
      const q = qMul(qT, qAxis(sAxis, (1 - e) * spin));   /* dotáčí se, až skončí přesně na hozeném čísle */
      const P = ICO_V.map(v => qRot(q, v));
      const faces = ICO_F.map((f, i) => {
        const a = P[f[0]], b = P[f[1]], c = P[f[2]];
        const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2], wx_ = c[0]-a[0], wy = c[1]-a[1], wz = c[2]-a[2];
        let nx = uy*wz - uz*wy, ny = uz*wx_ - ux*wz, nz = ux*wy - uy*wx_;
        const cen = [(a[0]+b[0]+c[0])/3, (a[1]+b[1]+c[1])/3, (a[2]+b[2]+c[2])/3];
        if(nx*cen[0] + ny*cen[1] + nz*cen[2] < 0){ nx = -nx; ny = -ny; nz = -nz; }   /* normála ven z tělesa */
        const n = Math.hypot(nx, ny, nz);
        return { f, i, nx:nx/n, ny:ny/n, nz:nz/n, cen };
      }).filter(o => o.nz > 0).sort((p, q) => p.cen[2] - q.cen[2]);
      const pr = v => [cx + v[0] * R / 1.75, cy - v[1] * R / 1.75];
      for(const o of faces){
        const pts = o.f.map(k => pr(P[k]));
        let lit = Math.max(0.25, o.nx * L[0] + o.ny * L[1] + o.nz * L[2]);
        const col = [250, 240, 216].map(v => Math.round(v * (0.55 + 0.45 * lit)));
        x2.beginPath(); x2.moveTo(...pts[0]); x2.lineTo(...pts[1]); x2.lineTo(...pts[2]); x2.closePath();
        x2.fillStyle = `rgb(${col})`; x2.fill();
        x2.strokeStyle = '#6b5530'; x2.lineWidth = 1.4; x2.stroke();
        if(o.nz > 0.35){
          const [px, py] = pr(o.cen);
          x2.fillStyle = `rgba(60,30,10,${Math.min(1, o.nz * 1.2)})`;
          x2.font = `700 ${Math.round(9 + o.nz * 11)}px Cinzel, serif`; x2.textAlign = 'center'; x2.textBaseline = 'middle';
          x2.fillText(ICO_N[o.i], px, py);
        }
      }
      if(t < 1 && !finished) raf = requestAnimationFrame(frame);
      else end();
    }
    function end(){
      if(finished) return; finished = true; cancelAnimationFrame(raf);
      num.textContent = final;
      ov.classList.add('done', final === 20 ? 'crit' : final === 1 ? 'fail' : 'norm');
      if(final === 20) sfx('crit'); else if(final === 1) sfx('fail');
      setTimeout(close, final === 20 || final === 1 ? 1100 : 700);
    }
    function close(){ ov.className = 'diceov'; diceSkip = null; res(); }
    diceSkip = () => { if(!finished){ force = true; cancelAnimationFrame(raf); frame(performance.now()); } else close(); };   /* přeskočení = kostka hned leží na hozeném čísle */
    raf = requestAnimationFrame(frame);
  });
}

  const entry = S.log[int(el.dataset.li)];
  if(!entry || !entry.anim){ el.classList.remove('tw'); return; }
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode:n => n.parentElement.closest('.dmtools') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT }), nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);

    const frag = document.createDocumentFragment();
    for(const part of n.nodeValue.split(/(\s+)/)){
      if(!part) continue;
      if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); continue; }
      const s = document.createElement('span'); s.className = 'w'; s.textContent = part; frag.appendChild(s);
    }
    n.parentNode.replaceChild(frag, n);

  const spans = el.querySelectorAll('span.w');

let snowOn = false, snowRaf = 0, flakes = [], flakeImg = null;
function snowFx(on){
  if(on === snowOn) return;
  snowOn = on;
  if(!on){ cancelAnimationFrame(snowRaf); setTimeout(() => { if(!snowOn){ const c = $('#snowc'); c?.getContext?.('2d')?.clearRect(0, 0, c.width, c.height); } }, 2100); return; }
  const c = $('#snowc'); if(!c || !c.getContext) return;
  const ctx = c.getContext('2d'); if(!ctx) return;
  if(!flakeImg){
    flakeImg = document.createElement('canvas'); flakeImg.width = flakeImg.height = 32;
    const g = flakeImg.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(250,252,255,.85)'); gr.addColorStop(.7, 'rgba(210,222,240,.25)'); gr.addColorStop(1, 'rgba(200,215,235,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
  }
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const size = () => { c.width = innerWidth * dpr; c.height = innerHeight * dpr; };
  size(); addEventListener('resize', size);
  const count = Math.min(140, Math.round(innerWidth * innerHeight / 7000));
  const mk = top => { const z = Math.random(); return { x:Math.random() * innerWidth, y:top ? -10 - Math.random() * 40 : Math.random() * innerHeight,
    r:1 + z * z * 3.4, vy:.35 + z * 1.15, ph:Math.random() * 6.28, sw:.4 + Math.random() * 1.2, sp:.008 + Math.random() * .02, a:.35 + z * .6 }; };
  flakes = Array.from({ length:count }, () => mk(false));
  let wind = 0, last = performance.now();
  const step = now => {
    if(!snowOn) return;
    snowRaf = requestAnimationFrame(step);
    if(document.hidden) return;
    const dt = Math.min(3, (now - last) / 16.7); last = now;
    wind += (Math.sin(now / 4000) * .5 - wind) * .01;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for(const f of flakes){
      f.ph += f.sp * dt;
      f.y += f.vy * dt; f.x += (Math.sin(f.ph) * f.sw * .5 + wind) * dt;
      if(f.y > innerHeight + 10 || f.x < -20 || f.x > innerWidth + 20) Object.assign(f, mk(true));
      ctx.globalAlpha = f.a;
      const d = f.r * 4.2; ctx.drawImage(flakeImg, f.x - d / 2, f.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  };
  snowRaf = requestAnimationFrame(step);
}

let idbP = null;
function idb(){
  return idbP ||= new Promise((res, rej) => {
    const r = indexedDB.open('dndzaoo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPut(k, v){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('img', 'readwrite'); tx.objectStore('img').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise(res => { const r = db.transaction('img').objectStore('img').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); }
async function geminiImageModel(){
  const cached = ls.get('dz_img_model'); if(cached) return cached;
  const key = ls.get('kroniky_key_gemini'); if(!key) throw new Error('chybí Gemini klíč');
  const r = await gemFetch(GEM + 'models?pageSize=200');
  const d = await r.json().catch(() => null);
  if(!r.ok) throw gemErr(r, d);
  const ids = (d?.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, '')).filter(n => /gemini/.test(n) && /image/.test(n));
  const p = ids.find(n => /lite/.test(n) && !/preview/.test(n)) || ids.find(n => /lite/.test(n))   /* „Lite“ je nejlevnější */
    || ids.find(n => /flash/.test(n) && !/preview/.test(n)) || ids.find(n => /flash/.test(n)) || ids[0];
  if(!p) throw new Error('tvůj účet nemá žádný obrázkový model Gemini');
  ls.set('dz_img_model', p); return p;
}
/* Jeden obrázek z Gemini → uloží se do IndexedDB, vrací 'idb:…'. */
async function geminiImage(prompt){
  const model = await geminiImageModel();
  const r = await gemFetch(`${GEM}models/${model}:generateContent`, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ contents:[{ role:'user', parts:[{ text:prompt }] }], generationConfig:{ responseModalities:['TEXT','IMAGE'] } }) });
  const d = await r.json().catch(() => null);
  if(!r.ok){ if(r.status === 404) ls.set('dz_img_model', ''); throw gemErr(r, d); }
  const part = (d?.candidates?.[0]?.content?.parts || []).find(p => p.inlineData || p.inline_data);
  const inl = part && (part.inlineData || part.inline_data);
  if(!inl) throw new Error('model nevrátil obrázek');
  trackGemini(null, true);
  const id = 'img' + Date.now() + Math.floor(Math.random() * 1000);
  const url = `data:${inl.mimeType || inl.mime_type || 'image/png'};base64,${inl.data}`;
  await idbPut(id, url); IMGCACHE[id] = url;
  return 'idb:' + id;
}

function hydrateImages(){
  document.querySelectorAll('img.illu[data-src], img.npcpic[data-src], img.saypic[data-src], img.heroimg[data-src]').forEach(async im => {
    if(im.dataset.done) return; im.dataset.done = 1;
    const src = im.dataset.src;
    if(!src.startsWith('idb:')){ if(im.src !== src) im.src = src; return; }
    const k = src.slice(4);
    if(!IMGCACHE[k]) IMGCACHE[k] = await idbGet(k);
    if(IMGCACHE[k]) im.src = IMGCACHE[k]; else im.remove();
  });

function parseFirebaseConfig(t){

const fsUrl = (c, doc) => `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(c.projectId)}/databases/(default)/documents/dndzaoo/${encodeURIComponent(doc)}?key=${encodeURIComponent(c.apiKey)}`;
async function fsPut(c, doc, obj){
  const r = await fetch(fsUrl(c, doc), { method:'PATCH', headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ fields:{ data:{ stringValue:JSON.stringify(obj) }, updated:{ integerValue:String(Date.now()) } } }) });
  if(!r.ok){ const d = await r.json().catch(() => null); throw new Error(d?.error?.message || 'HTTP ' + r.status); }
}
async function fsGet(c, doc){
  const r = await fetch(fsUrl(c, doc));
  if(r.status === 404) return null;
  const d = await r.json().catch(() => null);
  if(!r.ok) throw new Error(d?.error?.message || 'HTTP ' + r.status);
  return d?.fields?.data?.stringValue ? JSON.parse(d.fields.data.stringValue) : null;
}
let cloudTimer = null, cloudBusy = false;
function cloudSchedule(){ const c = cloudCfg(); if(!c?.on) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(() => cloudUpload(false), 6000); }
async function cloudUpload(manual){
  const c = cloudCfg();
  if(!c || !S || cloudBusy) return;
  cloudBusy = true;
  try{
    const CH = 400, bk = S.book || [], n = Math.ceil(bk.length / CH), sent = int(ls.get('dz_bk_' + S.slot));
    for(let i = Math.max(0, sent - 1); i < n; i++) await fsPut(c, `${c.code}__${S.slot}__b${i}`, bk.slice(i * CH, (i + 1) * CH));
    ls.set('dz_bk_' + S.slot, String(n));
    await fsPut(c, `${c.code}__${S.slot}`, { ...S, book:[], bookChunks:n });
    const remote = (await fsGet(c, c.code).catch(() => null)) || [];
    const merged = {};
    for(const s of remote.concat(slotList())) if(!merged[s.id] || merged[s.id].updated < s.updated) merged[s.id] = s;
    await fsPut(c, c.code, Object.values(merged));
    ls.set('dz_cloud_last', String(Date.now()));
    if(manual) alert('☁️ Uloženo do cloudu.');
  }catch(e){ if(manual) alert('Cloud: ' + e.message); else console.warn('cloud', e); }
  finally{ cloudBusy = false; }
}
async function cloudDownload(){
  const c = cloudCfg();
  if(!c) return alert('Nejdřív nastav cloud.');
  let idx;
  try{ idx = await fsGet(c, c.code); }catch(e){ return alert('Cloud: ' + e.message); }
  if(!idx || !idx.length) return alert('V cloudu pro tento kód zatím nic není.');
  const m = await pick('☁️ Které uložení stáhnout?', idx.sort((a,b) => b.updated - a.updated).map(s => ({ label:`${CLASSES[s.cls]?.ikona || ''} ${s.name} · ${s.level}. úr. · den ${s.day}${s.dead ? ' ☠️' : ''}`, value:s })));
  if(!m) return;
  try{
    const g = await fsGet(c, `${c.code}__${m.id}`);
    if(!g) throw new Error('uložení nenalezeno');
    const bookAll = [];
    for(let i = 0; i < (g.bookChunks || 0); i++){ const ch = await fsGet(c, `${c.code}__${m.id}__b${i}`); if(ch) bookAll.push(...ch); }
    g.book = bookAll; delete g.bookChunks; g.slot = m.id;
    localStorage.setItem(slotKey(m.id), JSON.stringify(g));
    const l = slotList().filter(s => s.id !== m.id); l.unshift(slotMeta(g)); writeSlots(l);
    ls.set('dz_bk_' + m.id, String(Math.ceil(bookAll.length / 400)));

    S = load(m.id); initState();
    closeSheet(); closeDrawer(); show('game'); render();

}
