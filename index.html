function parseJSON(text){
  try{ return JSON.parse(text); }catch(e){}
  const m = String(text).match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return null;
}
function checkRaw(out){
  if(!out || typeof out !== 'object') throw new Error('AI vrátila nečitelnou odpověď');
  return out;
}
function checkOut(out){
  if(!out || !out.vypraveni) throw new Error('AI vrátila nečitelnou odpověď');
  return out;
}
async function fetchDM(req){ const p = getProvider(); return p === 'claude' ? fetchClaude(req) : p === 'grok' ? fetchGrok(req) : fetchGemini(req); }

/* Claude (Anthropic) – volání přímo z prohlížeče. Dlouhé pokyny Pána jeskyně se ukládají do mezipaměti
   (prompt caching), takže se při dalších tazích platí jen zlomek ceny. */
const CLAUDE_MODELS = [
  ['claude-sonnet-5-5', 'Sonnet 5.5', 'doporučeno · nejlepší poměr kvality a ceny'],
  ['claude-haiku-5-5', 'Haiku 5.5', 'nejlevnější a nejrychlejší'],
  ['claude-opus-5-5', 'Opus 5.5', 'nejchytřejší, ale dražší']
];
const claudeModel = () => ls.get('kroniky_claude_model') || CLAUDE_MODELS[0][0];
const claudeName = id => (CLAUDE_MODELS.find(m => m[0] === id) || [id, id])[1];
async function fetchClaude(req){
  const body = { model:claudeModel(), max_tokens:2500, temperature:0.9,
    system:[{ type:'text', text:req.sys || SYSTEM, cache_control:{ type:'ephemeral' } }],
    messages:[{ role:'user', content:req.prompt || buildPrompt(req) }] };
  const send = b => fetch('https://api.anthropic.com/v1/messages', { method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':getKey(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body:JSON.stringify(b) });
  let r = await send(body), d = await r.json().catch(() => null);
  if(r.status === 400 && /temperature/i.test(d?.error?.message || '')){ delete body.temperature; r = await send(body); d = await r.json().catch(() => null); }
  if(!r.ok) throw claudeErr(r, d);
  const out = parseJSON((d?.content || []).filter(c => c.type === 'text').map(c => c.text).join(''));
  return req.prompt ? checkRaw(out) : checkOut(out);
}
function claudeErr(r, d){
  const m = d?.error?.message || ('HTTP ' + r.status), k = getKey();
  if(r.status === 401) return new Error(`Claude odmítl API klíč (${keyHint(k)}). Zkontroluj, že je celý – začíná „sk-ant-“.`);
  if(/credit balance|billing/i.test(m)) return new Error('Na účtu Claude došel kredit – dobij ho na platform.claude.com → Billing.');
  if(r.status === 404 || /model/i.test(m) && r.status === 400){ ls.set('kroniky_claude_model', ''); return new Error('Model ' + claudeName(claudeModel()) + ' není dostupný – přepnul jsem na výchozí, zkus to znovu. [' + m + ']'); }
  if(r.status === 429) return new Error('Moc dotazů najednou – chvilku počkej a zkus to znovu.');
  if(r.status === 529 || r.status >= 500) return new Error('Claude je teď přetížený – zkus to za chvilku znovu.');
  return new Error(m);
}

/* Gemini: modely se často přejmenovávají, proto je bereme ze seznamu.
   Výchozí je nejlevnější „flash-lite“, který má bezplatný limit. */
const GEM = 'https://generativelanguage.googleapis.com/v1beta/';
/* Volání Gemini s klíčem. Nové klíče „AQ.…“ Google občas odmítá v hlavičce (401 „Expected OAuth 2 access token“),
   proto při 401 zkusíme klíč v adrese (?key=) a co projde, si zapamatujeme. */
async function gemFetch(url, opts = {}, key = cleanKey(ls.get('kroniky_key_gemini'))){
  const viaQuery = () => fetch(url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key), { ...opts, headers:{ ...(opts.headers || {}) } });
  const viaHeader = () => fetch(url, { ...opts, headers:{ ...(opts.headers || {}), 'x-goog-api-key':key } });
  const q = ls.get('dz_gem_auth') === 'q';
  let r = await (q ? viaQuery() : viaHeader());
  if(r.status === 401){
    const r2 = await (q ? viaHeader() : viaQuery());
    if(r2.ok){ ls.set('dz_gem_auth', q ? '' : 'q'); return r2; }
    if(r2.status !== 401) return r2;
  }
  return r;
}
function gemErr(r, d){
  const m = (d && d.error && d.error.message) || ('HTTP ' + r.status);
  if(r.status === 401 || r.status === 403 && /API key|unregistered|permission/i.test(m) || /API key not valid|API_KEY_INVALID/i.test(m)){
    const k = cleanKey(ls.get('kroniky_key_gemini'));
    return new Error(`Google odmítl API klíč (${keyHint(k)}). ` +
      (/^AQ\./.test(k) ? 'Nové klíče začínající „AQ.“ teď u Googlu často nefungují – je to chyba na jejich straně. Zkus v AI Studiu (aistudio.google.com → Get API key) vytvořit nový klíč, ideálně v novém projektu; funkční klíč obvykle začíná „AIza“. '
        : 'Zkontroluj, že je zkopírovaný celý (klíč Gemini má obvykle 39 znaků a začíná „AIza“). ') + '[' + m + ']');
  }
  return new Error(m);
}
async function geminiModels(){
  const r = await gemFetch(GEM + 'models?pageSize=200');
  const d = await r.json().catch(() => null);
  if(!r.ok) throw gemErr(r, d);
  const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [0,0])[1]);
  return (d?.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /^gemini-[\d.]+-flash/.test(n) && !/image|tts|live|transcribe|audio|embed|vision|thinking|exp|\d{3,}$/i.test(n))
    .sort((a,b) => ver(b) - ver(a) || a.length - b.length);
}
async function geminiModel(){
  const cached = ls.get('kroniky_gemini_model');
  if(cached) return cached;
  const list = await geminiModels();
  const stable = list.filter(n => !/preview/i.test(n));
  const pick = stable.find(n => /flash-lite/.test(n)) || list.find(n => /flash-lite/.test(n)) || stable[0] || list[0];
  if(!pick) throw new Error('Nenašel jsem žádný model Gemini Flash');
  ls.set('kroniky_gemini_model', pick);
  return pick;
}
async function fetchGemini(req){
  const model = await geminiModel();
  const noThink = ls.get('kroniky_gemini_think') !== 'x';   /* „přemýšlení“ se platí jako výstup – vypínáme */
  const send = gc => gemFetch(`${GEM}models/${model}:generateContent`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({
      systemInstruction:{ parts:[{ text:req.sys || SYSTEM }] },
      contents:[{ role:'user', parts:[{ text:req.prompt || buildPrompt(req) }] }],
      generationConfig:gc
    })
  });
  /* Různé modely přijímají různá nastavení. Zkoušíme od nejlevnějšího po nejjednodušší
     a co projde, si zapamatujeme (při chybě 400 „invalid argument“ jdeme o krok dál). */
  const base = { temperature:0.9, maxOutputTokens:2500 };
  const modes = [
    { ...base, responseMimeType:'application/json', thinkingConfig:{ thinkingBudget:0 } },
    { ...base, responseMimeType:'application/json', thinkingConfig:{ thinkingLevel:'low' } },
    { ...base, responseMimeType:'application/json' },
    { ...base }
  ];
  let mi = clamp(int(ls.get('kroniky_gemini_mode')), 0, modes.length - 1), r, d;
  if(!noThink) mi = Math.max(mi, 2);
  for(;;){
    r = await send(modes[mi]); d = await r.json().catch(() => null);
    if(r.ok || r.status !== 400 || mi >= modes.length - 1) break;
    mi++;
  }
  if(r.ok) ls.set('kroniky_gemini_mode', String(mi));
  else if(r.status === 400) ls.set('kroniky_gemini_mode', '');
  if(!r.ok){
    if(r.status === 404) ls.set('kroniky_gemini_model', '');
    if(r.status === 429) throw new Error('vyčerpán bezplatný limit – zkus to za chvíli, nebo přepni model v Kronice');
    throw gemErr(r, d);
  }
  const parts = (d?.candidates?.[0]?.content?.parts || []).filter(p => !p.thought);
  const out = parseJSON(parts.map(p => p.text || '').join(''));
  return req.prompt ? checkRaw(out) : checkOut(out);
}

/* Grok (xAI) – API kompatibilní s OpenAI. Model se vybere automaticky ze seznamu dostupných. */
async function grokModel(){
  const cached = ls.get('kroniky_grok_model');
  if(cached) return cached;
  const r = await fetch('https://api.x.ai/v1/models', { headers:{ Authorization:'Bearer ' + getKey() } });
  const d = await r.json().catch(() => null);
  if(!r.ok) throw new Error((d && (d.error?.message || d.error)) || ('HTTP ' + r.status));
  const ids = (d?.data || []).map(m => m.id).filter(id => /^grok/i.test(id) && !/image|vision|imagine|video|embed|code/i.test(id));
  if(!ids.length) throw new Error('Nenašel jsem žádný model Grok');
  const pick = ids.find(id => /fast/i.test(id) && /non-reasoning/i.test(id)) || ids.find(id => /fast|mini/i.test(id)) || ids[0];
  ls.set('kroniky_grok_model', pick);
  return pick;
}
async function fetchGrok(req){
  const model = await grokModel();
  const r = await fetch('https://api.x.ai/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + getKey() },
    body:JSON.stringify({ model, temperature:0.9, max_tokens:3000, response_format:{ type:'json_object' },
      messages:[ { role:'system', content:req.sys || SYSTEM }, { role:'user', content:req.prompt || buildPrompt(req) } ] })
  });
  const d = await r.json().catch(() => null);
  if(!r.ok){
    if(r.status === 404 || /model/i.test(JSON.stringify(d || ''))) ls.set('kroniky_grok_model', '');
    throw new Error((d && (d.error?.message || d.error)) || ('HTTP ' + r.status));
  }
  const out = parseJSON(d?.choices?.[0]?.message?.content || '');
  return req.prompt ? checkRaw(out) : checkOut(out);
}

/* =========================================================
   SHRNUTÍ POSTUPU NA VYŽÁDÁNÍ
   Samostatné volání AI: nic nemění na hře (čas, tahy, historie, boj),
   výsledek se jen uloží do S.recap, aby se při dalším otevření nemusel platit znovu.
   ========================================================= */
const RECAP_SYS = `Jsi kronikář textové hry Dungeons & Dragons. Hráč si vyžádal přehled, kde se v příběhu nachází.
Piš česky, věcně, ve druhé osobě („vydal ses…“), bez vymýšlení nových událostí – vycházej JEN z dodaného stavu, shrnutí a historie.
Neprozrazuj tajemství, která hráč ještě neodhalil. Odpověz POUZE platným JSON objektem:
{"pribeh":"dosavadní příběh v 3–6 větách","situace":"kde přesně hráč je a co se právě děje, 1–3 věty","ukoly":["otevřený úkol / nevyřešená záhada – stručně, co zbývá udělat"],"postavy":["Jméno – kdo to je a jaký má k hráči vztah"],"rady":["konkrétní možný další krok"]}
"ukoly" max 6, "postavy" jen ty důležité (max 6), "rady" 2–4.`;

function recapPrompt(){
  const who = k => k === 'hrac' ? 'HRÁČ' : k === 'pj' ? 'PÁN JESKYNĚ' : 'HRA';
  const hist = S.history.slice(-24).map(h => `${who(h.kdo)}: ${h.text}`).join('\n\n');
  return `AKTUÁLNÍ STAV HRY:
${JSON.stringify(publicState(), null, 1)}

SHRNUTÍ STARŠÍHO DĚNÍ:
${S.summary || '(zatím nic)'}

POSLEDNÍ DĚNÍ:
${hist || '(hra právě začala)'}

Sestav přehled postupu hráče podle zadaného JSON formátu.`;
}
const recapList = v => (Array.isArray(v) ? v : v ? [v] : []).map(x => typeof x === 'string' ? x : x && typeof x === 'object' ? Object.values(x).filter(y => typeof y === 'string').join(' – ') : String(x ?? '')).map(x => x.trim()).filter(x => x && x !== '[object Object]').slice(0, 8);
function sanitizeRecap(o){
  const str = v => typeof v === 'string' ? v.trim().slice(0, 2000) : '';
  const r = { pribeh:str(o.pribeh), situace:str(o.situace), ukoly:recapList(o.ukoly), postavy:recapList(o.postavy), rady:recapList(o.rady).slice(0,4) };
  if(!r.pribeh && !r.situace) throw new Error('AI nevrátila žádné shrnutí');
  return r;
}
function mockRecap(){
  const open = S.quests.filter(q => !q.done);
  return { pribeh:`${S.char.name} se vydal za dobrodružstvím ve světě ${SETTINGS[S.setting].nazev}. ${S.summary || 'Příběh teprve začíná.'} *(demo)*`,
    situace:`Právě se nacházíš: ${S.location || 'neznámo kde'}. ${S.foes.length ? 'Probíhá boj!' : 'Je klid.'}`,
    ukoly:open.map(q => q.title + (q.popis ? ' – ' + q.popis : '')),
    postavy:Object.entries(S.npcs).map(([k,n]) => `${k} – ${n.popis || ''}`),
    rady:(S.suggestions || []).slice(0,3).concat(open.length ? [] : ['Rozhlédni se po okolí a vyptávej se místních.']) };
}
let recapBusy = false;
function recapFresh(){ return S.recap && S.recap.turn === S.turn && S.recap.hl === S.log.length; }
function recapHTML(){
  const r = S.recap, ul = a => a.length ? `<ul>${a.map(x => `<li>${rich(x)}</li>`).join('')}</ul>` : '<p class="muted">—</p>';
  const body = recapBusy
    ? `<div class="rwait"><span>📜</span><br>Kronikář listuje v zápiscích…</div>`
    : r ? `${r.err ? `<p class="muted">⚠️ ${esc(r.err)}</p>` : ''}
      ${r.situace ? `<h4>📍 Kde teď jsi</h4><p>${rich(r.situace)}</p>` : ''}
      ${r.pribeh ? `<h4>📖 Dosavadní příběh</h4><p>${rich(r.pribeh)}</p>` : ''}
      <h4>🎯 Otevřené úkoly a záhady</h4>${ul(r.ukoly || [])}
      ${(r.postavy || []).length ? `<h4>👤 Důležité postavy</h4>${ul(r.postavy)}` : ''}
      ${(r.rady || []).length ? `<h4>🧭 Co dál</h4>${ul(r.rady)}` : ''}
      ${r.turn != null ? `<div class="rmeta">Sepsáno v tahu ${r.turn}${r.cas ? ' · ' + esc(r.cas) : ''}${recapFresh() ? ' · aktuální' : ' · od té doby se hrálo dál'}</div>` : ''}`
    : `<p class="muted">Zatím žádné shrnutí.</p>`;
  return `<h3>📜 Shrnutí postupu</h3><div class="recap">${body}</div>
    ${recapBusy ? '' : `<button class="btn" data-act="recapnew">${r && !r.err ? '🔄 Sepsat znovu' : '✍️ Nechat AI sepsat'}</button>`}
    <button class="cancel" data-act="closesheet">Zavřít</button>`;
}
function recapOpen(){
  if(!S) return;
  if(S.recap && !S.recap.err){ openSheet(recapHTML()); return; }
  makeRecap(); openSheet(recapHTML());
}
async function makeRecap(){
  if(!S || recapBusy) return;
  recapBusy = true;
  const refresh = () => { if($('#sheet .recap')) $('#sheet').innerHTML = '<div class="grip"></div>' + recapHTML(); };
  refresh();
  const turn = S.turn, hl = S.log.length, cas = timeStr(), slot = S.slot;
  try{
    const out = isDemo() ? (await new Promise(r => setTimeout(r, 500)), mockRecap()) : await fetchDM({ sys:RECAP_SYS, prompt:recapPrompt() });
    if(!S || S.slot !== slot) return;
    S.recap = { ...sanitizeRecap(out), turn, hl, cas };
    save();
  }catch(e){
    if(S && S.slot === slot) S.recap = { ...(S.recap && !S.recap.err ? S.recap : {}), err:'Kronikář se odmlčel (' + e.message + ').' };
  }finally{
    recapBusy = false; refresh();
  }
}

async function callDM(input){
  if(busy) return;
  busy = true; S.lastFailed = null; render();
  const needSummary = S.history.length >= SUMMARY_AT;
  const req = { stav:publicState(), shrnuti:S.summary, historie:S.history.slice(-HIST_SEND), vstup:input, potrebaShrnuti:needSummary };
  try{
    const res = isDemo() ? await mockDM(req) : await fetchDM(req);
    applyResponse(res, needSummary, input);
  }catch(e){
    S.lastFailed = input;
    addLog({ t:'err', text:'Pán jeskyně se odmlčel (' + e.message + ').' });
  }finally{
    busy = false; render(); save();
    runQueue();
  }
}
/* Navazující volání (popis cesty, náhodná událost) – spustí se samo, jen když hráč nemusí nic řešit. */
function runQueue(){
  if(!S || !S.queue || busy) return;
  if(S.dead || S.pending || S.loot || S.lastFailed){ if(!S.lastFailed) S.queue = null; return; }
  const q = S.queue; S.queue = null;
  setTimeout(() => callDM(q), 350);
}

/* =========================================================
   ZPRACOVÁNÍ ODPOVĚDI – kód hlídá pravidla, AI jen navrhuje
   ========================================================= */
const hist = text => S.history.push({ kdo:'system', text });
let scrollNew = false;

function applyResponse(res, needSummary, input = {}){
  const text = String(res.vypraveni || '').trim() || '…';
  S.turn++;
  S.history.push({ kdo:'pj', text });
  addLog({ t:'dm', text, anim:twOn() || undefined });
  book('pj', text);
  if(ttsOn()) speak(text);
  scrollNew = true;
  const ef = res.efekty && typeof res.efekty === 'object' ? res.efekty : {};
  applyEffects(ef);
  if(int(ef.xp) > 0) grantXP(clamp(int(ef.xp), 0, 200), 'za tvé činy');
  offerLoot(ef.nalezeno);
  if(S.startCombatPending){ const pv = S.startCombatPending; S.startCombatPending = null; startCombat(pv === 'zadne' ? null : pv); }
  applyCombatConds(ef.stav_boje);
  /* kolo: v prvním kole útočí jen ti, kdo mají vyšší iniciativu než hráč */
  let attackers = arr(ef.utoci);
  if(S.cb?.first){
    attackers = S.foes.filter(f => (f.ini ?? 0) > S.cb.pIni && !f.st.neschopen).map(f => f.jmeno);
    if(attackers.length) addLog({ t:'sys', text:'⚡ Nepřátelé jsou rychlejší – útočí jako první.' });
  }
  foeAttacks(attackers);
  S.suggestions = arr(res.navrhy).slice(0,3).map(x => String(x).slice(0,60));
  setPending(res.zkouska);
  if(S.cb){ if(!S.foes.length) endCombat(); else if(!S.pending) newPlayerTurn(); }
  if(needSummary && res.shrnuti){
    S.summary = String(res.shrnuti).slice(0,1500);
    S.history = S.history.slice(-KEEP_AFTER_SUMMARY);
  }
  checkDeath();
  if(!S.dead && !S.dying) passTime(ef, input);
  checkDeath();
}

/* Čas, spánek a cestování podle odpovědi AI. Náhodu hází kód. */
function passTime(ef, input){
  const auto = ['prichod','udalost','noc','bezvedomi'].includes(input.typ);   /* čas už posunula hra */
  const cesta = !auto && ef.cesta && typeof ef.cesta === 'object' && String(ef.cesta.cil || '').trim() && !S.foes.length;
  const sp = !auto && ef.spanek && typeof ef.spanek === 'object' && !S.foes.length ? ef.spanek : null;

  if(cesta){
    const cil = String(ef.cesta.cil).trim().slice(0,80), danger = ['nizke','stredni','vysoke'].includes(ef.cesta.nebezpeci) ? ef.cesta.nebezpeci : 'stredni';
    let hodiny = clamp(Number(ef.cesta.hodiny) || 2, 0.5, 48);
    const M = S.mount ? MOUNTS[S.mount.typ] : null, w = wx(), lr = loadRatio();
    hodiny = Math.round(hodiny * w.travel * (M ? M.travel : 1) * (!M && species().rychlost > 30 ? 0.9 : 1) * (lr > 1.5 ? 1.6 : lr > 1 ? 1.3 : 1) * 10) / 10;
    const ev = rollTravelEvent(danger);
    if(ev?.hodiny) hodiny += ev.hodiny;
    if(ev?.unava) S.needs.unava = Math.min(100, S.needs.unava + ev.unava);
    S.travel = { cil, from:S.here, hodiny, danger };
    const why = [w.travel > 1 ? `${w.i} ${w.n.toLowerCase()} zdržuje` : '', M ? `${M.i} ${M.n.toLowerCase()}` : '', lr > 1 ? '🏋️ přetížený' : ''].filter(Boolean).join(', ');
    addLog({ t:'sys', text:`🧭 Cesta do: ${cil} · ${fmtHours(hodiny)}${why ? ' (' + why + ')' : ''}` });
    book('sys', `Vydal se na cestu do ${cil}.`);
    /* počasí unavuje víc, kůň méně */
    S.needs.unava = clamp(S.needs.unava + hodiny * ((w.unava || 0) - (M ? 4 * (1 - M.unava) : 0)), 0, 100);
    exposure(hodiny);
    if(ev){
      const part = Math.round(hodiny * (0.35 + Math.random() * 0.3) * 10) / 10;   /* událost přijde někde v půlce cesty */
      advanceTime(part, false);
      S.travel.zbyva = Math.round((hodiny - part) * 10) / 10;
      addLog({ t:'sys', text:'⚠️ Na cestě se něco děje…' });
      hist(`Hráč vyrazil do ${cil}. Náhodná událost na cestě (${ev.k}).`);
      S.queue = { typ:'udalost', cil, popis:ev.t, cas:timeStr() };
    }else{
      advanceTime(hodiny, false);
      hist(`Hráč cestoval ${fmtHours(hodiny)} do ${cil} bez nehod.`);
      S.queue = { typ:'prichod', cil, hodiny:Math.round(hodiny * 10) / 10, cas:timeStr() };
    }
    return;
  }

  if(sp){
    const hodiny = clamp(Number(sp.hodiny) || 8, 1, 14), safe = sp.bezpecne !== false;
    const ev = !safe && Math.random() < (isNight() || hodiny >= 6 ? 0.35 : 0.2) ? pickWeighted(NIGHT_EVENTS) : null;
    if(ev){
      const slept = Math.max(1, Math.floor(1 + Math.random() * (hodiny - 1)));
      advanceTime(slept, true);
      exposure(slept);
      if(slept >= (species().trans ? 4 : 6)){ rechargeAbilities(); addLog({ t:'fx', notes:[{ c:'good', t:'✨ Schopnosti obnoveny' }] }); }
      addLog({ t:'sys', text:`💤 Spal jsi ${slept} h… a pak tě něco vzbudilo.` });
      hist(`Hráč spal ${slept} h na nebezpečném místě a byl vzbuzen (${ev.k}).`);
      S.queue = { typ:'noc', hodiny:slept, popis:ev.t, cas:timeStr() };
    }else{
      const r = advanceTime(hodiny, true);
      if(!safe) exposure(hodiny);
      addLog({ t:'sys', text:`💤 Spal jsi ${hodiny} h${safe ? '' : ' a nikdo tě nerušil'}. Je ${timeStr()}.` });
      if(CLASSES[S.char.cls].caster === 'pact' && hodiny >= 1 && hodiny < (species().trans ? 4 : 6)){ S.slots = slotMax(); addLog({ t:'fx', notes:[{ c:'good', t:'👁️ Sloty paktu obnoveny' }] }); }
      if(hodiny >= (species().trans ? 4 : 6)){ rechargeAbilities(); addLog({ t:'fx', notes:[{ c:'good', t:'✨ Schopnosti obnoveny' }] }); hist('Spánkem se hráči obnovily všechny schopnosti a sloty kouzel.'); }
      hist(`Hráč se vyspal (${hodiny} h${safe ? '' : ', noc venku proběhla klidně'}). Je ${timeStr()}, uzdravil se o ${r.healed} HP, únava ${Math.round(S.needs.unava)}/100.`);
    }
    return;
  }

  if(S.arriveH){ const z = S.arriveH; S.arriveH = 0; advanceTime(z, false); if(auto) return; }   /* zbytek cesty po události */
  if(!auto){
    const h = ef.cas_hodiny === undefined || ef.cas_hodiny === null || ef.cas_hodiny === '' ? 1/6 : clamp(Number(ef.cas_hodiny) || 0, 0, 12);
    if(h) advanceTime(h, false);
  }
}

function checkDeath(){
  if(S.char.hp > 0 || S.dead || S.dying) return;
  if(species().relentless && !S.relentlessUsed){
    S.relentlessUsed = true; S.char.hp = 1;
    addLog({ t:'fx', notes:[{ c:'good', t:'💪 Nezlomnost: místo pádu zůstáváš na 1 HP' }] });
    hist('Hráč (ork) měl padnout, ale díky Nezlomnosti zůstal stát s 1 HP (jednou za odpočinek).');
    return;
  }
  startDying();
}

/* Úkol může od AI přijít jako text i jako objekt – sjednotit. */
function normQuest(x){
  if(!x) return null;
  if(typeof x === 'object'){
    const title = String(x.nazev || x.title || x.ukol || x.jmeno || x.popis || '').trim().slice(0,120);
    return title && title !== '[object Object]' ? { title, popis:String(x.popis && x.popis !== title ? x.popis : '').trim().slice(0,240), done:!!x.done } : null;
  }
  const title = String(x).trim().slice(0,120);
  return title && title !== '[object Object]' ? { title, popis:'', done:false } : null;
}

function applyEffects(ef){

    else if(jz === 'ztraceno' || jz === 'ztracen' || jz === 'zadne'){ if(S.mount) notes.push({ c:'bad', t:`− ${S.mount.nazev}` }); S.mount = null; }
    const op = ef.oprava;

      for(const it of list){ if(wearOf(it) < 100){ it.stav = 100; notes.push({ c:'good', t:`🔨 Opraveno: ${it.nazev}` }); } }
    }
    for(const raw of gifts){

      else if(it){ notes.push({ c:'bad', t:'🎒 Batoh je plný – ' + it.nazev + ' zůstává' }); hist(`Batoh je plný, ${it.nazev} hráč nemohl vzít.`); }
    }
  }

  for(const raw of arr(ef.odebrat).slice(0,5)){

    const it = findItem(name);

  if(ef.novy_ukol){

      S.questXP = (S.questXP || 0) + (k - (S.storyStep || 0)) * (150 + 75 * S.char.level);

  if(ef.lokace){

  if(ef.jidlo === true || ef.jidlo === 'true'){ const b = S.needs.hlad; S.needs.hlad = Math.max(0, b - 60); if(b - S.needs.hlad >= 5) notes.push({ c:'good', t:'🍖 Najedl ses' }); }
  for(const n of arr(ef.odebrat_stavy).slice(0,5)){
    const t = low(typeof n === 'object' && n ? n.nazev : n);
    const e = t && (S.effects.find(x => low(x.nazev) === t) || S.effects.find(x => low(x.nazev).includes(t) || t.includes(low(x.nazev))));
    if(e){ S.effects = S.effects.filter(x => x !== e); notes.push({ c:'good', t:`✔️ Vyléčeno: ${e.nazev}` }); }

  for(const raw of arr(ef.stavy).slice(0,3)){

    if(same){ Object.assign(same, { ...e, id:same.id }); continue; }
    S.effects.push(e);
    notes.push({ c:e.typ === 'pozehnani' ? 'good' : 'bad', t:`${EFF_TYPES[e.typ].i} ${e.nazev}` });
  }
  for(const n of arr(ef.npc).slice(0,4)){
    if(!n || !n.jmeno) continue;
    const k = String(n.jmeno).slice(0,40), prev = S.npcs[k], isNew = !prev;
    const z = clamp(int(n.zmena), -30, 30);
    const base = prev ? (prev.skore ?? 0) : (/přát|vděč|věrn|milý/i.test(n.vztah || '') ? 25 : /nepřát|zl|nenávid|podezí/i.test(n.vztah || '') ? -25 : 0);
    S.npcs[k] = { popis:String(n.popis || prev?.popis || '').slice(0,160), vztah:String(n.vztah || prev?.vztah || 'neutrální').slice(0,30), skore:clamp(base + z, -100, 100) };
    if(isNew) notes.push({ c:'npc', t:'👤 ' + k });
    else if(z) notes.push({ c:z > 0 ? 'good' : 'bad', t:`👤 ${k} ${z > 0 ? '💚 +' + z : '💔 ' + z}` });
  }
  for(const pv of arr(ef.povest).slice(0,3)){
    if(!pv || typeof pv !== 'object') continue;
    /* pověst patří celému místu (osadě), ne konkrétní místnosti */
    const here = !pv.misto || low(pv.misto) === low(S.location) || placeKey(pv.misto) === placeKey(S.location);
    const key = here ? (S.here || placeKey(S.location)) : placeKey(pv.misto), z = clamp(int(pv.zmena), -25, 25);
    if(!key || !z) continue;
    S.rep[key] = clamp((S.rep[key] || 0) + z, -100, 100);
    notes.push({ c:z > 0 ? 'good' : 'bad', t:`🏛️ Pověst (${S.places?.[key]?.nazev || placeBase(pv.misto || S.location)}) ${z > 0 ? '+' : ''}${z}` });
  }
  if(notes.length) addLog({ t:'fx', notes });
  if(S.questXP){ const x = S.questXP; S.questXP = 0; grantXP(x, 'splněný úkol'); }
}
const SUBLOC_RE = /sklep|pokoj|chodb|síň|komnat|dvůr|dvoře|zahrad|stáj|kuchyn|půd|patr|cel[aey]|nádvoř|vnitř|uvnitř|před |za domem|pult|výčep|sál|kaple|věž|brán|ulic|náměst|trh/;

function offerLoot(n){
  if(!n || typeof n !== 'object') return;
  const items = arr(n.predmety).slice(0,8).map(sanitizeItem).filter(Boolean);
  const zlato = clamp(int(n.zlato), 0, 5000);
  if(!items.length && !zlato) return;
  const id = newId('l');
  S.loot = { id, items, zlato, sel:items.map(i => i.id) };
  addLog({ t:'loot', id });
}
function takeLoot(mode){
  const L = S.loot;
  if(!L) return;
  const chosen = mode === 'all' ? L.items : mode === 'none' ? [] : L.items.filter(i => L.sel.includes(i.id));
  const taken = [], left = L.items.filter(i => !chosen.includes(i)).map(i => i.nazev), notes = [];
  for(const it of chosen){
    if(addItem(it)){ taken.push(it.nazev + (it.pocet > 1 ? ' ×' + it.pocet : '')); notes.push({ c:'good', t:'+ ' + it.nazev }); }
    else { left.push(it.nazev + ' (batoh plný)'); notes.push({ c:'bad', t:'🎒 Plno – ' + it.nazev }); }
  }
  let gold = 0;
  if(L.zlato && mode !== 'none'){ gold = L.zlato; S.char.zlato += gold; notes.push({ c:'gold', t:'+' + gold + ' zl.' }); }
  const sum = { taken:taken.concat(gold ? [gold + ' zlaťáků'] : []), left:left.concat(L.zlato && !gold ? [L.zlato + ' zlaťáků'] : []) };
  const entry = S.log.find(e => e.t === 'loot' && e.id === L.id);
  if(entry) Object.assign(entry, sum);
  hist(`Hráč si z nálezu vzal: ${sum.taken.join(', ') || 'nic'}. Nechal ležet: ${sum.left.join(', ') || 'nic'}.`);
  S.loot = null;
  if(notes.length) addLog({ t:'fx', notes });
  render(); save();
}

/* ---------- Zkouška / útok hráče ---------- */
function setPending(z){
  S.pending = null;
  if(!z || typeof z !== 'object' || S.dead) return;
  let utok = ['zbran','kouzlo'].includes(z.utok) ? z.utok : null;
  if(utok === 'kouzlo' && !spell()) utok = 'zbran';
  let vl = z.vlastnost, foe = null, dc = clamp(int(z.obtiznost) || 12, 5, 25);
  if(utok){
    const w = usableWeapon();
    vl = utok === 'kouzlo' ? spell().vlastnost : (w ? w.vlastnost : fists().stat);
    foe = findFoe(z.cil) || S.foes[0] || null;
    if(foe) dc = foe.obrana;
  }
  if(!STAT_KEYS.includes(vl)) return;
  /* výhoda / nevýhoda: od AI, podle druhu, připravené schopnosti */
  const proti = ['jed','strach','kouzlo','spanek','nemoc','kletba'].includes(z.proti) ? z.proti : null;
  let adv = (z.vyhoda ? 1 : 0) - (z.nevyhoda ? 1 : 0);
  if(hasAdvAgainst(proti, vl)) adv++;
  if(pc().vystrasen) adv--;
  if(utok){
    if(pc().srazen) adv--;
    if(pc().skryty) adv++;
    if(foe){ const rg = utok === 'kouzlo' || isRanged(usableWeapon()); if(foe.st?.srazen) adv += rg ? -1 : 1; if(foe.vex) adv++; }
  }
  S.pending = { vlastnost:vl, obtiznost:dc, duvod:String(z.duvod || '').slice(0,100), utok, cilId:foe ? foe.id : null, proti, adv:clamp(adv, -1, 1) };
}

function rollParts(p){
  const parts = [{ n:statName(p.vlastnost), v:mod(S.char.stats[p.vlastnost]) }];
  const w = usableWeapon();
  if(p.utok) parts.push({ n:'Zdatnost', v:profBonus() });
  if(p.utok === 'zbran' && w && w.bonus) parts.push({ n:w.nazev, v:w.bonus });
  if(p.utok === 'zbran' && w && wearPenalty(w)) parts.push({ n:'opotřebení', v:-wearPenalty(w) });
  if(p.utok === 'zbran' && S.nextAttack?.hit) parts.push({ n:S.nextAttack.nazev, v:S.nextAttack.hit });
  if(S.nextRoll && S.nextRoll.v && (S.nextRoll.stat === p.vlastnost || S.nextRoll.stat === '*') && !(S.nextRoll.checkOnly && p.utok)) parts.push({ n:S.nextRoll.nazev, v:S.nextRoll.v });
  if(p.utok && S.nextAttack?.spell && p.utok === 'kouzlo' && S.nextAttack.hit) parts.push({ n:S.nextAttack.nazev, v:S.nextAttack.hit });
  if(p.utok && S.char.level >= 3 && perk('attackBonus')) parts.push({ n:obor().nazev, v:perk('attackBonus') });
  if(!p.utok){
    const ob = CLASSES[S.char.cls].odbornost?.[p.vlastnost];
    if(ob) parts.push({ n:'Odbornost', v:ob });
    const sb = S.char.level >= 3 ? perk('statBonus') : null;
    if(sb && (sb[p.vlastnost] || sb.vse)) parts.push({ n:obor().nazev, v:(sb[p.vlastnost] || 0) + (sb.vse || 0) });
    if(p.proti && S.char.cls === 'paladin' && S.char.level >= 6) parts.push({ n:'Aura ochrany', v:Math.max(1, mod(S.char.stats.charisma)) });
  }
  const g = gearBonus(p.vlastnost);
  if(g) parts.push(g);
  return parts.concat(condParts(p.vlastnost, !!p.utok));
}
function attackInfo(p){
  if(p.utok === 'kouzlo'){ const s = spell(); return { nazev:s.nazev, dice:s.zraneni, bonus:0 }; }
  const w = usableWeapon();
  return w ? { nazev:w.nazev, dice:w.zraneni, bonus:w.bonus - wearPenalty(w) } : { nazev:fists().dice === '1d2' ? 'pěsti' : 'holé ruce', dice:fists().dice, bonus:0 };
}
const partsText = parts => parts.map(x => `${fmtMod(x.v)} ${x.n}`).join(' ');


/* Hod kostkami zranění `mult`-krát (kritický zásah, Mocný úder), bonus se přičte jednou. */
function rollDiceMult(str, mult){
  const d = parseDice(str) || { n:1, s:4, p:0 };
  let t = 0;
  for(let i = 0; i < d.n * mult; i++) t += 1 + Math.floor(Math.random() * d.s);
  return Math.max(0, t + d.p);
}
let rolling = false;
async function roll(){
  if(S.dying) return deathSave();
  if(!S.pending || busy || rolling) return;
  rolling = true;
  const p = S.pending, btn = $('#rollBtn');
  btn.disabled = true;
  /* výhoda = dvě d20, platí lepší; nevýhoda = horší */
  let adv = p.adv || 0;
  if(S.nextRoll?.adv && (S.nextRoll.stat === '*' || S.nextRoll.stat === p.vlastnost)) adv = Math.min(1, adv + 1);
  if(p.utok && S.nextAttack?.adv && (p.utok === 'zbran' || S.nextAttack.spell)) adv = Math.min(1, adv + 1);
  const d1 = d20(), d2 = adv ? d20() : null;
  let d = adv > 0 ? Math.max(d1, d2) : adv < 0 ? Math.min(d1, d2) : d1, luck = '';
  if(d === 1 && species().lucky){ d = d20(); luck = ' (štěstí půlčíka: jednička přehozena)'; }
  await diceAnim(d);
  rolling = false; btn.disabled = false;
  if(!S.pending) return;
  const parts = rollParts(p), total = d + parts.reduce((a,x) => a + x.v, 0);
  const critMin = p.utok && S.char.level >= 3 && perk('crit19') ? 19 : 20;
  const krit = d >= critMin ? 'kritický úspěch' : d === 1 ? 'kritický neúspěch' : null;
  const advTxt = adv ? ` (${adv > 0 ? 'výhoda' : 'nevýhoda'} ${d1}/${d2})` : '';
  const ok = d >= critMin || (d !== 1 && total >= p.obtiznost);
  const foe = p.cilId ? S.foes.find(f => f.id === p.cilId) : null;
  const a = p.utok ? attackInfo(p) : null;
  const title = p.utok ? `Útok – ${a.nazev}${foe ? ' na ' + foe.jmeno : ''}` : `Zkouška: ${statName(p.vlastnost)}`;
  S.pending = null;
  if(S.nextRoll && (parts.some(x => x.n === S.nextRoll.nazev) || (S.nextRoll.adv && (S.nextRoll.stat === '*' || S.nextRoll.stat === p.vlastnost)))) S.nextRoll = null;
  const na = (p.utok === 'zbran' || (p.utok && S.nextAttack?.spell)) ? S.nextAttack : null;
  if(na) S.nextAttack = null;
  let popis = `${title}: d20=${d}${advTxt}${luck} ${partsText(parts)} = ${total} proti ${p.utok && foe ? 'obraně ' + foe.jmeno : 'obtížnosti'} ${p.obtiznost} → ${ok ? (p.utok ? 'ZÁSAH' : 'ÚSPĚCH') : (p.utok ? 'MINUL' : 'NEÚSPĚCH')}${krit ? ' (' + krit + ')' : ''}.`;
  let res = ok ? (p.utok ? 'Zásah!' : 'Úspěch') : (p.utok ? 'Minul' : 'Neúspěch');
  if(krit) res += ' – ' + krit;
  const rollEntry = { t:'roll', title:title + (adv ? (adv > 0 ? ' · výhoda' : ' · nevýhoda') : '') + (luck ? ' · štěstí' : ''), d, d2:adv ? (d === d1 ? d2 : d1) : null, parts, total, dc:p.obtiznost, dcl:p.utok && foe ? 'obrana' : 'obtížnost', ok, res };
  addLog(rollEntry);
  if(ok && p.utok){
    const crit = d >= critMin;
    const mult = 1 + (crit ? 1 : 0) + (na?.double ? 1 : 0);
    const sm = mod(S.char.stats[p.vlastnost]);
    const extra = na?.extra ? rollDice(na.extra).total : 0;
    /* efekty (běsnění, kletba, značka…), specializace a útok navíc od 5. úrovně */
    let fxd = 0; const fxn = [];
    for(const e of S.effects){
      if(e.extraDmg){ const v = rollDice(e.extraDmg, crit).total; fxd += v; fxn.push(`+${v} ${e.nazev}`); }
      if(e.dmgBonus && (p.utok === 'zbran')){ fxd += e.dmgBonus; fxn.push(`+${e.dmgBonus} ${e.nazev}`); }
    }
    if(S.char.level >= 3 && perk('extraHit')){ const v = rollDice(perk('extraHit'), crit).total; fxd += v; fxn.push(`+${v} ${obor().nazev}`); }
    const dmg = Math.max(1, rollDiceMult(a.dice, mult) + sm + a.bonus + extra) + fxd;
    rollEntry.res += ` · zranění ${dmg}`;
    popis += ` Zranění ${dmg} (${a.dice}${mult > 1 ? ' ×' + mult + ' kostky' : ''} ${fmtMod(sm)}${a.bonus ? ' ' + fmtMod(a.bonus) : ''}${extra ? ' +' + extra + ' ' + na.nazev : ''}${fxn.length ? ' ' + fxn.join(' ') : ''}).`;
    sfx('clash');
    popis += foe ? ' ' + hurtFoe(foe, dmg) : ' (cíl není ve hře sledovaný – vyprávěj účinek přiměřeně.)';
  }else if(p.utok) sfx('miss');
  if(p.utok){ delete pc().skryty; if(foe) delete foe.vex; }
  if(p.utok === 'zbran'){
    const mt = applyMastery(weaponMastery(usableWeapon()), ok, foe, a.dice, mod(S.char.stats[p.vlastnost]), d);
    if(mt) popis += ' ' + mt;
    if(CLASSES[S.char.cls].martial && S.char.level >= 5 && S.foes.length) popis += ' ' + extraAttack(foe);
  }
  if(p.hide){ if(ok){ pc().skryty = true; addLog({ t:'fx', notes:[{ c:'good', t:'🫥 Jsi skrytý' }] }); popis += ' Hráč je teď SKRYTÝ (příští útok s výhodou, útoky na něj s nevýhodou).'; } else popis += ' Nepřátelé ho dál vidí.'; }
  if(p.escape && ok){ delete pc().uchopen; addLog({ t:'fx', notes:[{ c:'good', t:'🔓 Vyprostil ses' }] }); popis += ' Hráč se vyprostil ze sevření.'; }
  if(p.utok === 'zbran') wear(usableWeapon(), d === 1 ? 8 : 1 + (Math.random() < 0.5 ? 1 : 0));
  hist(popis);
  callDM({ typ:'hod', popis });
}

const canAct = () => S && !busy && !S.pending && !S.loot && !S.dead && !S.queue && !S.dying;

function act(text, shown){

function equipItem(id){
  const it = S.inv.find(x => x.id === id);
  if(!it || busy || S.dead || !TYPES[it.typ].slot) return;
  const slot = TYPES[it.typ].slot, prev = equipped(slot);
  S.equip[slot] = it.id;
  hist(`Hráč si nasadil: ${it.nazev}${prev ? ` (místo ${prev.nazev})` : ''}.`);
  addLog({ t:'fx', notes:[{ c:'good', t:`${TYPES[it.typ].i} Nasazeno: ${it.nazev}` }] });
  render(); save();
}
function unequip(slot){
  const it = equipped(slot);
  if(!it || busy || S.dead) return;
  S.equip[slot] = null;
  hist(`Hráč si sundal: ${it.nazev}.`);
  render(); save();
}
function dropItem(id){
  const it = S.inv.find(x => x.id === id);
  if(!it || busy || S.dead) return;
  if(!confirm(`Zahodit ${it.nazev}${it.pocet > 1 ? ' (všech ' + it.pocet + ' ks)' : ''}?`)) return;
  takeOut(it, it.pocet);
  hist(`Hráč zahodil: ${it.nazev}${it.pocet > 1 ? ' ×' + it.pocet : ''}.`);
  addLog({ t:'fx', notes:[{ c:'bad', t:'− ' + it.nazev }] });
  render(); save();
}

async function useItem(id){
  const it = S.inv.find(x => x.id === id);
  if(!it || !canAct()) return;
  const c = S.char;
  if(it.typ === 'lektvar'){
    if(it.leceni && !it.efekt && c.hp >= c.maxHp && !confirm(`Máš plné životy (${c.hp}/${c.maxHp}). Opravdu vypít ${it.nazev}?`)) return;
    closeDrawer();
    if(it.leceni){
      const b = c.hp, r = rollDice(it.leceni);
      c.hp = Math.min(c.maxHp, c.hp + r.total);
      takeOut(it);
      addLog({ t:'fx', notes:[{ c:'good', t:`🧪 +${c.hp - b} HP` }] });
      return act(`Vypiju ${it.nazev}. [HRA: vyléčeno ${c.hp - b} HP (hod ${it.leceni} = ${r.total}), hráč má teď ${c.hp}/${c.maxHp} HP]`, `🧪 Vypiju ${it.nazev}`);
    }
    takeOut(it);
    return act(`Vypiju ${it.nazev}. [HRA: lektvar spotřebován, účinek: ${it.efekt}. Vyprávěj ho.]`, `🧪 Vypiju ${it.nazev}`);
  }
  if(it.typ === 'svitek'){
    if(it.zraneni && S.foes.length){
      const foe = S.foes.length === 1 ? S.foes[0]
        : await pick(`Na koho použít ${it.nazev}?`, S.foes.map(f => ({ label:`${f.jmeno} (${f.hp}/${f.maxHp} HP)`, value:f })));
      if(!foe || !canAct() || !S.inv.includes(it)) return;
      closeDrawer();
      const dmg = Math.max(1, rollDice(it.zraneni).total);
      takeOut(it);
      const txt = hurtFoe(foe, dmg);
      return act(`Použiju ${it.nazev} na ${foe.jmeno}. [HRA: svitek zasáhl za ${dmg} zranění. ${txt}]`, `📜 ${it.nazev} → ${foe.jmeno}`);
    }
    closeDrawer();
    takeOut(it);
    return act(`Přečtu ${it.nazev}. [HRA: svitek spotřebován${it.zraneni ? ', ale není tu žádný nepřítel – útočné kouzlo vyšumí naprázdno' : ', účinek: ' + it.efekt}.]`, `📜 Přečtu ${it.nazev}`);
  }
  if(it.typ === 'jidlo'){
    if(S.needs.hlad < 15 && !confirm(`Nemáš hlad. Opravdu teď jíst ${it.nazev}?`)) return;
    closeDrawer();
    const b = S.needs.hlad;
    S.needs.hlad = Math.max(0, b - 50);
    takeOut(it);
    addLog({ t:'fx', notes:[{ c:'good', t:`🍖 Hlad ${Math.round(b)} → ${Math.round(S.needs.hlad)}` }] });
    return act(`Najím se (${it.nazev}). [HRA: hlad klesl z ${Math.round(b)} na ${Math.round(S.needs.hlad)}/100. Jídlo trvá chvíli – "cas_hodiny": 0.5]`, `🍖 Najím se`);
  }
  /* Ostatní: připraví text, hráč ho doplní. */
  closeDrawer();
  $('#input').value = `Použiju ${it.nazev} `; autosize(); $('#input').focus();
}

/* ---------- Výběr z možností (cíl apod.) ---------- */
let pickResolve = null;
let detailId = null;
function openSheet(html, rc){
  const sh = $('#sheet');
  sh.className = 'sheet ' + (rc || '');
  sh.innerHTML = '<div class="grip"></div>' + html;
  sh.scrollTop = 0;
  requestAnimationFrame(() => { sh.classList.add('on'); $('#sheetShade').classList.add('on'); });
}
function closeSheet(){
  $('#sheet').classList.remove('on'); $('#sheetShade').classList.remove('on');
  detailId = null;
  if(pickResolve){ const r = pickResolve; pickResolve = null; r(null); }
}
function pick(title, options){
  closeSheet();
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3>${options.map((o,i) => `<button class="opt" data-pick="${i}">${esc(o.label)}</button>`).join('')}<button class="cancel" data-pick="-1">Zrušit</button>`);
    $('#sheet')._opts = options;
    pickResolve = res;
  });
}
$('#sheet').onclick = e => {
  const p = e.target.closest('[data-pick]');
  if(p){ const i = int(p.dataset.pick), v = i >= 0 ? $('#sheet')._opts[i].value : null, r = pickResolve; pickResolve = null; closeSheet(); if(r) r(v); return; }
  const ab = e.target.closest('[data-abil]');
  if(ab && !ab.disabled) return useAbility(ab.dataset.abil);
  const ob = e.target.closest('[data-obor]');
  if(ob) return chooseSubclass(ob.dataset.obor);
  const b = e.target.closest('[data-act]');
  if(b && !b.disabled) journalAction(b);
};
$('#sheetShade').onclick = closeSheet;
$('#diceOv').onclick = () => diceSkip && diceSkip();
$('#mic').onclick = toggleMic;
$('#recapBtn').onclick = recapOpen;
$('#sndBtn').onclick = () => {
  const on = !(sfxOn() || ambOn());
  ls.set('dz_sfx', on ? '' : 'off'); ls.set('dz_amb', on ? '' : 'off');
  if(on){ audio(); SND.ctx?.resume?.(); }
  SND.kind = undefined; render();
};

/* ---------- Detail předmětu ---------- */
const avgDice = s => { const d = parseDice(s); return d ? d.n * (d.s + 1) / 2 + d.p : 0; };
const fmtNum = n => (Math.round(n * 10) / 10).toString().replace('.', ',');
function diffHTML(a, b, f = fmtNum){
  const d = Math.round((b - a) * 10) / 10;
  return `${f(a)} → <b class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${f(b)}</b>`;
}
/* Bojové hodnoty, které by měla daná zbraň v rukou této postavy. */
function weaponCalc(w){
  const c = S.char;
  const pb = profBonus();
  if(!w || wearPenalty(w) >= 99){ const f = fists(); return { hit:mod(c.stats[f.stat]) + pb + (gearBonus(f.stat)?.v || 0), dmg:Math.max(1, avgDice(f.dice) + mod(c.stats[f.stat])), dice:f.dice, m:mod(c.stats[f.stat]) }; }
  const m = mod(c.stats[w.vlastnost]), b = w.bonus - wearPenalty(w);
  return { hit:m + b + pb + (gearBonus(w.vlastnost)?.v || 0), dmg:Math.max(1, avgDice(w.zraneni) + m + b), dice:w.zraneni, m:m + b };
}
function itemDetail(it){
  const c = S.char, rows = [], slot = TYPES[it.typ].slot, eq = isEquipped(it);
  rows.push(['Typ', TYPES[it.typ].n], ['Vzácnost', RAR[it.vzacnost].n]);
  let cmp = '';
  if(it.typ === 'zbran'){
    const me = weaponCalc(it), cur = equipped('zbran');
    rows.push(['Útok', `d20 ${fmtMod(me.hit)}`], ['Zranění', `${it.zraneni} ${fmtMod(me.m)}`], ['Průměrné zranění', fmtNum(me.dmg)],
      ['Používá', statName(it.vlastnost) + ` (${fmtMod(mod(c.stats[it.vlastnost]))})`]);
    if(it.bonus) rows.push(['Magický bonus', `+${it.bonus} k útoku i zranění`]);
    const ms = weaponMastery(it);
    if(ms) rows.push(['Mistrovství', `${MASTERY[ms].n}${masteryOn() ? '' : ' (tvé povolání ho nevyužije)'} – ${MASTERY[ms].d}`]);
    if(isRanged(it)) rows.push(['Dosah', 'na dálku']);
    if(!eq){ const o = weaponCalc(cur);
      cmp = `<div class="cmp"><b>Oproti ${cur ? esc(cur.nazev) : 'holým pěstem'}</b>Útok ${diffHTML(o.hit, me.hit, fmtMod)} · Prům. zranění ${diffHTML(o.dmg, me.dmg)}</div>`; }
  }else if(it.typ === 'zbroj' || it.typ === 'stit'){
    const val = it.obrana + it.bonus, cur = equipped(slot), now = armorClass();
    rows.push(['Obrana', `+${val}${it.bonus ? ` (${it.obrana} + ${it.bonus} magie)` : ''}`]);
    if(!eq){ const after = now - (cur ? cur.obrana + cur.bonus : 0) + val;
      cmp = `<div class="cmp"><b>Tvoje obrana ${cur ? 'místo ' + esc(cur.nazev) : 'po nasazení'}</b>🛡️ ${diffHTML(now, after)}</div>`; }
  }else if(it.typ === 'doplnek'){
    rows.push(['Účinek', `+${it.bonus} ke všem hodům na ${statName(it.vlastnost).toLowerCase()}`]);
    const cur = equipped('doplnek');
    if(!eq && cur) cmp = `<div class="cmp"><b>Nahradí ${esc(cur.nazev)}</b>+${cur.bonus} ${esc(statName(cur.vlastnost))} → <b>+${it.bonus} ${esc(statName(it.vlastnost))}</b></div>`;
  }else if(it.typ === 'lektvar'){
    if(it.leceni) rows.push(['Léčení', `${it.leceni} HP (prům. ${fmtNum(avgDice(it.leceni))})`], ['Tvoje životy', `${c.hp}/${c.maxHp}`]);
    if(it.efekt) rows.push(['Účinek', it.efekt]);
    rows.push(['Počet', `${it.pocet} ks`]);
  }else if(it.typ === 'svitek'){
    if(it.zraneni) rows.push(['Zranění', `${it.zraneni} (prům. ${fmtNum(avgDice(it.zraneni))})`], ['Zásah', 'vždy, na zvolený cíl']);
    if(it.efekt) rows.push(['Účinek', it.efekt]);
    rows.push(['Počet', `${it.pocet} ks`, ]);
  }else if(it.pocet > 1) rows.push(['Počet', `${it.pocet} ks`]);
  if(['zbran','zbroj','stit'].includes(it.typ) && wearOn()) rows.push(['Stav výbavy', wearOf(it) <= 0 ? '💔 rozbité – oprav u kováře' : wearOf(it) <= 25 ? `⚠️ ${wearOf(it)} % (postih −1)` : `${wearOf(it)} %`]);
  rows.push(['Váha', `${fmtNum(itemWeight(it))} kg`]);
  if(it.teple) rows.push(['Teplé', '🧥 chrání před zimou a deštěm']);
  if(eq) rows.push(['Nasazeno', '✅ ano']);

  const free = !busy && !S.dead, usable = canAct(), btn = [];
  if(slot) btn.push(eq ? `<button data-act="unequip" data-slot="${slot}" ${free?'':'disabled'}>Sundat</button>`
                       : `<button class="main" data-act="equip" data-id="${it.id}" ${free?'':'disabled'}>Nasadit</button>`);
  if(['lektvar','svitek','ostatni','jidlo'].includes(it.typ))
    btn.push(`<button class="main" data-act="use" data-id="${it.id}" ${usable?'':'disabled'}>${it.typ === 'lektvar' ? 'Vypít' : it.typ === 'svitek' ? 'Přečíst' : it.typ === 'jidlo' ? 'Sníst' : 'Použít'}</button>`);
  btn.push(`<button class="danger" data-act="drop" data-id="${it.id}" ${free?'':'disabled'}>🗑️</button>`);
  const why = !usable && ['lektvar','svitek','ostatni','jidlo'].includes(it.typ) && !S.dead
    ? `<div class="dnote">${busy ? 'Pán jeskyně právě vypráví…' : S.pending ? 'Nejdřív hoď kostkou.' : S.loot ? 'Nejdřív vyřeš nález.' : ''}</div>` : '';

  return `<div class="dhead"><div class="ico">${TYPES[it.typ].i}</div><div><h2>${esc(it.nazev)}${it.pocet > 1 ? ' ×' + it.pocet : ''}</h2><small>${RAR[it.vzacnost].n} ${TYPES[it.typ].n.toLowerCase()}</small></div></div>
    ${it.popis ? `<div class="ddesc">${esc(it.popis)}</div>` : ''}
    <div class="dstats">${rows.map(([k,v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${cmp}<div class="dbtns">${btn.join('')}</div>${why}`;
}
function showItem(id){
  const it = S.inv.find(x => x.id === id);
  if(!it){ closeSheet(); return; }
  detailId = id;
  openSheet(itemDetail(it), RAR[it.vzacnost].c);
}

function addLog(e){ S.log.push(e); if(S.log.length > LOG_MAX) S.log.splice(0, S.log.length - LOG_MAX); }

function lootHTML(e){
  const L = S.loot && S.loot.id === e.id ? S.loot : null;
  if(!L){
    return `<div class="e loot done"><h3>📦 Nález</h3><div class="sum">✅ Vzal sis: ${esc((e.taken || []).join(', ') || 'nic')}${(e.left || []).length ? `<br>Nechal jsi: ${esc(e.left.join(', '))}` : ''}</div></div>`;
  }
  return `<div class="e loot"><h3>📦 Nález – vyber, co si vezmeš</h3>
    ${L.items.map(it => `<button class="lrow ${L.sel.includes(it.id) ? 'on' : ''}" data-ltog="${it.id}"><span class="chk">${L.sel.includes(it.id) ? '✓' : ''}</span><span>${itemHTML(it)}</span></button>`).join('')}
    ${L.zlato ? `<div class="lrow on" style="opacity:1"><span class="chk">💰</span><span class="iname" style="color:var(--gold)">${L.zlato} zlaťáků</span></div>` : ''}
    <div class="lbtns"><button data-ltake="none">Nechat</button><button data-ltake="all">Vše</button><button class="main" data-ltake="sel">Vzít vybrané</button></div></div>`;
}

function logHTML(e, i){
  switch(e.t){
    case 'dm': return `<div class="e dm${e.anim ? ' tw' : ''}" data-li="${i}">${rich(e.text)}
      ${e.img ? `<img class="illu" data-src="${esc(e.img)}" alt="Ilustrace scény">` : ''}
      <div class="dmtools">${e.imgBusy ? '<span class="busyimg">🖌️ Kreslím ilustraci…</span>' : imgMode() !== 'off' && !e.img ? `<button data-illu="${i}">🖼️ Ilustrace</button>` : ''}${window.speechSynthesis ? `<button data-say="${i}">🔊 Přečíst</button>` : ''}</div></div>`;
    case 'lvl': return `<div class="e lvl"><b>${esc(e.title || '⭐ ' + e.level + '. úroveň!')}</b><small>${e.gain ? '+' + e.gain + ' max. HP' : ''}${e.nove.length ? (e.gain ? ' · nové: ' : '') + esc(e.nove.join(', ')) : ''}${e.title ? '' : ' · zvyš si vlastnost'}</small></div>`;
    case 'player': return `<div class="e player"><span>${esc(e.text)}</span></div>`;
    case 'fx': return `<div class="e fx">${e.notes.map(n => `<span class="tag ${n.c}">${esc(n.t)}</span>`).join('')}</div>`;
    case 'roll': return `<div class="e roll ${e.ok ? 'good' : 'bad'} ${e.enemy ? 'enemy' : ''}"><div class="die">${e.d}</div><div><b>${esc(e.res)}</b><small>${esc(e.title)}</small><small>d20 ${e.d}${e.d2 ? ` <s>${e.d2}</s>` : ''} ${esc(partsText(e.parts))} = <b>${e.total}</b> vs. ${esc(e.dcl)} ${e.dc}</small></div></div>`;
    case 'loot': return lootHTML(e);
    case 'sys': return `<div class="e sys">${esc(e.text)}</div>`;
    case 'ini': return `<div class="e ini"><b>⚔️ Boj! Iniciativa${e.prekvapeni === 'hrac' ? ' (byl jsi zaskočen)' : e.prekvapeni === 'nepratele' ? ' (zaskočil jsi je)' : ''}</b><span>${e.order.map((o,i) => `${i + 1}. ${esc(o.n)} <i>${o.v}</i>`).join(' · ')}</span></div>`;
    case 'err': return `<div class="e err">${esc(e.text)}${i === S.log.length-1 && S.lastFailed ? '<button id="retry">Zkusit znovu</button>' : ''}</div>`;
  }
  return '';
}

function render(){
  if(!S) return;
  const c = S.char;
  $('#hName').innerHTML = `${CLASSES[c.cls].ikona} ${esc(c.name)} <span class="lvlb" title="úroveň">${c.level}</span>`;
  $('#hGold').textContent = '💰 ' + c.zlato;
  $('#mHp').textContent = `${c.hp}/${c.maxHp}${c.temp ? ' +' + c.temp : ''}`;
  $('#hpFill').style.width = (100 * c.hp / c.maxHp) + '%';
  const needCol = v => v >= 90 ? 'var(--red)' : v >= 60 ? 'var(--orange)' : v >= 40 ? 'var(--gold)' : 'var(--green)';
  const un = Math.round(S.needs.unava), hu = Math.round(S.needs.hlad);
  $('#mFat').textContent = un; $('#fatFill').style.width = un + '%'; $('#fatFill').style.background = needCol(un);
  $('#mHun').textContent = hu; $('#hunFill').style.width = hu + '%'; $('#hunFill').style.background = needCol(hu);
  $('#mAc').textContent = armorClass();
  const dp = dayPart(S.time.hour);
  $('#hMeta').textContent = `${dp[1]} Den ${S.time.day} · ${clockStr()} · ${season()[2]} ${wxIcon()} ${wx().n}` + (S.travel ? ` · 🧭 na cestě do ${S.travel.cil}` : S.location ? ` · 📍 ${S.location}` : '');
  $('#sndBtn').textContent = sfxOn() || ambOn() ? '🔊' : '🔇';
  $('#mic').hidden = !SR;
  $('#conds').innerHTML = allConds().map((x,i) =>
    `<button class="cond ${x.derived ? 'need' : x.typ === 'pozehnani' ? 'good' : ''}" data-cond="${i}">${x.i} ${esc(x.nazev)}</button>`).join('');

  $('#foes').classList.toggle('on', S.foes.length > 0);
  $('#foes').innerHTML = iniBar() + S.foes.map(f => `<div class="foe${f.st.neschopen ? ' down' : ''}"><b title="${esc(f.jmeno)}">👹 ${esc(f.jmeno)}</b><div class="hpbar"><div style="width:${100*f.hp/f.maxHp}%"></div></div><small><span class="hp">${f.hp}/${f.maxHp}</span> · 🛡️${f.obrana}</small>${Object.keys(f.st).length || f.vex ? `<small class="fst">${Object.keys(f.st).map(k => FOE_ST[k]).concat(f.vex ? [FOE_ST.vex] : []).join(' ')}</small>` : ''}</div>`).join('');

  const log = $('#log');
  log.innerHTML = S.log.map(logHTML).join('');
  twApply(); hydrateImages();
  /* Po novém vyprávění skoč na jeho začátek, ať se čte odshora. Jinak dolů. */
  const toNew = scrollNew; scrollNew = false;
  requestAnimationFrame(() => {
    const dms = log.querySelectorAll('.e.dm'), last = dms[dms.length - 1];
    if(toNew && last && last.offsetHeight > log.clientHeight * 0.6) log.scrollTop = last.offsetTop - log.offsetTop - 10;
    else log.scrollTop = log.scrollHeight;
  });

  $('#typing').classList.toggle('on', busy);
  const mode = busy ? 'act' : S.dead ? 'act' : S.dying ? 'roll' : S.loot ? 'loot' : S.pending ? 'roll' : 'act';
  $('#rollPanel').classList.toggle('on', mode === 'roll');
  $('#lootPanel').classList.toggle('on', mode === 'loot');
  $('#actPanel').style.display = mode === 'act' ? 'block' : 'none';
  $('#rollBtn').textContent = S.dying ? '🎲 Hoď o život' : '🎲 Hoď d20';
  if(S.dying) $('#rollWhy').innerHTML = `💀 <b>Na pokraji smrti</b> · 10+ = úspěch · 3 úspěchy = přežiješ, 3 selhání = smrt<br><b style="color:var(--green)">${'✔ '.repeat(S.dying.ok) || '–'}</b> &nbsp; <b style="color:var(--blood)">${'✘ '.repeat(Math.min(3, S.dying.ko)) || '–'}</b>`;
  else if(S.pending){
    const p = S.pending, parts = rollParts(p), foe = p.cilId ? S.foes.find(f => f.id === p.cilId) : null;
    $('#rollWhy').innerHTML = p.utok
      ? `⚔️ <b>${esc(attackInfo(p).nazev)}</b>${foe ? ' → <b>' + esc(foe.jmeno) + '</b>' : ''} · d20 ${esc(partsText(parts))} · obrana <b>${p.obtiznost}</b><br>zranění ${esc(attackInfo(p).dice)} ${fmtMod(mod(c.stats[p.vlastnost]) + attackInfo(p).bonus)}`
      : `Zkouška: <b>${esc(statName(p.vlastnost))}</b> (d20 ${esc(partsText(parts))}) · obtížnost <b>${p.obtiznost}</b>${p.duvod ? '<br>' + esc(p.duvod) : ''}`;
  }

  const locked = !canAct();
  $('#chips').innerHTML = S.dead
    ? `<button class="chip" id="newChip">⚔️ Nový hrdina</button>`
    : quickActions().map(([k,l,c2]) => `<button class="chip ${c2 ? '' : 'quick'}" data-quick="${k}" ${locked && k !== 'c:stand' ? 'disabled' : ''}>${l}</button>`).join('')
      + S.suggestions.map(s => `<button class="chip" ${locked?'disabled':''}>${esc(s)}</button>`).join('');
  $('#input').disabled = locked; $('#send').disabled = locked;
  $('#input').placeholder = S.dead ? 'Příběh skončil.' : 'Co uděláš?';
  renderDrawer();
  updateAtmo(); updateAmbient();
  if(S.statPicks && canAct() && !$('#sheet').classList.contains('on') && !S._lvlAsked){ S._lvlAsked = true; setTimeout(levelUpPick, 900); }
}

/* Rychlé akce podle situace – nabízí se jen, když dávají smysl. */
const healPotion = () => S.inv.find(i => i.typ === 'lektvar' && i.leceni);
const food = () => S.inv.find(i => i.typ === 'jidlo');
function quickActions(){
  const q = [], c = S.char;
  if(inCombat() && !S.dying){
    const qa = combatActions().map(([k,l]) => ['c:' + k, l]);
    if(!pc().neschopen){
      if(knownAbilities().length) qa.push(['abil', `✨ Schopnosti${slotMax() ? ' ' + S.slots + '/' + slotMax() : ''}`]);
      if(c.hp < c.maxHp && healPotion()) qa.push(['heal', `🧪 Lektvar (${healPotion().pocet})`]);
      qa.push(...combatActions2().map(([k,l]) => ['c:' + k, l, 'sec']));
    }
    return qa;
  }
  if(S.statPicks) q.push(['lvl', '⭐ Zvýšit vlastnost']);
  else if(S.char.level >= 3 && !S.char.obor && OBORY[S.char.cls]) q.push(['obor', '🎓 Zvolit specializaci']);
  if(knownAbilities().length) q.push(['abil', `✨ Schopnosti${slotMax() ? ' ' + S.slots + '/' + slotMax() : ''}`]);
  if(c.hp < c.maxHp && healPotion()) q.push(['heal', `🧪 Lektvar (${healPotion().pocet})`]);
  if(S.needs.hlad >= 40 && food() && !S.foes.length) q.push(['eat', `🍖 Najíst se (${food().pocet})`]);
  if((S.needs.unava >= 50 || isNight()) && !S.foes.length) q.push(['sleep', '🏕️ Vyspat se']);
  return q;
}
function condDetail(x){

function tabQuests(){
  const open = S.quests.filter(q => !q.done), done = S.quests.filter(q => q.done);
  const row = q => `<div class="qrow ${q.done?'done':''}"><b>${q.done ? '✅' : '📜'} ${esc(q.title)}</b>${q.popis ? `<small>${esc(q.popis)}</small>` : ''}</div>`;
  if(!S.quests.length) return storyHTML() + '<div class="empty">Zatím žádné úkoly.</div>';
  return storyHTML() + `<div class="sec"><span>Aktivní</span><span>${open.length}</span></div>${open.length ? open.map(row).join('') : '<div class="empty">Nic rozpracovaného.</div>'}
    ${done.length ? `<div class="sec"><span>Splněné</span><span>${done.length}</span></div>${done.map(row).join('')}` : ''}`;
}

function tabNpcs(){
  const npcs = Object.entries(S.npcs);
  if(!npcs.length) return '<div class="empty">Nikoho jsi zatím nepotkal.</div>';
  return npcs.sort((a,b) => (b[1].skore ?? 0) - (a[1].skore ?? 0)).map(([k,n]) => { const sk = n.skore ?? 0;
    return `<div class="qrow"><b>👤 ${esc(k)} <span class="tag npc" style="color:${relColor(sk)}">${esc(relLabel(sk))}</span></b><small>${esc(n.popis)}</small>
      <div class="bar relbar"><div style="width:${(sk + 100) / 2}%;background:${relColor(sk)}"></div></div></div>`; }).join('');
}

function journalAction(b){

  if(a === 'close') closeDrawer();
  else if(a === 'closesheet') closeSheet();
  else if(a === 'lvlpick') levelUpPick();
  else if(a === 'subclass') subclassPick();
  else if(a === 'heroinfo') heroInfo();
  else if(a === 'model') chooseModel();
  else if(a === 'recap') recapOpen();
  else if(a === 'recapnew'){ if(S.recap) S.recap.err = null; makeRecap(); }
  else if(a === 'equip'){ equipItem(id); closeSheet(); }
  else if(a === 'unequip'){ unequip(b.dataset.slot); closeSheet(); }
  else if(a === 'use'){ closeSheet(); useItem(id); }
  else if(a === 'drop'){ closeSheet(); dropItem(id); }
  else if(a === 'new') newGame();
  else if(a === 'goto'){ const p = S.places?.[b.dataset.place]; closeSheet(); closeDrawer(); if(p) act(`Vyrazím na cestu do ${p.nazev}.`, `🧭 Vyrazím do ${p.nazev}`); }
  else if(a === 'settings') settingsSheet();
  else if(a === 'cloud') cloudSheet();
  else if(a === 'book') printBook();
  else if(a === 'toggle'){ const k = b.dataset.k, def = b.dataset.def === '1'; ls.set(k, togOn(k, def) ? (def ? 'off' : '') : (def ? '' : 'on')); if(k === 'dz_tts' && !ttsOn()) stopSpeak(); if(k === 'dz_tw' && !twOn()) twFinish(); SND.kind = undefined; settingsSheet(); render(); }
  else if(a === 'theme'){ ls.set('dz_theme', b.dataset.k === 'parch' ? 'parch' : ''); applyTheme(); settingsSheet(); render(); }
  else if(a === 'imgmode'){ ls.set('dz_img', b.dataset.k === 'off' ? '' : b.dataset.k); settingsSheet(); render(); }
  else if(a === 'newcode'){ $('#cfgCode').value = randomCode(); }
  else if(a === 'cloudsave'){
    const cfg = parseFirebaseConfig($('#cfgTxt').value), code = $('#cfgCode').value.trim();
    if(!cfg) return alert('Z konfigurace se nepodařilo vyčíst apiKey a projectId. Vlož celý blok firebaseConfig.');
    if(code.length < 18) return alert('Kód hráče musí mít aspoň 18 znaků.');
    ls.set('dz_cloud', JSON.stringify({ ...cfg, code, on:true }));

  }
  else if(a === 'cloudoff'){ const c = cloudCfg(); if(c){ c.on = false; ls.set('dz_cloud', JSON.stringify(c)); } cloudSheet(); }
  else if(a === 'cloudup') cloudUpload(true);
  else if(a === 'clouddown') cloudDownload();
  else if(a === 'switchAI'){
    pick('Kdo bude Pánem jeskyně?', Object.entries(PROVIDERS).map(([k,p]) => ({ label:(k === getProvider() ? '✅ ' : '') + p.ikona + ' ' + p.nazev + ' · ' + p.popis + (ls.get('kroniky_key_' + k) ? '' : ' (bez klíče)'), value:k }))).then(v => {
      if(!v) return;

    });

    const k = prompt(PROVIDERS[getProvider()].nazev + ' API klíč (prázdné = demo režim):', getKey());

      setKey(k.trim()); ls.set('dz_gem_auth', ''); if(getProvider() === 'grok') ls.set('kroniky_grok_model', ''); renderDrawer();

/* =========================================================
   ÚROVNĚ, ZKUŠENOSTI A SCHOPNOSTI
   ========================================================= */
const XP_LEVELS = [0, 0, 300, 900, 2700, 6500, 14000, 23000, 34000, 48000, 64000];   /* index = úroveň */
const MAX_LEVEL = 10;
const profBonus = () => Math.floor(((S.char.level || 1) - 1) / 4) + 2;   /* zdatnost podle D&D 2024: +2 (1.–4. úr.), +3 (5.–8.), +4 (9.–10.) */
const nextXP = () => S.char.level >= MAX_LEVEL ? null : XP_LEVELS[S.char.level + 1];
const foeXP = f => Math.max(10, Math.round(f.maxHp * 3 + Math.max(0, f.obrana - 10) * 8 + f.utok * 8));

function grantXP(amount, why){
  amount = Math.round(clamp(Number(amount) || 0, 0, 2000));
  if(!amount || S.dead) return;
  const c = S.char;
  c.xp = (c.xp || 0) + amount;
  addLog({ t:'fx', notes:[{ c:'gold', t:`⭐ +${amount} XP${why ? ' · ' + why : ''}` }] });
  sfx('coin');
  while(c.level < MAX_LEVEL && c.xp >= XP_LEVELS[c.level + 1]){
    c.level++; S._lvlAsked = false;
    const gain = Math.max(1, Math.floor(hitDie() / 2) + 1 + mod(c.stats.odolnost) + hpPerLevelBonus());
    c.maxHp += gain; c.hp = Math.min(c.maxHp, c.hp + gain);
    S.statPicks = (S.statPicks || 0) + 1;
    S.slots = Math.min(slotMax(), (S.slots || 0) + 1);
    const nove = classAbilities().filter(a => a.lvl === c.level);
    for(const a of nove) if(!a.slot) S.res[a.id] = abilityMax(a);
    const extra = [];
    if(c.level === 5 && CLASSES[c.cls].martial) extra.push('⚔️ Útok navíc');
    if(c.level === 3 && !c.obor) extra.push('🎓 volba specializace');
    addLog({ t:'lvl', level:c.level, gain, nove:nove.map(a => a.i + ' ' + a.nazev).concat(extra) });
    hist(`HRÁČ POSTOUPIL NA ${c.level}. ÚROVEŇ: +${gain} max. HP${nove.length ? ', nové schopnosti: ' + nove.map(a => a.nazev).join(', ') : ''}${extra.length ? ', ' + extra.join(', ') : ''}. Vyprávěj to stručně jako okamžik, kdy hrdina cítí, že zesílil.`);
    book('sys', `⭐ ${c.name} dosáhl ${c.level}. úrovně.`);
    sfx('level');
  }
}

/* Volba specializace (podtřídy) na 3. úrovni. */
function subclassPick(){
  const c = S.char, list = OBORY[c.cls] || [];
  if(!list.length || c.obor || c.level < 3) return;
  openSheet(`<h3>🎓 ${esc(CLASSES[c.cls].nazev)} 3. úrovně – zvol specializaci</h3>
    <div class="dnote" style="text-align:left;margin:-4px 0 10px">Volba je trvalá. Specializace určí tvůj styl na celou hru.</div>
    ${list.map(o => `<button class="abil" data-obor="${o.id}"><span class="ico">🎓</span><span class="mid"><b>${esc(o.nazev)}</b><small>${esc(o.popis)}</small></span></button>`).join('')}
    <button class="cancel" data-act="closesheet">Rozhodnu se později</button>`);
}
function chooseSubclass(id){
  const c = S.char, o = (OBORY[c.cls] || []).find(x => x.id === id);
  if(!o || c.obor) return;
  c.obor = id;
  if(o.perk?.hpPerLevel){ const add = o.perk.hpPerLevel * c.level; c.maxHp += add; c.hp += add; }
  if(o.abil && !o.abil.slot) S.res[o.abil.id] = abilityMax(o.abil);
  if(o.perk?.slotBonus) S.slots = Math.min(slotMax(), (S.slots || 0) + o.perk.slotBonus);
  addLog({ t:'lvl', level:c.level, gain:0, title:`🎓 ${o.nazev}`, nove:[o.popis] });
  hist(`Hráč si zvolil specializaci: ${o.nazev} (${o.popis}). Ať se to promítne do jeho příběhu.`);
  book('sys', `🎓 ${c.name} se stal: ${o.nazev}.`);
  sfx('level'); closeSheet(); render(); save();
}

async function levelUpPick(){
  if(!S || !S.statPicks || busy) return;
  const c = S.char;
  const opts = STATS.filter(([k]) => c.stats[k] < 20).map(([k,n]) => ({ label:`${n}: ${c.stats[k]} → ${c.stats[k] + 1}${mod(c.stats[k] + 1) > mod(c.stats[k]) ? '  (bonus ' + fmtMod(mod(c.stats[k] + 1)) + ')' : ''}`, value:k }));
  if(!opts.length){ S.statPicks = 0; return; }
  const k = await pick(`⭐ ${c.level}. úroveň! Zvyš jednu vlastnost o +1`, opts);
  if(!k || !S.statPicks) return;
  const oldCon = mod(c.stats.odolnost);
  c.stats[k]++; S.statPicks--;
  if(k === 'odolnost' && mod(c.stats.odolnost) > oldCon){ c.maxHp += c.level; c.hp += c.level; }
  addLog({ t:'fx', notes:[{ c:'good', t:`⬆️ ${statName(k)} ${c.stats[k]}` }] });
  hist(`Hráč si zvýšil vlastnost ${statName(k)} na ${c.stats[k]}.`);
  render(); save();
  if(S.statPicks) setTimeout(levelUpPick, 300);
  else if(c.level >= 3 && !c.obor) setTimeout(subclassPick, 400);
}

/* Hodnota schopnosti: kostka může záviset na úrovni. */
const aDice = a => typeof a.diceV === 'function' ? a.diceV() : a.dice;
const castMod = a => a.spellStat && perk('spellDmg') && S.char.level >= 3 ? Math.max(0, mod(S.char.stats[a.spellStat])) : 0;
function addTemp(n, why){
  const c = S.char;
  n = Math.max(0, Math.round(n));
  if(n > (c.temp || 0)){ c.temp = n; addLog({ t:'fx', notes:[{ c:'good', t:`🛡️ Dočasné životy ${n}${why ? ' · ' + why : ''}` }] }); }
}
function wildSurgeCheck(a){
  if(!perk('wildSurge') || !a.slot || Math.random() >= 0.15) return '';
  return ' DIVOKÁ MAGIE: kouzlo vyvolalo nečekaný vedlejší účinek – vymysli zábavný, neškodný nebo dvojsečný efekt.';
}

async function useAbility(id){
  const a = classAbilities().find(x => x.id === id);
  if(!a || !canAct() || a.lvl > S.char.level) return;
  if(abilityLeft(a) <= 0){ alert('Tuhle schopnost už jsi vyčerpal. Obnoví ji spánek (aspoň 6 h).'); return; }
  if(a.reaction){ alert('Tohle je reakce – hra ji v boji použije sama, když tě zasáhne útok (1× za kolo).'); return; }
  if(inCombat()){
    if(a.bonus && S.tah?.bonus){ alert('Bonusovou akci už jsi v tomto tahu použil.'); return; }
    if(a.slot && S.tah?.slot){ alert('Za jeden tah můžeš seslat jen jedno kouzlo se slotem.'); return; }
  }
  const c = S.char, spend = () => { if(a.slot) S.slots--; else S.res[a.id] = abilityLeft(a) - 1; if(inCombat()){ S.tah ||= {}; if(a.bonus) S.tah.bonus = true; if(a.slot) S.tah.slot = true; } };
  /* bonusová akce nespotřebuje tah – nepřátelé nejednají, AI se dozví v příštím tahu */
  const finish = (t, shown) => {
    if(!a.bonus) return act(t, shown);
    twFinish(); addLog({ t:'player', text:shown + ' · bonusová akce' }); book('hrac', shown);
    hist('Hráč (bonusová akce): ' + t.replace(/\[HRA: /, '(').replace(/\]$/, ')'));
    render(); save();
  };
  closeSheet();

  if(a.kind === 'heal'){
    let r = typeof a.flat === 'function' ? a.flat() : rollDice(aDice(a)).total;
    r += (a.addStat ? Math.max(0, mod(c.stats[a.addStat])) : 0) + (a.addLevel ? c.level : 0) + (perk('healBonus') && c.level >= 3 ? 2 + c.level : 0);
    const b = c.hp; c.hp = Math.min(c.maxHp, c.hp + r); spend();
    let cured = '';
    if(a.cureToo){ const e = S.effects.find(x => ['jed','nemoc'].includes(x.typ)); if(e){ S.effects = S.effects.filter(x => x !== e); cured = ` a zbavil se stavu ${e.nazev}`; addLog({ t:'fx', notes:[{ c:'good', t:`✔️ Vyléčeno: ${e.nazev}` }] }); } }
    addLog({ t:'fx', notes:[{ c:'good', t:`${a.i} +${c.hp - b} HP` }] }); sfx('heal');
    closeDrawer();
    return finish(`Použiju schopnost ${a.nazev}. [HRA: vyléčeno ${c.hp - b} HP${cured}, hráč má ${c.hp}/${c.maxHp}.${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev}`);
  }
  if(a.kind === 'temp'){
    const r = (typeof a.flat === 'function' ? a.flat() : rollDice(aDice(a)).total) + (a.addStat ? Math.max(0, mod(c.stats[a.addStat])) : 0);
    spend(); addTemp(r, a.nazev); sfx('heal'); closeDrawer();
    return finish(`Použiju ${a.nazev}. [HRA: hráč získal ${r} dočasných životů – pohltí příští zranění.]`, `${a.i} ${a.nazev}`);
  }
  if(a.kind === 'nextAttack' || a.kind === 'nextRoll'){
    spend();
    const v = a.diceV ? rollDice(a.diceV()).total : a.v || 0;
    if(a.kind === 'nextAttack') S.nextAttack = { nazev:a.nazev, hit:a.hit || 0, double:!!a.double, adv:!!a.adv, spell:!!a.spell, extra:a.extraV ? a.extraV() : a.extra || null };
    else S.nextRoll = { nazev:a.nazev, stat:a.stat, v, adv:!!a.adv, checkOnly:!!a.checkOnly };
    const target = a.kind === 'nextAttack' ? (a.spell ? 'útok' : 'útok zbraní') : a.stat === '*' ? (a.checkOnly ? 'zkoušku' : 'hod') : 'hod na ' + statName(a.stat).toLowerCase();
    addLog({ t:'fx', notes:[{ c:'gold', t:`${a.i} ${a.nazev}${v ? ' (+' + v + ')' : ''}${a.adv ? ' – s výhodou' : ''} · platí pro příští ${target}` }] });
    hist(`Hráč si připravil schopnost ${a.nazev} (${a.popis}).`);
    sfx('page'); render(); save(); return;
  }
  if(a.kind === 'buff'){
    spend();
    const ef = a.eff();
    if(a.rage){
      if(perk('rageExtra')) ef.extraDmg = perk('rageExtra');
      if(perk('rageObrana')) ef.obrana = (ef.obrana || 0) + perk('rageObrana');
      if(perk('rageTemp')) addTemp(c.level, 'světový strom');
    }
    if(a.wild) addTemp(typeof a.temp === 'function' ? a.temp() : c.level * 2, 'zvířecí podoba');
    S.effects = S.effects.filter(e => e.nazev !== ef.nazev);
    S.effects.push({ id:newId('e'), typ:'pozehnani', popis:a.popis, postih:{}, hp:0, lecba:'', blokuje:false, ...ef });
    addLog({ t:'fx', notes:[{ c:'good', t:`${a.i} ${ef.nazev}` }] }); sfx('heal');
    closeDrawer();
    return finish(`Použiju ${a.nazev}. [HRA: ${a.popis}${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev}`);
  }
  if(a.kind === 'cure'){
    const list = S.effects.filter(e => ['nemoc','jed','prokleti'].includes(e.typ));
    if(!list.length){ alert('Nemáš žádnou nemoc, otravu ani kletbu.'); return; }
    const e = list.length === 1 ? list[0] : await pick('Čeho se zbavit?', list.map(x => ({ label:`${EFF_TYPES[x.typ].i} ${x.nazev}`, value:x })));
    if(!e || !canAct()) return;
    spend(); S.effects = S.effects.filter(x => x !== e);
    addLog({ t:'fx', notes:[{ c:'good', t:`✔️ Vyléčeno: ${e.nazev}` }] }); sfx('heal');
    closeDrawer();
    return act(`Použiju ${a.nazev} na ${e.nazev}. [HRA: stav ${e.nazev} byl odstraněn.]`, `${a.i} ${a.nazev}`);
  }
  /* útočné schopnosti */
  if(!S.foes.length){ alert('Tahle schopnost potřebuje nepřítele.'); return; }
  if(a.kind === 'dmgAll' || a.kind === 'sleepAll'){
    spend(); closeDrawer();
    const r = Math.max(1, rollDice(aDice(a)).total + castMod(a)), names = S.foes.map(f => f.jmeno);
    let txt;
    if(a.kind === 'sleepAll'){
      const out = S.foes.filter(f => f.hp <= r);
      S.foes = S.foes.filter(f => f.hp > r);
      out.forEach(f => grantXP(foeXP(f), f.jmeno));
      addLog({ t:'fx', notes:out.length ? out.map(f => ({ c:'good', t:`🌀 ${f.jmeno} omámen` })) : [{ c:'bad', t:'🌀 Nikdo nepodlehl' }] });
      txt = out.length ? `Omámeni a mimo boj: ${out.map(f => f.jmeno).join(', ')}.` : 'Kouzlo nikoho nepřemohlo.';
    }else{ sfx('clash'); txt = S.foes.slice().map(f => hurtFoe(f, r)).join(' '); }
    return act(`Použiju ${a.nazev} na ${names.join(', ')}. [HRA: ${a.kind === 'dmgAll' ? 'každý nepřítel utržil ' + r + ' zranění. ' : ''}${txt}${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev}`);
  }
  const foe = S.foes.length === 1 ? S.foes[0] : await pick(`${a.nazev} – na koho?`, S.foes.map(f => ({ label:`${f.jmeno} (${f.hp}/${f.maxHp} HP)`, value:f })));
  if(!foe || !canAct() || !S.foes.includes(foe)) return;
  spend(); closeDrawer();
  if(a.kind === 'sleepFoe'){
    const r = rollDice(aDice(a)).total;
    if(foe.hp <= r){
      S.foes = S.foes.filter(f => f !== foe);
      addLog({ t:'fx', notes:[{ c:'good', t:`${a.i} ${foe.jmeno} – ${a.verb || 'vyřazen'}` }] });
      grantXP(foeXP(foe), 'nepřítel vyřazen');
      return act(`Použiju ${a.nazev} na ${foe.jmeno}. [HRA: uspělo (síla ${r} ≥ ${foe.hp} HP), ${foe.jmeno} ${a.verb || 'je vyřazen'} a je mimo boj${S.foes.length ? '' : '. Boj skončil'}.${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev} → ${foe.jmeno}`);
    }
    addLog({ t:'fx', notes:[{ c:'bad', t:`${a.i} ${foe.jmeno} odolal` }] });
    return act(`Použiju ${a.nazev} na ${foe.jmeno}. [HRA: NEZABRALO (síla ${r} < ${foe.hp} HP).${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev} → ${foe.jmeno}`);
  }
  const dmg = Math.max(1, rollDice(aDice(a)).total + castMod(a));
  sfx('clash');
  const txt = hurtFoe(foe, dmg);
  return act(`Použiju ${a.nazev} na ${foe.jmeno}. [HRA: zásah za ${dmg} zranění. ${txt}${wildSurgeCheck(a)}]`, `${a.i} ${a.nazev} → ${foe.jmeno}`);
}

    ${sp ? `<div class="abil r0"><span class="ico">✨</span><span class="mid"><b>${esc(sp.nazev)}</b><small>Kdykoli: útok kouzlem ${esc(sp.zraneni)} (${esc(statName(sp.vlastnost))}). Napiš např. „sešlu ${esc(sp.nazev.toLowerCase())} na…“</small></span><span class="val">∞</span></div>` : ''}
    ${!c.obor && c.level >= 3 && OBORY[c.cls] ? `<button class="abil" data-act="subclass"><span class="ico">🎓</span><span class="mid"><b>Zvolit specializaci</b><small>Na 3. úrovni si vybíráš podtřídu.</small></span></button>` : ''}
    ${list.map(a => {
      const locked = a.lvl > c.level, left = abilityLeft(a);
      return `<button class="abil ${locked ? 'locked' : ''} ${a.reaction ? 'react' : ''}" data-abil="${a.id}" ${locked || !usable || left <= 0 || a.reaction || (inCombat() && ((a.bonus && S.tah?.bonus) || (a.slot && S.tah?.slot))) ? 'disabled' : ''}>
        <span class="ico">${a.i}</span><span class="mid"><b>${esc(a.nazev)}</b><small>${esc(a.popis)}</small></span>
        <span class="val">${locked ? '🔒 ' + a.lvl + '. úr.' : a.slot ? '1 slot' : left + '/' + abilityMax(a)}${!locked && a.reaction ? '<br><small>↺ reakce</small>' : !locked && a.bonus ? '<br><small>⚡ bonus</small>' : ''}</span></button>`; }).join('')}
    ${!usable ? `<div class="dnote">${busy ? 'Pán jeskyně právě píše…' : S.pending ? 'Nejdřív hoď kostkou.' : S.loot ? 'Nejdřív vyřeš nález.' : ''}</div>` : ''}
    <button class="cancel" data-act="closesheet">Zavřít</button>`);
