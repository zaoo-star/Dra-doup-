- "efekty" obsahují JEN to, co se v tomto kroku skutečně stalo. hp a zlato jsou změny (např. -3), ne nové hodnoty. Nepoužitá pole vynech nebo nech prázdná.
- Zkoušku vyžaduj JEN tehdy, když neúspěch má zajímavé následky. Běžné věci (prohlédnout místnost, vylézt na plot, zeptat se ochotného NPC) hráč prostě udělá bez hodu.
- OBTÍŽNOST zkoušky (D&D 2024): 5 velmi snadná (přelézt zídku), 8 snadná, 10 BĚŽNÁ – nejčastější volba (vypáčit jednoduchý zámek, uklidnit koně, všimnout si stop), 12–13 trochu náročná (přesvědčit podezíravého strážného), 15 TĚŽKÁ – opravdová výzva (přeskočit 3m propast, oklamat zkušeného úředníka), 20 velmi těžká – vzácně, 25+ jen hrdinské kousky. Na nízkých úrovních dávej většinou 8–13; 15 jen výjimečně. Okolnosti obtížnost mění (tma, spěch, odpor NPC zvyšují; příprava, nástroje a pomoc snižují) – ale nedávej pořád stejné číslo. Obtížnost hry (Příběh/Nemilosrdná) do čísla NEZAPOČÍTÁVEJ, to upraví hra sama.
- Když vyplňuješ "zkouska", nedávej do efektů výsledek té zkoušky. Vyprávění pak skonči POPISEM POKUSU (hráč se natahuje, zkoumá, přesvědčuje…), NIKDY otázkou „co uděláš?“ – teď hráč hází. Na další krok se ptej až po výsledku.
- "navrhy": vždy 3–4 opravdu odlišné možnosti, které v situaci dávají smysl – např. opatrná, odvážná, mluvení s někým, chytrý nápad nebo využití věci z inventáře. Aspoň JEDNA musí stavět na tom, čím je hráčova postava výjimečná: její povolání, dovednost se zdatností, schopnost, kouzlo nebo konkrétní věc z inventáře (zloděj „Prohlédnu zámek paklíči“, klerik „Pomodlím se nad mrtvým“, bard „Zahraju strážím do noty“). Hráč si vybere jednu, nebo napíše vlastní.

FILMOVÝ BOJ
- Výsledky hodů ti pošle hra. Popisuj je konkrétně a obrazně podle zbraně a nepřítele: kam rána dopadla, jak nepřítel zareagoval, co se rozbilo. Minutí není „minul jsi“ – nepřítel uhnul, čepel sklouzla po štítu, šíp se zabodl do trámu. Kritický zásah je okamžik, na který se vzpomíná.
- Nepřátelé jednají: řvou, ustupují, volají posily, prosí o milost, když prohrávají.
- „JAK TO CHCEŠ DOKONČIT?“: když hra v zadání napíše DOKONČENÍ, nepopisuj smrtící ránu sama – vyprávěj jen okamžik, kdy nepřítel vrávorá a je hráči vydán na milost, a zeptej se „Jak to chceš dokončit?“. Do "navrhy" dej 3 různé styly zakončení (krutý, elegantní, milosrdný – např. ušetřit ho a vyslechnout). Hráčův popis pak v dalším tahu vyprávěj přesně a epicky.

TAJNÉ POZNÁMKY PÁNA JESKYNĚ
- Ve stavu → "tajne_poznamky_PJ" máš svoje soukromé poznámky. Hráč je NEVIDÍ a nikdy mu je přímo neprozrazuj.
- Zapisuj si do "tajne" (jedna krátká věta) plány a tajemství, která chceš později využít: kdo lže a proč, co se chystá za scénou, skrytá past, kde je ukrytý předmět, kdo hráče sleduje. Pak je postupně NAZNAČUJ (drobné stopy, nervózní NPC, zvěsti) – ať příběh drží pohromadě a zvraty dávají smysl.
- Když se tajemství odhalí nebo plán proběhne, smaž ho přes "tajne_smazat": ["přesný text poznámky"].

UKÁZKA DOBRÉHO A ŠPATNÉHO TAHU
Hráč: „Vejdu do krčmy a rozhlédnu se.“
ŠPATNĚ (obecné, bez smyslů, nic se neděje, rozhoduje za hráče): „Vejdeš do krčmy. Je tu hodně lidí a atmosféra je napjatá. Rozhodneš se jít k barovému pultu.“
DOBŘE: „Dveře **U Utopence** za tebou zaskřípou a do tváře tě udeří teplo, kouř z jalovcového dřeva a kyselý pach rozlitého piva. Hovor u nejbližšího stolu utichne – tři drvoši si tě měří od hlavy k patě a jeden pomalu zakryje dlaní svůj měšec. U krbu sedí shrbená stařena a plete. Mezi vlnou má zapletené pírko černé vrány – stejné, jaké jsi ráno našel na mrtvém poslovi.
**Hostinský:** „Pokoje nemám. Jestli chceš pít, plať předem.““
(konkrétní místo a lidé, tři smysly, háček navázaný na příběh, NPC s vlastním hlasem, skončí v momentě, kdy je na tahu hráč)`;

  : 'Pole "shrnuti" a "kapitola" nastav na null.'}`;

   VOLÁNÍ AI
   ========================================================= */
function parseJSON(text){
  try{ return JSON.parse(text); }catch(e){}
  const m = String(text).match(/\{[\s\S]*\}/);
  if(m){ try{ return JSON.parse(m[0]); }catch(e){} }
  return repairJSON(text);
}
/* Oprava drobných chyb AI: ```json obal, čárka před závorkou, useknutý konec (dovře řetězec a závorky). */
function repairJSON(text){
  let t = String(text || '').replace(/```(?:json)?/gi, '');
  const i = t.indexOf('{'); if(i < 0) return null;
  t = t.slice(i).replace(/,\s*([}\]])/g, '$1');
  try{ return JSON.parse(t); }catch(e){}
  const stack = []; let inStr = false, esc = false, lastSafe = 0;
  for(let k = 0; k < t.length; k++){
    const ch = t[k];
    if(inStr){ if(esc) esc = false; else if(ch === '\\') esc = true; else if(ch === '"') inStr = false; continue; }
    if(ch === '"') inStr = true;
    else if(ch === '{' || ch === '[') stack.push(ch === '{' ? '}' : ']');
    else if(ch === '}' || ch === ']'){ stack.pop(); if(!stack.length){ lastSafe = k + 1; break; } }
    else if(ch === ',') lastSafe = k;
  }
  if(!stack.length && lastSafe){ try{ return JSON.parse(t.slice(0, lastSafe)); }catch(e){} }
  /* useknuté: zahodit rozepsanou poslední položku a dovřít */
  let cut = t;
  if(inStr) cut += '"';
  const close = () => { const st = []; let s2 = false, e2 = false; for(const ch of cut){ if(s2){ if(e2) e2 = false; else if(ch === '\\') e2 = true; else if(ch === '"') s2 = false; continue; } if(ch === '"') s2 = true; else if(ch === '{' || ch === '[') st.push(ch === '{' ? '}' : ']'); else if(ch === '}' || ch === ']') st.pop(); } return st.reverse().join(''); };
  for(let tries = 0; tries < 6; tries++){
    try{ return JSON.parse(cut.replace(/,\s*$/, '') + close()); }catch(e){}
    const c = Math.max(cut.lastIndexOf(','), 0); if(!c) break;
    cut = cut.slice(0, c);
  }
  return null;
}
/* Když se JSON nedá zachránit, ale vyprávění je celé, použije se aspoň ono (bez efektů) – raději než přepsat tah jinou AI. */
function salvageDM(text){
  const v = partialField(String(text || ''), 'vypraveni');
  if(v.length < 40) return null;
  const nav = (String(text).match(/"navrhy"\s*:\s*\[([^\]]*)\]/) || [])[1];
  let navrhy = [];
  try{ navrhy = nav ? JSON.parse('[' + nav + ']') : []; }catch(e){}
  return { vypraveni:v, efekty:{}, navrhy, _salvaged:true };
}
function checkRaw(out){
  if(!out || typeof out !== 'object') throw new Error('AI vrátila nečitelnou odpověď');
  return out;
}
function checkOut(out){
  if(!out || !out.vypraveni) throw new Error('AI vrátila nečitelnou odpověď');
  return out;
}
const fetchVia = (p, req) => p === 'claude' ? fetchClaude(req) : p === 'grok' ? fetchGrok(req) : p === 'mistral' ? fetchMistral(req) : fetchGemini(req);
const hasKeyFor = p => !!cleanKey(ls.get('kroniky_key_' + p));
/* záloha: nejdřív bezplatný Mistral, pak Gemini, nakonec Claude */
const fallbackFor = p => ['mistral','gemini','claude'].find(x => x !== p && hasKeyFor(x) && (x !== 'mistral' || ls.get('dz_mistral_ok') !== 'no')) || null;
async function fetchDM(req){
  const p = getProvider();
  try{ return await fetchVia(p, req); }
  catch(e0){
    let e = e0;
    /* přechodná chyba (přetížení, přerušený stream): nejdřív zkusit stejnou AI znovu, až pak zálohu */
    if(e.retry){
      if(!req.prompt && e.partial){ const sv = salvageDM(e.partial); if(sv && /"(navrhy|efekty)"/.test(e.partial)) return sv; }
      liveText = ''; document.getElementById('liveDM')?.remove();
      await new Promise(r => setTimeout(r, 1500));
      try{ return await fetchVia(p, { ...req, noStream:true }); }catch(e2){ e = e2; }
    }
    const alt = fallbackFor(p);
    if(!alt || ls.get('dz_fallback') === 'off') throw e;
    liveText = ''; document.getElementById('liveDM')?.remove();
    const res = await fetchVia(alt, req);
    if(!req.prompt && S) addLog({ t:'sys', text:`🛟 ${PROVIDERS[p].nazev} neodpověděl (${String(e.message).slice(0,100)}) – tentokrát vyprávěl ${PROVIDERS[alt].nazev}.` });
    return res;
  }
}

/* Průběžné vypisování: z rozepsaného JSON vytáhne text "vypraveni" a ukáže ho v logu. */
let liveText = '', lastStreamed = false;
function partialField(raw, key = 'vypraveni'){
  const m = new RegExp('"' + key + '"\\s*:\\s*"').exec(raw); if(!m) return '';
  let i = m.index + m[0].length, out = '';
  while(i < raw.length){
    const ch = raw[i];
    if(ch === '\\'){
      const n = raw[i + 1]; if(n === undefined) break;
      if(n === 'u'){ const h = raw.slice(i + 2, i + 6); if(h.length < 4) break; out += String.fromCharCode(parseInt(h, 16)); i += 6; continue; }
      out += n === 'n' ? '\n' : n === 't' ? ' ' : n; i += 2; continue;
    }
    if(ch === '"') break;
    out += ch; i++;
  }
  return out;
}
function liveDM(raw){
  const t = partialField(raw); if(!t || t === liveText) return;
  liveText = t; lastStreamed = true;
  const log = $('#log'); if(!log) return;
  let el = document.getElementById('liveDM');
  if(!el){ el = document.createElement('div'); el.id = 'liveDM'; el.className = 'e dm live'; log.appendChild(el); }
  el.innerHTML = dmRich(t);
  if(el.offsetHeight < log.clientHeight * 0.6) log.scrollTop = log.scrollHeight;
}
async function readClaudeStream(r, usage){
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '';
  for(;;){
    const { done, value } = await rd.read(); if(done) break;
    buf += dec.decode(value, { stream:true });
    let ix;
    while((ix = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, ix).trim(); buf = buf.slice(ix + 1);
      if(!line.startsWith('data:')) continue;
      let ev; try{ ev = JSON.parse(line.slice(5)); }catch(e){ continue; }
      if(ev.type === 'message_start') Object.assign(usage, ev.message?.usage || {});
      else if(ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta'){ text += ev.delta.text; liveDM(text); }
      else if(ev.type === 'message_delta' && ev.usage) Object.assign(usage, ev.usage);
      else if(ev.type === 'error'){ const er = new Error(ev.error?.message || 'přerušené spojení'); er.retry = true; er.partial = text; throw er; }
    }
  }
  return text;
}

/* Claude (Anthropic) – volání přímo z prohlížeče. Dlouhé pokyny Pána jeskyně se ukládají do mezipaměti
   (prompt caching), takže se při dalších tazích platí jen zlomek ceny. */
const CLAUDE_MODELS = [['claude-haiku-5-5', 'Haiku 5.5', 'nejlevnější a nejrychlejší']];
const claudeModel = () => CLAUDE_MODELS[0][0];   /* běžné tahy: Haiku – levné a rychlé */
const SONNET = 'claude-sonnet-5-5';
const sonnetOn = () => ls.get('dz_sonnet') !== 'off' && ls.get('dz_sonnet_bad') !== '1';
/* Důležité chvíle: začátek příběhu, souboj se silným nepřítelem, dokončení nepřítele, poslední dějový bod, konec příběhu */
function importantMoment(req){
  const v = req.vstup || {};
  if(req.prompt || !S) return false;
  if(v.typ === 'start' || v.dokonceni || v.finisherFor) return true;
  if(S.foes.some(isBossFoe) && (v.typ === 'hod' || v.typ === 'akce')) return true;
  if(story() && !S.storyEnd && (S.storyStep || 0) >= story().body.length - 1) return true;
  return false;
}
const claudeName = id => (CLAUDE_MODELS.find(m => m[0] === id) || [id, id])[1];
const claudeKey = () => cleanKey(ls.get('kroniky_key_claude'));
async function fetchClaude(req){
  const stream = !req.prompt && !req.noStream && ls.get('dz_stream') !== 'off' && typeof TextDecoder !== 'undefined';
  const big = sonnetOn() && importantMoment(req);
  const body = { model:big ? SONNET : claudeModel(), max_tokens:4000, temperature:0.9, ...(stream ? { stream:true } : {}),
    system:req.sys ? [{ type:'text', text:req.sys, cache_control:{ type:'ephemeral' } }]
      : [{ type:'text', text:SYSTEM }, ...(storyStatic() ? [{ type:'text', text:storyStatic() }] : [])].map((b, i, a) => i === a.length - 1 ? { ...b, cache_control:{ type:'ephemeral' } } : b),
    messages:[{ role:'user', content:req.prompt || buildPrompt(req) }] };
  const send = b => fetch('https://api.anthropic.com/v1/messages', { method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':claudeKey(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body:JSON.stringify(b) });
  let r = await send(body);
  if(r.status === 400){
    const d0 = await (r.clone ? r.clone() : r).json().catch(() => null);
    if(/temperature/i.test(d0?.error?.message || '')){ delete body.temperature; r = await send(body); }
    else if(!r.clone) throw claudeErr(r, d0);
  }
  if(!r.ok){
    const d = await r.json().catch(() => null);
    /* Sonnet na účtu není → příště jen Haiku, teď to zkusit znovu */
    if(big && (r.status === 404 || r.status === 400 && /model/i.test(d?.error?.message || ''))){ ls.set('dz_sonnet_bad', '1'); return fetchClaude(req); }
    throw claudeErr(r, d);
  }
  const usage = {};
  let text;
  if(stream && r.body && r.body.getReader) text = await readClaudeStream(r, usage);
  else { const d = await r.json().catch(() => null); Object.assign(usage, d?.usage || {}); text = (d?.content || []).filter(c => c.type === 'text').map(c => c.text).join(''); }
  trackClaude(usage, big);
  if(big && S) S.lastSonnet = S.turn + 1;
  let out = parseJSON(text);
  if(!req.prompt && !out?.vypraveni) out = salvageDM(text);       /* Claudovo vyprávění nezahazovat kvůli chybě ve formátu */
  return req.prompt ? checkRaw(out) : checkOut(out);
}
function claudeErr(r, d){
  const m = d?.error?.message || ('HTTP ' + r.status), k = claudeKey();
  if(r.status === 401) return new Error(`Claude odmítl API klíč (${keyHint(k)}). Zkontroluj, že je celý – začíná „sk-ant-“.`);
  if(/credit balance|billing/i.test(m)) return new Error('Na účtu Claude došel kredit – dobij ho na platform.claude.com → Billing.');
  if(r.status === 404 || /model/i.test(m) && r.status === 400) return new Error('Model Claude ' + claudeName(claudeModel()) + ' není na tvém účtu dostupný. [' + m + ']');
  if(r.status === 429) return new Error('Moc dotazů najednou – chvilku počkej a zkus to znovu.');
  if(r.status === 529 || r.status >= 500){ const er = new Error('Claude je teď přetížený – zkus to za chvilku znovu.'); er.retry = true; return er; }
  return new Error(m);
}

/* Gemini: modely se často přejmenovávají, proto je bereme ze seznamu.
   Výchozí je nejlevnější „flash-lite“, který má bezplatný limit. */
const GEM = 'https://generativelanguage.googleapis.com/v1beta/';
/* Volání Gemini s klíčem. Nové klíče „AQ.…“ Google občas odmítá v hlavičce (401 „Expected OAuth 2 access token“),
   proto při 401 zkusíme klíč v adrese (?key=) a co projde, si zapamatujeme. */
async function gemFetch(url, opts = {}, key = cleanKey(ls.get('kroniky_key_gemini'))){
  const viaQuery = () => fetch(url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key), { ...opts, headers:{ ...(opts.headers || {}) } });
  const viaHeader = () => fetch(url, { ...opts, headers:{ ...(opts.headers || {}), 'x-goog-api-key':key } });
  const q = ls.get('dz_gem_auth') === 'q';
  let r = await (q ? viaQuery() : viaHeader());
  if(r.status === 401){
    const r2 = await (q ? viaHeader() : viaQuery());
    if(r2.ok){ ls.set('dz_gem_auth', q ? '' : 'q'); return r2; }
    if(r2.status !== 401) return r2;
  }
  return r;
}
function gemErr(r, d){
  const m = (d && d.error && d.error.message) || ('HTTP ' + r.status);
  if(r.status === 401 || r.status === 403 && /API key|unregistered|permission/i.test(m) || /API key not valid|API_KEY_INVALID/i.test(m)){
    const k = cleanKey(ls.get('kroniky_key_gemini'));
    return new Error(`Google odmítl API klíč (${keyHint(k)}). ` +
      (/^AQ\./.test(k) ? 'Nové klíče začínající „AQ.“ teď u Googlu často nefungují – je to chyba na jejich straně. Zkus v AI Studiu (aistudio.google.com → Get API key) vytvořit nový klíč, ideálně v novém projektu; funkční klíč obvykle začíná „AIza“. '
        : 'Zkontroluj, že je zkopírovaný celý (klíč Gemini má obvykle 39 znaků a začíná „AIza“). ') + '[' + m + ']');
  }
  return new Error(m);
}
async function geminiModels(){
  const r = await gemFetch(GEM + 'models?pageSize=200');
  const d = await r.json().catch(() => null);
  if(!r.ok) throw gemErr(r, d);
  const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [0,0])[1]);
  return (d?.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /^gemini-[\d.]+-flash/.test(n) && !/image|tts|live|transcribe|audio|embed|vision|thinking|exp|\d{3,}$/i.test(n))
    .sort((a,b) => ver(b) - ver(a) || a.length - b.length);
}
async function geminiModel(){
  const cached = ls.get('kroniky_gemini_model');
  if(cached) return cached;
  const list = await geminiModels();
  const stable = list.filter(n => !/preview/i.test(n));
  const pick = stable.find(n => /flash-lite/.test(n)) || list.find(n => /flash-lite/.test(n)) || stable[0] || list[0];
  if(!pick) throw new Error('Nenašel jsem žádný model Gemini Flash');
  ls.set('kroniky_gemini_model', pick);
  return pick;
}
async function fetchGemini(req){
  const model = await geminiModel();
  const noThink = ls.get('kroniky_gemini_think') !== 'x';   /* „přemýšlení“ se platí jako výstup – vypínáme */
  const send = gc => gemFetch(`${GEM}models/${model}:generateContent`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({
      systemInstruction:{ parts:[{ text:req.sys || dmSysText() }] },
      contents:[{ role:'user', parts:[{ text:req.prompt || buildPrompt(req) }] }],
      generationConfig:gc
    })
  });
  /* Různé modely přijímají různá nastavení. Zkoušíme od nejlevnějšího po nejjednodušší
     a co projde, si zapamatujeme (při chybě 400 „invalid argument“ jdeme o krok dál). */
  const base = { temperature:0.9, maxOutputTokens:4000 };
  const modes = [
    { ...base, responseMimeType:'application/json', thinkingConfig:{ thinkingBudget:0 } },
    { ...base, responseMimeType:'application/json', thinkingConfig:{ thinkingLevel:'low' } },
    { ...base, responseMimeType:'application/json' },
    { ...base }
  ];
  let mi = clamp(int(ls.get('kroniky_gemini_mode')), 0, modes.length - 1), r, d;
  if(!noThink) mi = Math.max(mi, 2);
  for(;;){
    r = await send(modes[mi]); d = await r.json().catch(() => null);
    if(r.ok || r.status !== 400 || mi >= modes.length - 1) break;
    mi++;
  }
  if(r.ok) ls.set('kroniky_gemini_mode', String(mi));
  else if(r.status === 400) ls.set('kroniky_gemini_mode', '');
  if(!r.ok){
    if(r.status === 404) ls.set('kroniky_gemini_model', '');
    if(r.status === 429) throw new Error('vyčerpán bezplatný limit – zkus to za chvíli, nebo přepni model v Kronice');
    throw gemErr(r, d);
  }
  trackGemini(d?.usageMetadata);
  const parts = (d?.candidates?.[0]?.content?.parts || []).filter(p => !p.thought);
  const out = parseJSON(parts.map(p => p.text || '').join(''));
  return req.prompt ? checkRaw(out) : checkOut(out);
}

const MISTRAL_MODELS = [['mistral-large-latest','Large','nejlepší čeština a vyprávění'],['mistral-medium-latest','Medium','vyvážený'],['mistral-small-latest','Small','nejrychlejší']];
const mistralModel = () => MISTRAL_MODELS.some(m => m[0] === ls.get('dz_mistral_model')) ? ls.get('dz_mistral_model') : 'mistral-large-latest';
const mistralBase = () => (ls.get('dz_mistral_proxy') || 'https://api.mistral.ai').replace(/\/+$/, '');
let mistralLast = 0;
async function fetchMistral(req, model){
  const key = cleanKey(ls.get('kroniky_key_mistral'));
  if(!key) throw new Error('Mistral nemá klíč');
  const wait = mistralLast + 1100 - Date.now();                /* limit 1 dotaz za sekundu */
  if(wait > 0) await new Promise(r => setTimeout(r, wait));
  mistralLast = Date.now();
  let r;
  try{
    r = await fetch(mistralBase() + '/v1/chat/completions', { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + key },
      body:JSON.stringify({ model:model || mistralModel(), temperature:0.8, max_tokens:4000, response_format:{ type:'json_object' },
        messages:[{ role:'system', content:req.sys || dmSysText() }, { role:'user', content:req.prompt || buildPrompt(req) }] }) });
  }catch(e){
    throw new Error(ls.get('dz_mistral_proxy') ? 'Prostředník pro Mistral neodpovídá (' + e.message + ')' : 'Prohlížeč spojení s Mistralem zablokoval (CORS) – je potřeba prostředník, viz Kronika → 🧪 Vyzkoušet Mistral');
  }
  const d = await r.json().catch(() => null);
  if(!r.ok){
    const m = d?.message || d?.error?.message || d?.detail || ('HTTP ' + r.status);
    if(r.status === 401) throw new Error(`Mistral odmítl klíč (${keyHint(key)})`);
    if(r.status === 429) throw new Error('Mistral: moc dotazů najednou nebo vyčerpaný limit – chvilku počkej');
    throw new Error('Mistral: ' + (typeof m === 'string' ? m : JSON.stringify(m)).slice(0, 160));
  }
  const o = spend(); o.mCalls = (o.mCalls || 0) + 1; o.mTok = (o.mTok || 0) + (d?.usage?.total_tokens || 0); o.since ||= new Date().toISOString().slice(0,10); setSpend(o);
  const out = parseJSON(d?.choices?.[0]?.message?.content || '');
  return req.prompt ? checkRaw(out) : checkOut(out);
}

   Samostatné volání AI: nic nemění na hře (čas, tahy, historie, boj),
   výsledek se jen uloží do S.recap, aby se při dalším otevření nemusel platit znovu.

const RECAP_SYS = `Jsi kronikář textové hry Dungeons & Dragons. Hráč si vyžádal přehled, kde se v příběhu nachází.
Piš česky, věcně, ve druhé osobě („vydal ses…“), bez vymýšlení nových událostí – vycházej JEN z dodaného stavu, shrnutí a historie.
Neprozrazuj tajemství, která hráč ještě neodhalil. Odpověz POUZE platným JSON objektem:

"ukoly" max 6, "postavy" jen ty důležité (max 6), "rady" 2–4.`;

function recapPrompt(){

${S.summary || '(zatím nic)'}
${(S.kapitoly || []).length ? '\nKAPITOLY:\n' + S.kapitoly.map((k,i) => `${i + 1}. ${k.t}`).join('\n') + '\n' : ''}${(S.fakta || []).length ? '\nDŮLEŽITÁ FAKTA:\n' + S.fakta.map(f => '- ' + f.t).join('\n') + '\n' : ''}
POSLEDNÍ DĚNÍ:
${hist || '(hra právě začala)'}

Sestav přehled postupu hráče podle zadaného JSON formátu.`;

const recapList = v => (Array.isArray(v) ? v : v ? [v] : []).map(x => typeof x === 'string' ? x : x && typeof x === 'object' ? Object.values(x).filter(y => typeof y === 'string').join(' – ') : String(x ?? '')).map(x => x.trim()).filter(x => x && x !== '[object Object]').slice(0, 8);
function sanitizeRecap(o){

async function chooseFeat(k){
  const c = S.char;
  if(!S.featPicks || (k !== 'asi' && (!FEATS[k] || featHas(k)))) return;
  closeSheet();
  const mental = ['inteligence','moudrost','charisma'];
  if(k === 'asi'){ S.featPicks--; S.statPicks = (S.statPicks || 0) + 2; S._lvlAsked = false; save(); render(); return levelUpPick(); }
  if(k === 'houzevnaty' || k === 'valecny_mag'){
    const opts = (k === 'houzevnaty' ? STAT_KEYS : mental).filter(x => c.stats[x] < 20 || k === 'houzevnaty').map(x => ({ label:`${statName(x)} ${c.stats[x]} → ${Math.min(20, c.stats[x] + 1)}`, value:x }));
    const st = await pick(`${FEATS[k].i} ${FEATS[k].n}: kterou vlastnost?`, opts);
    if(!st) return;
    incStat(st); c.featData = { ...(c.featData || {}), [k]:st };
  }
  if(k === 'zrucny'){
    c.skillsExtra ||= [];
    for(let i = 0; i < 3; i++){
      const opts = Object.keys(SKILLS).filter(x => !profSkills().has(x)).map(x => ({ label:`${skillName(x)} (${statName(SKILLS[x][1])})`, value:x }));

  if(k === 'bystry'){ incStat('moudrost'); if(profSkills().has('vnimani')) (c.expertExtra ||= []).push('vnimani'); else (c.skillsExtra ||= []).push('vnimani'); }

}

/* Co se obnoví krátkým odpočinkem (1 = vše, 'one' = jedno použití) */
const SHORT_REST = { dech:1, uder:1, taktika:1, pritok:1, krok:1, odrazeni:1, manevr:1, psi:1, svata:1, prisaha:1, vilikrok:1, jiskra:'one', podoba:'one', inspirace:l => l >= 5 };
const hdLeft = () => S.char.hdLeft ?? S.char.level;
function shortRecharge(){
  const out = [], c = S.char;
  for(const a of classAbilities()){
    if(a.slot || a.lvl > c.level) continue;
    const sr = SHORT_REST[a.id], on = typeof sr === 'function' ? sr(c.level) : sr;
    if(!on) continue;
    const max = abilityMax(a), cur = abilityLeft(a);
    if(cur >= max) continue;
    S.res[a.id] = on === 'one' ? Math.min(max, cur + 1) : max; out.push(a.nazev);
  }
  if(CLASSES[c.cls].caster === 'pact' && S.slots < slotMax()){ S.slots = slotMax(); out.push('sloty paktu'); }
  if(c.cls === 'mag' && !S.arcRec && S.slots < slotMax()){ S.arcRec = true; const g = Math.max(1, Math.ceil(c.level / 4)); S.slots = Math.min(slotMax(), S.slots + g); out.push(`Arkánní zotavení (+${g} ${g === 1 ? 'slot' : 'sloty'})`); }
  return out;
}
function shortRestPreview(){
  const c = S.char, names = [];
  for(const a of classAbilities()){ if(a.slot || a.lvl > c.level) continue; const sr = SHORT_REST[a.id]; if((typeof sr === 'function' ? sr(c.level) : sr) && abilityLeft(a) < abilityMax(a)) names.push(a.nazev); }
  if(CLASSES[c.cls].caster === 'pact' && S.slots < slotMax()) names.push('sloty paktu');
  if(c.cls === 'mag' && !S.arcRec && S.slots < slotMax()) names.push('Arkánní zotavení');
  return names;
}
function shortRestSheet(){
  if(!canAct() || S.foes.length) return alert('Odpočívat teď nejde.');
  const c = S.char, left = hdLeft(), hd = hitDie(), pv = shortRestPreview();
  openSheet(`<h3>☕ Krátký odpočinek (1 hodina)</h3>
    <p class="ddesc">Kostky životů: <b>${left}/${c.level} × d${hd}</b> – každá vyléčí d${hd} ${fmtMod(mod(c.stats.odolnost))} (odolnost). Životy teď ${c.hp}/${c.maxHp}.</p>
    <div class="dnote" style="text-align:left">${pv.length ? 'Obnoví se: ' + esc(pv.join(', ')) + '.' : 'Žádná schopnost se tím neobnoví.'} Kostky životů vrátí až spánek.</div>
    <div class="flbl">Kolik kostek použít?</div>
    <div class="seg wrap">${Array.from({ length:Math.min(left, 8) + 1 }, (_, i) => `<button data-act="srest" data-k="${i}">${i ? i + '× d' + hd : 'žádnou'}</button>`).join('')}</div>
    <button class="cancel" data-act="closesheet">Zrušit</button>`);
}
function shortRest(n){
  if(!canAct() || S.foes.length) return;
  closeSheet();
  const c = S.char;
  n = clamp(int(n), 0, hdLeft());
  const rolls = [];
  for(let i = 0; i < n; i++) rolls.push(Math.max(1, 1 + Math.floor(Math.random() * hitDie()) + mod(c.stats.odolnost)));
  const heal = rolls.reduce((a, b) => a + b, 0), before = c.hp;
  c.hdLeft = hdLeft() - n; c.hp = Math.min(c.maxHp, c.hp + heal);
  const rec = shortRecharge();
  advanceTime(1, false);
  addLog({ t:'fx', notes:[{ c:'good', t:`☕ Krátký odpočinek · +${c.hp - before} HP${n ? ' (' + rolls.join(' + ') + ')' : ''}` }, ...rec.map(x => ({ c:'good', t:'✨ ' + x }))] });
  hist(`Hráč si dal hodinový krátký odpočinek: ${n} kostek životů, +${c.hp - before} HP (má ${c.hp}/${c.maxHp}).${rec.length ? ' Obnovilo se: ' + rec.join(', ') + '.' : ''}`);
  sfx('heal'); render(); save();
}

const spellMinLvl = s => (CLASSES[S.char.cls].caster === 'half' ? [0,1,5,9,13,17,99,99,99,99] : [0,1,3,5,7,9,11,13,15,17])[s.kruh] ?? 99;
const spellCost = s => s.kruh <= 3 ? 1 : s.kruh <= 6 ? 2 : 3;
function learnedSpells(){
  return (S.char.kouzla || []).map(id => SPELLS.find(s => s.id === id)).filter(Boolean)
    .map(s => ({ ...s, slot:true, cost:spellCost(s), lvl:spellMinLvl(s), learned:true }));
}
function learnableSpells(){
  const c = S.char, L = SPELL_LIST[c.cls];
  if(!L) return [];
  const have = new Set(classAbilities().map(a => low(a.nazev)));
  return SPELLS.filter(s => s.t.includes(L) && spellMinLvl(s) <= c.level && !(c.kouzla || []).includes(s.id) && !have.has(low(s.nazev)));
}
const spellsPerLevel = cls => cls === 'mag' ? 2 : SPELL_LIST[cls] ? 1 : 0;
function spellLearnSheet(){
  const c = S.char, list = learnableSpells();
  if(!S.spellPicks) return;
  if(!list.length){ S.spellPicks = 0; save(); return alert('Teď už se nemáš co nového naučit – další kouzla se odemknou na vyšších úrovních.'); }
  const groups = [...new Set(list.map(s => s.kruh))].sort((a,b) => a - b);
  openSheet(`<h3>📖 Naučit se kouzlo (${S.spellPicks}×)</h3>
    <div class="dnote" style="text-align:left;margin:-4px 0 10px">Kouzla se sesílají ze slotů (1.–3. kruh = 1 slot, 4.–6. = 2, 7.–9. = 3). 🌀 = soustředění: můžeš udržet jen jedno a při zranění hážeš na odolnost, jestli ho neztratíš.</div>
    ${groups.map(g => `<div class="flbl">${g}. kruh</div>` + list.filter(s => s.kruh === g).map(s => `<button class="abil" data-learn="${s.id}"><span class="ico">${s.i}</span><span class="mid"><b>${esc(s.nazev)}${s.conc ? ' 🌀' : ''}</b><small>${esc(s.popis)}</small></span><span class="val">${spellCost(s)} ${spellCost(s) === 1 ? 'slot' : 'sloty'}</span></button>`).join('')).join('')}
    <button class="cancel" data-act="closesheet">Později</button>`);
}
function learnSpell(id){
  const s = SPELLS.find(x => x.id === id);
  if(!s || !S.spellPicks || !learnableSpells().some(x => x.id === id)) return;
  S.char.kouzla = [...(S.char.kouzla || []), id]; S.spellPicks--;
  addLog({ t:'fx', notes:[{ c:'good', t:`📖 Nové kouzlo: ${s.i} ${s.nazev}` }] });
  hist(`Hráč se naučil kouzlo ${s.nazev} (${s.kruh}. kruh): ${s.popis}`);
  sfx('page'); save(); render();
  if(S.spellPicks) spellLearnSheet(); else closeSheet();
}
/* Soustředění: aktivní může být jen jedno kouzlo; zranění ho může přerušit. */
const concEffect = () => S.effects.find(e => e.conc);
function endConcentration(why){
  const e = concEffect(); if(!e) return;
  S.effects = S.effects.filter(x => !x.conc);
  addLog({ t:'fx', notes:[{ c:'bad', t:`🌀 Soustředění ztraceno: ${e.nazev}${why ? ' (' + why + ')' : ''}` }] });
  hist(`Hráč ztratil soustředění – kouzlo ${e.nazev} skončilo${why ? ' (' + why + ')' : ''}.`);
}
function concCheck(dmg){
  const e = concEffect(); if(!e || dmg <= 0) return;
  if(S.char.hp <= 0) return endConcentration('bezvědomí');
  const dc = Math.max(10, Math.floor(dmg / 2)), adv = featHas('valecny_mag');
  const d1 = d20(), d2 = adv ? d20() : null, d = adv ? Math.max(d1, d2) : d1;
  const parts = [{ n:'Odolnost', v:mod(S.char.stats.odolnost) }];
  if(saveProf('odolnost')) parts.push({ n:'Zdatnost (záchrana)', v:profBonus() });
  const total = d + parts.reduce((a, x) => a + x.v, 0), ok = d === 20 || (d !== 1 && total >= dc);
  addLog({ t:'roll', title:`Soustředění: ${e.nazev}${adv ? ' · výhoda' : ''}`, d, d2:adv ? (d === d1 ? d2 : d1) : null, parts, total, dc, dcl:'obtížnost', ok, res:ok ? 'Soustředění udrženo' : 'Soustředění ztraceno' });
  if(!ok) endConcentration('zranění');
}

const nameStems = k => low(k).replace(/[()„“"]/g, ' ').split(/[\s,]+/).filter(w => w.length >= 3 && !GENERIC_NPC.some(g => w.startsWith(g))).map(w => w.length > 4 ? w.slice(0, w.length - 2) : w.slice(0, 3));
function npcContext(){
  const txt = low([...(S.history || []).slice(-8).map(h => h.text), S.curText || '', S.location || ''].join(' \n '));
  const keys = Object.keys(S.npcs || {});
  const set = new Set(keys.slice(-3));                    /* naposledy potkané */
  if(S.comp) set.add(S.comp.jmeno);
  for(const k of keys){
    if(txt.includes(low(k))) { set.add(k); continue; }
    if(nameStems(k).some(st => new RegExp('(^|[^\\p{L}])' + st.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'u').test(txt))) set.add(k);
  }
  return set;
}

/* Fráze, které se v posledních vyprávěních opakují (3 slova a víc ve 3+ odpovědích) + začátky odpovědí. */
const CLICHES = ['vzduch je těžký','srdce ti buší','ticho prořízne','mráz ti přeběhne po zádech','nikdo si tě nevšímá','napětí by se dalo krájet','zdá se, že','jako by','v dálce se ozve','tvé smysly'];
function repetitionHint(){
  const dms = (S.log || []).filter(e => e.t === 'dm').slice(-8).map(e => low(String(e.text).replace(/\*\*/g, '')));
  if(dms.length < 3) return '';
  const cnt = {};
  for(const t of dms){
    const w = t.replace(/[„“"()…:;!?.,–-]/g, ' ').split(/\s+/).filter(Boolean), seen = new Set();
    for(let i = 0; i + 3 <= w.length; i++){
      const g = w.slice(i, i + 3).join(' ');
      if(g.length < 12 || seen.has(g)) continue; seen.add(g); cnt[g] = (cnt[g] || 0) + 1;
    }
  }
  const rep = Object.entries(cnt).filter(([, n]) => n >= 3).sort((a,b) => b[1] - a[1]).map(([g]) => g).slice(0, 8);
  const cl = CLICHES.filter(c => dms.some(t => t.includes(c)));
  const starts = [...new Set(dms.slice(-4).map(t => t.split(/\s+/).slice(0, 2).join(' ')))];
  const out = [...new Set([...rep, ...cl])];
  return (out.length ? `NEPOUŽÍVEJ tyto opakované fráze: ${out.map(x => '„' + x + '“').join(', ')}. ` : '') + `Nezačínej slovy: ${starts.map(x => '„' + x + '…“').join(', ')}.`;
}
function lengthHint(v){
  if(S.finisher && v.typ === 'akce') return 'DÉLKA: 70–120 slov – epické zakončení boje podle hráčova popisu.';
  if(S.foes.length || v.typ === 'hod' && S.cb) return 'DÉLKA: boj – 1–3 krátké úderné věty, nejvýš 55 slov.';
  if(v.typ === 'start' || v.typ === 'prichod') return 'DÉLKA: nové místo – 90–140 slov, atmosféra, smysly a háček.';
  if(v.typ === 'udalost' || v.typ === 'noc' || v.typ === 'bezvedomi') return 'DÉLKA: 60–110 slov.';
  return 'DÉLKA: 40–90 slov (rozhovor a běžná akce).';
}

   PŘEHLED HODU – bonusy a postihy jako štítky, šance na úspěch, důvody výhody a nevýhody

const PROTI_N = { jed:'jedu', strach:'strachu', kouzlo:'kouzlům', spanek:'uspání', nemoc:'nemoci', kletba:'kletbám' };
const WX_WHY = { 'mlha':'mlha – na cíl skoro nevidíš', 'bouře':'bouře – vítr a liják ruší střelbu i oheň', 'déšť':'déšť – ohnivé kouzlo syčí a hasne' };
function advExtra(p){
  const x = [];
  if(S.nextRoll?.adv && (S.nextRoll.stat === '*' || S.nextRoll.stat === p.vlastnost)) x.push(S.nextRoll.nazev);
  if(p.utok && S.nextAttack?.adv && (p.utok === 'zbran' || S.nextAttack.spell)) x.push(S.nextAttack.nazev);
  return x;
}
function partInfo(x, i){
  const n = x.n;
  if(i === 0 && STAT_KEYS.some(k => statName(k) === n)) return [n, 'vlastnost'];
  let m;
  if((m = n.match(/^Zdatnost · (.+)$/))) return ['zdatnost', 'umíš ' + m[1]];
  if((m = n.match(/^Odbornost · (.+)$/))) return ['odbornost', 'mistr v ' + m[1] + ' – dvojitá zdatnost'];
  if(n === 'Zdatnost (záchrana)') return ['zdatnost', 'záchranný hod tvého povolání'];
  if(n === 'Zdatnost') return ['zdatnost', 'výcvik se zbraní'];
  if(n === 'Všeuměl') return ['všeuměl', 'bard – polovina zdatnosti'];
  if(/^Zdatnost · /.test(n)) return ['zdatnost', n.slice(11)];
  if(n === 'opotřebení') return ['opotřebení', 'poškozená zbraň'];
  if(n === 'Aura ochrany') return [n, 'paladin'];
  const c = allConds().find(z => z.nazev === n);
  if(c) return [n, c.typ === 'pozehnani' ? 'požehnání' : c.derived ? 'únava / hlad' : c.combat ? 'stav v boji' : 'stav – ' + (EFF_TYPES[c.typ]?.n || '').toLowerCase()];
  if(S.inv?.some(it => it.nazev === n)) return [n, 'výbava'];
  if(obor() && n === obor().nazev) return [n, 'specializace'];
  return [n, 'schopnost'];
}
function partsHTML(parts, small){
  return `<div class="pts${small ? ' sm' : ''}">${parts.map((x, i) => { const [n, sub] = partInfo(x, i);
    return `<span class="pt ${x.v > 0 ? 'pl' : x.v < 0 ? 'mi' : 'nu'}"><b>${fmtMod(x.v)}</b> ${esc(n)}${small ? '' : `<i>${esc(sub)}</i>`}</span>`; }).join('')}</div>`;
}
function advLine(up, down, small){
  up = up || []; down = down || [];
  if(!up.length && !down.length) return '';
  const L = a => a.map(esc).join(' · ');
  if(up.length && down.length) return `<div class="advr nul${small ? ' sm' : ''}">⚖️ <b>Výhoda i nevýhoda se ruší</b> – házíš jednou.<br><span>⬆️ ${L(up)}</span><br><span>⬇️ ${L(down)}</span></div>`;
  if(up.length) return `<div class="advr up${small ? ' sm' : ''}">⬆️ <b>Výhoda</b>${small ? '' : ' – házíš dvěma kostkami, platí ta lepší'}: ${L(up)}</div>`;
  return `<div class="advr dn${small ? ' sm' : ''}">⬇️ <b>Nevýhoda</b>${small ? '' : ' – házíš dvěma kostkami, platí ta horší'}: ${L(down)}</div>`;
}
function rollChance(bonus, dc, adv){
  const need = Math.min(20, Math.max(2, dc - bonus));
  const pr = Math.min(.95, Math.max(.05, (21 - need) / 20));
  const q = adv > 0 ? 1 - (1 - pr) ** 2 : adv < 0 ? pr * pr : pr;
  return { need, pct:Math.round(q * 100) };
}
function rollWhyHTML(p, parts, foe){
  const c = S.char, bonus = parts.reduce((a, x) => a + x.v, 0);
  const up = [...(p.advUp || []), ...advExtra(p)], down = p.advDown || [];
  const adv = up.length && down.length ? 0 : up.length ? 1 : down.length ? -1 : 0;
  const ch = rollChance(bonus, p.obtiznost, adv);
  const head = p.utok

  return `<div class="rw1">${head}</div>${p.duvod ? `<div class="rwd">${esc(p.duvod)}</div>` : ''}

    ${advLine(up, down)}
    ${p.utok ? `<div class="rwd">💥 zranění ${esc(attackInfo(p).dice)} ${fmtMod(mod(c.stats[p.vlastnost]) + attackInfo(p).bonus)}</div>` : ''}`;
}

const FOLD_OPEN = ['Atributy','Životy','Obrana'];          /* co je otevřené napoprvé */
const foldState = () => { try{ return JSON.parse(ls.get('dz_fold') || '{}'); }catch(e){ return {}; } };
function foldSheet(root){
  if(!root) return;
  const st = foldState();
  for(const rib of [...root.querySelectorAll('.rib')]){
    if(rib.classList.contains('fold')) continue;
    const k = rib.querySelector('b')?.textContent.trim() || '';
    const body = document.createElement('div'); body.className = 'ribbody';
    let n = rib.nextElementSibling;
    while(n && !n.classList.contains('rib')){ const nx = n.nextElementSibling; body.appendChild(n); n = nx; }
    rib.after(body);
    rib.classList.add('fold'); rib.dataset.act = 'fold'; rib.dataset.k = k;
    const open = st[k] ?? FOLD_OPEN.includes(k);
    rib.classList.toggle('open', !!open);
    if(!rib.querySelector('.chev')) rib.insertAdjacentHTML('beforeend', '<span class="chev">▾</span>');
  }
  if(!root.querySelector('.foldbar')) root.insertAdjacentHTML('afterbegin', `<div class="foldbar"><button data-act="foldall" data-k="open">▾ Rozbalit vše</button><button data-act="foldall" data-k="close">▸ Sbalit vše</button></div>`);
}
function toggleFold(rib){
  const st = foldState(), k = rib.dataset.k, open = !rib.classList.contains('open');

}

/* =========================================================
   OBCHOD A SMLOUVÁNÍ
   ========================================================= */
const RAR_PRICE = { bezna:1, neobvykla:4, vzacna:12, legendarni:40 };
function itemValue(it){
  if(it.cena) return it.cena;
  let v = 2;
  if(it.typ === 'zbran') v = Math.round(avgDice(it.zraneni || '1d6') * 3) + (it.bonus || 0) * 25;
  else if(it.typ === 'zbroj') v = 10 + (it.obrana || 1) ** 2 * 8 + (it.bonus || 0) * 30;
  else if(it.typ === 'stit') v = 10 + (it.bonus || 0) * 30;
  else if(it.typ === 'lektvar') v = it.leceni ? 25 : 40;
  else if(it.typ === 'svitek') v = 30;
  else if(it.typ === 'jidlo') v = 1;
  else if(it.typ === 'doplnek') v = 20 + (it.bonus || 0) * 40;
  return Math.max(1, Math.round(v * (RAR_PRICE[it.vzacnost] || 1)));
}
/* Násobitel cen: charisma, pověst v místě, vztah s obchodníkem, smlouvání, bohatý vzhled. */
function priceMod(){
  const sh = S.shop || {}, c = S.char, why = [];
  let m = 1;
  const cm = mod(c.stats.charisma); if(cm){ m -= cm * 0.03; why.push(`charisma ${fmtMod(cm)}`); }
  const r = S.rep?.[S.here]; if(r >= 20){ m -= 0.1; why.push('dobrá pověst'); } else if(r <= -20){ m += 0.2; why.push('špatná pověst'); }
  const n = S.npcs?.[sh.obchodnik]; const sk = n?.skore ?? 0;
  if(sk >= 25){ m -= 0.1; why.push('obchodník tě má rád'); } else if(sk <= -25){ m += 0.25; why.push('obchodník tě nemá rád'); }
  if(c.zlato >= 150){ m += 0.1; why.push('vypadáš zámožně'); }
  if(sh.haggle === 'ok'){ m -= 0.15; why.push('usmlouváno'); } else if(sh.haggle === 'bad'){ m += 0.1; why.push('naštval jsi ho smlouváním'); }
  if(diff() === 'kruta'){ m += 0.1; } else if(diff() === 'pribeh'){ m -= 0.1; }
  return { m:clamp(m, 0.6, 1.6), why };
}
const buyPrice = it => Math.max(1, Math.round(itemValue(it) * priceMod().m));
const sellPrice = it => Math.max(0, Math.floor(itemValue(it) * 0.5 / priceMod().m));
function openShopFrom(raw){
  if(!raw || typeof raw !== 'object') return null;
  const zbozi = arr(raw.zbozi).slice(0, 10).map(x => { const it = sanitizeItem({ vzacnost:'bezna', ...x }); if(it){ it.cena = clamp(int(x.cena) || itemValue(it), 1, 5000); } return it; }).filter(Boolean);
  if(!zbozi.length) return null;
  S.shop = { obchodnik:String(raw.obchodnik || raw.nazev || 'Obchodník').slice(0, 40), loc:S.location, zbozi, haggle:null };
  return { c:'shop', t:`🛒 ${S.shop.obchodnik}` };
}
function shopSheet(){
  const sh = S.shop; if(!sh) return;
  const pm = priceMod(), c = S.char;
  const buy = sh.zbozi.map((it, i) => { const p = buyPrice(it), can = c.zlato >= p;
    return `<div class="shrow"><span class="ico">${TYPES[it.typ].i}</span><span class="mid"><b class="${RAR[it.vzacnost].c}">${esc(it.nazev)}${it.pocet > 1 ? ' ×' + it.pocet : ''}</b><small>${esc(itemStats(it) || it.popis || TYPES[it.typ].n)}</small></span>
      <button class="shb" data-act="shopbuy" data-k="${i}" ${can ? '' : 'disabled'}>${p} zl.</button></div>`; }).join('') || '<div class="empty">Obchodník už nic nemá.</div>';
  const sell = sortItems(S.inv).map(it => { const p = sellPrice(it);
    return `<div class="shrow"><span class="ico">${TYPES[it.typ].i}</span><span class="mid"><b class="${RAR[it.vzacnost].c}">${esc(it.nazev)}${it.pocet > 1 ? ' ×' + it.pocet : ''}${isEquipped(it) ? ' <span class="badge">nasazeno</span>' : ''}</b><small>${esc(itemStats(it) || TYPES[it.typ].n)}</small></span>
      <button class="shb sell" data-act="shopsell" data-k="${it.id}" ${p > 0 ? '' : 'disabled'}>+${p} zl.</button></div>`; }).join('') || '<div class="empty">Nemáš co prodat.</div>';
  openSheet(`<h3>🛒 ${esc(sh.obchodnik)}</h3>
    <div class="shtop"><span>💰 Máš <b>${c.zlato}</b> zl.</span><span>Ceny ×${pm.m.toFixed(2)}${pm.why.length ? ' <small>(' + esc(pm.why.join(', ')) + ')</small>' : ''}</span></div>
    ${sh.haggle ? '' : `<button class="btn ghost" data-act="haggle" style="margin-top:6px">🗣️ Smlouvat o ceně (hod na charisma)</button>`}
    <div class="flbl">Koupit</div>${buy}
    <div class="flbl">Prodat</div>${sell}
    <button class="cancel" data-act="closesheet">Odejít od obchodníka</button>`);
}
function shopBuy(i){
  const sh = S.shop, it = sh?.zbozi[i]; if(!it) return;
  const p = buyPrice(it);
  if(S.char.zlato < p){ alert('Na to nemáš dost zlata.'); return; }
  if(S.inv.length >= INV_MAX && !(TYPES[it.typ].stack && S.inv.some(x => x.typ === it.typ && low(x.nazev) === low(it.nazev)))){ alert('Batoh je plný.'); return; }
  const copy = { ...it, id:newId('i') }; delete copy.cena;
  addItem(copy); S.char.zlato -= p; sh.zbozi.splice(i, 1);
  sfx('coin');
  addLog({ t:'fx', notes:[{ c:'good', t:`🛒 Koupeno: ${it.nazev} (−${p} zl.)` }] });
  hist(`Hráč koupil u obchodníka ${sh.obchodnik}: ${it.nazev} za ${p} zl. (už je v inventáři, zlato odečteno).`);
  save(); render(); shopSheet();
}
function shopSell(id){
  const it = S.inv.find(x => x.id === id); if(!it || !S.shop) return;
  const p = sellPrice(it);
  if(isEquipped(it) && !confirm(`${it.nazev} máš nasazené. Opravdu prodat?`)) return;
  takeOut(it, 1); S.char.zlato += p;
  sfx('coin');
  addLog({ t:'fx', notes:[{ c:'gold', t:`🪙 Prodáno: ${it.nazev} (+${p} zl.)` }] });
  hist(`Hráč prodal obchodníkovi ${S.shop.obchodnik}: ${it.nazev} za ${p} zl.`);
  save(); render(); shopSheet();
}
async function haggle(){
  const sh = S.shop; if(!sh || sh.haggle || rolling) return;
  closeSheet();
  rolling = true;
  const d = d20(); await diceAnim(d); rolling = false;
  const bonus = skillBonus('presvedcovani');
  const dc = 15 + (diff() === 'kruta' ? 2 : diff() === 'pribeh' ? -3 : 0);
  const total = d + bonus, ok = d === 20 || (d !== 1 && total >= dc);
  sh.haggle = ok ? 'ok' : 'bad';
  addLog({ t:'roll', title:`Smlouvání s obchodníkem ${sh.obchodnik}`, d, parts:[{ n:'Přesvědčování', v:bonus }], total, dc, dcl:'obtížnost', ok, res:ok ? 'Usmlouváno! Ceny −15 %' : 'Nevyšlo – naštval se, ceny +10 %' });
  hist(`Hráč smlouval s obchodníkem ${sh.obchodnik}: ${ok ? 'ÚSPĚCH, dá slevu 15 %' : 'NEÚSPĚCH, obchodník je dotčený a zvedl ceny o 10 %'}.`);
  save(); render(); setTimeout(shopSheet, 300);
}
const shopHere = () => S.shop && S.shop.loc === S.location && !inCombat();

/* =========================================================
   DRUŽINÍK – stálý parťák
   ========================================================= */
function setCompanion(raw){
  if(!raw || typeof raw !== 'object' || !raw.jmeno) return null;
  const lv = S.char.level;
  const hp = clamp(int(raw.hp) || 8 + lv * 5, 4, 10 + lv * 8);
  S.comp = { jmeno:String(raw.jmeno).trim().slice(0, 40), popis:String(raw.popis || '').slice(0, 160), povaha:String(raw.povaha || '').slice(0, 120),
    hp, maxHp:hp, obrana:clamp(int(raw.obrana) || 12, 9, 18), utok:clamp(int(raw.utok) || 2 + Math.ceil(lv / 2), 1, 3 + lv),
    zraneni:capDice(raw.zraneni, 20, '1d6'), down:false, since:S.time.day };
  const k = S.comp.jmeno;
  if(!S.npcs[k]) S.npcs[k] = { popis:S.comp.popis, vztah:'přátelský', skore:40 };
  else S.npcs[k].skore = Math.max(S.npcs[k].skore ?? 0, 25);
  if(portraitMode() !== 'off'){ if(libGet(k)) S.npcs[k].img ||= libGet(k); else if(portraitReady()) setTimeout(() => queuePortrait(k), 50); }
  return { c:'npc', t:`🤝 ${k} se k tobě přidává jako družiník` };
}
const compUp = () => S.comp && !S.comp.down && S.comp.hp > 0;
/* Útok družiníka – jednou za kolo, počítá kód. */
function compAttack(){
  if(!compUp() || !S.cb || !S.foes.length || S.cb.compDone === S.cb.round) return;
  S.cb.compDone = S.cb.round;
  const cp = S.comp, f = S.foes.slice().sort((a, b) => a.hp - b.hp)[0];
  const d = d20(), total = d + cp.utok, hit = d === 20 || (d !== 1 && total >= f.obrana);
  let res = 'Minul';
  if(hit){ const dmg = Math.max(1, rollDice(cp.zraneni, d === 20).total); res = `Zásah! · zranění ${dmg}`; hist(`Družiník ${cp.jmeno} zaútočil na ${f.jmeno}: ${total} proti obraně ${f.obrana} → ZÁSAH za ${dmg}. ${hurtFoe(f, dmg)}`); }
  else hist(`Družiník ${cp.jmeno} zaútočil na ${f.jmeno}: ${total} proti obraně ${f.obrana} → MINUL.`);
  addLog({ t:'roll', comp:true, title:`🤝 ${cp.jmeno} útočí na ${f.jmeno}`, d, parts:[{ n:'útok', v:cp.utok }], total, dc:f.obrana, dcl:'obrana', ok:hit, res });
}
/* Nepřítel místo hráče zaútočí na družiníka. */
function foeHitsComp(f){
  const cp = S.comp, d = d20(), total = d + f.utok, hit = d === 20 || (d !== 1 && total >= cp.obrana);
  let res = 'Minul';
  if(hit){
    const dmg = Math.max(1, rollDice(f.zraneni, d === 20).total);
    cp.hp = Math.max(0, cp.hp - dmg); res = `Zásah! ${cp.jmeno} −${dmg} HP`;
    if(cp.hp <= 0){ cp.down = true; addLog({ t:'fx', notes:[{ c:'bad', t:`🩸 ${cp.jmeno} padá k zemi – mimo boj` }] }); }
  }
  addLog({ t:'roll', enemy:true, title:`${f.jmeno} útočí na ${cp.jmeno}`, d, parts:[{ n:'útok', v:f.utok }], total, dc:cp.obrana, dcl:'obrana', ok:!hit, res });
  hist(`${f.jmeno} zaútočil na družiníka ${cp.jmeno}: ${hit ? `ZÁSAH, ${cp.jmeno} má ${cp.hp}/${cp.maxHp} HP${cp.down ? ' a padl(a) – je mimo boj, ale žije' : ''}` : 'MINUL'}.`);
}
function compAfterCombat(){
  if(S.comp?.down){ S.comp.down = false; S.comp.hp = Math.max(1, S.comp.hp); addLog({ t:'fx', notes:[{ c:'good', t:`🤝 ${S.comp.jmeno} se zvedá ze země (1 HP)` }] }); hist(`Družiník ${S.comp.jmeno} se po boji zvedl s 1 HP.`); }
}
function compLeaves(why){
  if(!S.comp) return null;
  const k = S.comp.jmeno; S.comp = null;
  hist(`Družiník ${k} odešel: ${why}.`);
  return { c:'bad', t:`🚶 ${k} odchází: ${String(why).slice(0, 80)}` };
}
function compHTML(){
  const cp = S.comp; if(!cp) return '';
  const n = S.npcs[cp.jmeno] || {}, sk = n.skore ?? 0;
  return `<div class="comprow">${n.img ? `<button class="npcp" data-npcpic="${esc(cp.jmeno)}">${portraitImg(n, 'npcpic')}</button>` : '<span class="npcp none">🤝</span>'}
    <div class="npcm"><b>${esc(cp.jmeno)} <span class="tag npc" style="color:${relColor(sk)}">${esc(relLabel(sk))}</span></b><small>${esc(cp.popis)}${cp.povaha ? ' · ' + esc(cp.povaha) : ''}</small>
    <div class="compst">${cp.down ? '🩸 mimo boj' : `❤️ ${cp.hp}/${cp.maxHp}`} · 🛡️ ${cp.obrana} · ⚔️ +${cp.utok} · ${esc(cp.zraneni)}</div>
    <div class="hpbar"><div style="width:${100 * cp.hp / cp.maxHp}%"></div></div></div></div>`;
}

/* =========================================================
   RYCHLOST – vykresluje se jen konec kroniky
   ========================================================= */
let logWindow = 120;

const INTRUDERS = {
  mesto:['městská stráž, která někoho hledá','opilec, který se chce dát do řeči nebo do rvačky','posel s naléhavou zprávou pro někoho z přítomných','kapsář, který se tváří nenápadně','potulný bard, co hledá příběhy','obchodník, který něco nabízí','žebrák, který ví víc, než by měl','dítě, které něco vidělo','kněz nebo poutník s prosbou','starý známý hráče, kterého nečekal','výběrčí daní nebo úředník','žena v kápi, která si hráče prohlíží'],
  divocina:['lovec nebo stopař','poutník, který zabloudil','uprchlík pronásledovaný někým','bylinkářka sbírající byliny','zraněný voják','tajemný cizinec u ohně','skupinka obchodníků, co táboří opodál','zvíře, které se chová podivně'],
  more:['opilý námořník','pašerák s nabídkou','přístavní stráž','mořská čarodějnice v převleku','mladý plavčík, co utekl z lodi','kapitán, který shání posádku']
};
function rollIntruder(){
  if(!S || S.foes.length || S.travel || S.dying || S.dead || S.pending) return null;
  if(S.turn - (S.lastIntr ?? -99) < 6 || Math.random() > 0.14) return null;
  const pool = S.setting === 'piratska' && /přístav|pajzl|loď|pláž|bradl|kormid|ostrov/i.test(S.location) ? INTRUDERS.more : indoors() || /ves|měst|brod|osad|tržišt|náměst|ulic|hostin/i.test(S.location) ? INTRUDERS.mesto : INTRUDERS.divocina;
  S.lastIntr = S.turn;
  return pool[Math.floor(Math.random() * pool.length)];
}
async function callDM(input){
  if(busy) return;
  busy = true; S.lastFailed = null; render();
  takeSnap(input);
  lastStreamed = false; liveText = '';
  if(input && input.typ === 'hod' && S.finisherNext){ input = { ...input, dokonceni:S.finisherNext }; S.finisher = S.finisherNext; S.finisherNext = null; }
  else if(input && input.typ === 'akce' && S.finisher) input = { ...input, finisherFor:S.finisher };
  if(input && input.typ === 'akce' && !input.vyrus && !input.oprava){ const v = rollIntruder(); if(v) input = { ...input, vyrus:v }; }
  if(input && ['akce','prichod'].includes(input.typ) && !input.oprava){
    const w = worldTick(); if(w) input = { ...input, svet:w };
    if(input.typ === 'akce'){ const h = pacingHint(); if(h) input = { ...input, rezie:h }; }
  }
  if(input && input.typ === 'akce' && !S.foes.length && !input.riziko){ const r = riskyStat(input.text); if(r) input = { ...input, riziko:r }; }
  S.curText = input && input.text ? String(input.text) : '';
  const bgSum = S.history.length >= SUMMARY_AT && bgMistral() && !S._sumFail;
  const needSummary = S.history.length >= SUMMARY_AT && !bgSum;
  const req = { stav:publicState(), shrnuti:S.summary, historie:S.history.slice(-HIST_SEND), vstup:input, potrebaShrnuti:needSummary };
  try{
    let res = isDemo() ? await mockDM(req) : input && input.typ === 'prichod' ? await fetchBg(req) : await fetchDM(req);
    if(needForcedRoll(input, res)){
      /* AI riskantní akci vyhodnotila bez hodu → odpověď zahodíme a necháme ji napsat znovu, tentokrát s hodem */
      liveText = ''; lastStreamed = false; document.getElementById('liveDM')?.remove();
      input = { ...input, vynutit:input.riziko };
      const req2 = { ...req, vstup:input };
      const res2 = isDemo() ? await mockDM(req2) : await fetchDM(req2);
      if(res2 && res2.vypraveni) res = res2;
    }
    applyResponse(res, needSummary, input);
    if(input && input.finisherFor) S.finisher = null;
    if(bgSum && !S._sumBusy) bgSummary();
  }catch(e){
    S.lastFailed = input;
    addLog({ t:'err', text:'Pán jeskyně se odmlčel (' + e.message + ').' });
  }finally{
    busy = false; liveText = ''; render(); save();
    runQueue();
  }
}
/* Navazující volání (popis cesty, náhodná událost) – spustí se samo, jen když hráč nemusí nic řešit. */
function runQueue(){
  if(!S || !S.queue || busy) return;
  if(S.dead || S.pending || S.loot || S.lastFailed){ if(!S.lastFailed) S.queue = null; return; }
  const q = S.queue; S.queue = null;
  setTimeout(() => callDM(q), 350);
}

/* =========================================================
   ZPRACOVÁNÍ ODPOVĚDI – kód hlídá pravidla, AI jen navrhuje
   ========================================================= */
const hist = text => S.history.push({ kdo:'system', text });
let scrollNew = false;

function applyResponse(res, needSummary, input = {}){
  const text = String(res.vypraveni || '').trim() || '…';
  S.turn++;
  S.history.push({ kdo:'pj', text });
  addLog({ t:'dm', text, anim:twOn() && !lastStreamed || undefined, turn:S.turn, ...(S.lastSonnet === S.turn ? { star:1 } : {}) });
  book('pj', text);
  if(ttsOn()) speak(text);
  scrollNew = true;
  const ef = res.efekty && typeof res.efekty === 'object' ? res.efekty : {};
  applyEffects(ef);
  if(int(ef.xp) > 0) grantXP(clamp(int(ef.xp), 0, 200), 'za tvé činy');
  offerLoot(ef.nalezeno);
  if(S.startCombatPending){ const pv = S.startCombatPending; S.startCombatPending = null; startCombat(pv === 'zadne' ? null : pv); }
  applyCombatConds(ef.stav_boje);
  /* kolo: v prvním kole útočí jen ti, kdo mají vyšší iniciativu než hráč */
  let attackers = arr(ef.utoci);
  if(S.cb?.first){
    attackers = S.foes.filter(f => (f.ini ?? 0) > S.cb.pIni && !f.st.neschopen).map(f => f.jmeno);
    if(attackers.length) addLog({ t:'sys', text:'⚡ Nepřátelé jsou rychlejší – útočí jako první.' });
  }
  compAttack();
  foeAttacks(attackers);
  S.suggestions = arr(res.navrhy).slice(0,4).map(x => String(x).slice(0,70)).filter(x => x.trim());
  setPending(res.zkouska);
  if(S.cb){ if(!S.foes.length) endCombat(); else if(!S.pending) newPlayerTurn(); }
  if(needSummary && res.kapitola){
    S.kapitoly ||= [];
    S.kapitoly.push({ t:String(res.kapitola).trim().slice(0,320), d:S.time.day });
    if(S.kapitoly.length > 30) S.kapitoly = [{ t:S.kapitoly.slice(0, S.kapitoly.length - 29).map(k => k.t).join(' ').slice(0,600), d:S.kapitoly[0].d }, ...S.kapitoly.slice(-29)];
  }
  if(needSummary && res.shrnuti){
    S.summary = String(res.shrnuti).slice(0,3200);
    S.history = S.history.slice(-KEEP_AFTER_SUMMARY);
  }
  checkDeath();
  if(!S.dead && !S.dying) passTime(ef, input);
  checkDeath();
}

/* Čas, spánek a cestování podle odpovědi AI. Náhodu hází kód. */
function passTime(ef, input){
  const auto = ['prichod','udalost','noc','bezvedomi'].includes(input.typ);   /* čas už posunula hra */
  const cesta = !auto && ef.cesta && typeof ef.cesta === 'object' && String(ef.cesta.cil || '').trim() && !S.foes.length;
  const sp = !auto && ef.spanek && typeof ef.spanek === 'object' && !S.foes.length ? ef.spanek : null;

  if(cesta){
    const cil = String(ef.cesta.cil).trim().slice(0,80), danger = ['nizke','stredni','vysoke'].includes(ef.cesta.nebezpeci) ? ef.cesta.nebezpeci : 'stredni';
    let hodiny = clamp(Number(ef.cesta.hodiny) || 2, 0.5, 48);
    const M = S.mount ? MOUNTS[S.mount.typ] : null, w = wx(), lr = loadRatio();
    hodiny = Math.round(hodiny * (wildOk() ? 1 : w.travel) * (M ? M.travel : 1) * (!M && species().rychlost > 30 ? 0.9 : 1) * (lr > 1.5 ? 1.6 : lr > 1 ? 1.3 : 1) * 10) / 10;
    const ev = rollTravelEvent(danger);
    if(ev?.hodiny) hodiny += ev.hodiny;
    if(ev?.unava) S.needs.unava = Math.min(100, S.needs.unava + ev.unava);
    S.travel = { cil, from:S.here, hodiny, danger };
    const why = [w.travel > 1 && !wildOk() ? `${w.i} ${w.n.toLowerCase()} zdržuje` : '', M ? `${M.i} ${M.n.toLowerCase()}` : '', lr > 1 ? '🏋️ přetížený' : ''].filter(Boolean).join(', ');
    addLog({ t:'sys', text:`🧭 Cesta do: ${cil} · ${fmtHours(hodiny)}${why ? ' (' + why + ')' : ''}` });
    book('sys', `Vydal se na cestu do ${cil}.`);
    /* počasí unavuje víc, kůň méně */
    S.needs.unava = clamp(S.needs.unava + hodiny * ((wildOk() ? 0 : w.unava || 0) - (M ? 4 * (1 - M.unava) : 0)), 0, 100);
    exposure(hodiny);
    if(ev){
      const part = Math.round(hodiny * (0.35 + Math.random() * 0.3) * 10) / 10;   /* událost přijde někde v půlce cesty */
      advanceTime(part, false);
      S.travel.zbyva = Math.round((hodiny - part) * 10) / 10;
      addLog({ t:'sys', text:'⚠️ Na cestě se něco děje…' });
      hist(`Hráč vyrazil do ${cil}. Náhodná událost na cestě (${ev.k}).`);
      S.queue = { typ:'udalost', cil, popis:ev.t, cas:timeStr() };
    }else{
      advanceTime(hodiny, false);
      hist(`Hráč cestoval ${fmtHours(hodiny)} do ${cil} bez nehod.`);
      S.queue = { typ:'prichod', cil, hodiny:Math.round(hodiny * 10) / 10, cas:timeStr() };
    }
    return;
  }

  if(sp){
    const hodiny = clamp(Number(sp.hodiny) || 8, 1, 14), safe = sp.bezpecne !== false;
    const ev = !safe && Math.random() < (isNight() || hodiny >= 6 ? 0.35 : 0.2) ? pickWeighted(NIGHT_EVENTS) : null;
    if(ev){
      const slept = Math.max(1, Math.floor(1 + Math.random() * (hodiny - 1)));
      advanceTime(slept, true);
      exposure(slept);
      if(slept >= (species().trans ? 4 : 6)){ rechargeAbilities(); addLog({ t:'fx', notes:[{ c:'good', t:'✨ Schopnosti obnoveny' }] }); }
      addLog({ t:'sys', text:`💤 Spal jsi ${slept} h… a pak tě něco vzbudilo.` });
      hist(`Hráč spal ${slept} h na nebezpečném místě a byl vzbuzen (${ev.k}).`);
      S.queue = { typ:'noc', hodiny:slept, popis:ev.t, cas:timeStr() };
    }else{
      const r = advanceTime(hodiny, true);
      if(!safe) exposure(hodiny);
      addLog({ t:'sys', text:`💤 Spal jsi ${hodiny} h${safe ? '' : ' a nikdo tě nerušil'}. Je ${timeStr()}.` });
      if(CLASSES[S.char.cls].caster === 'pact' && hodiny >= 1 && hodiny < (species().trans ? 4 : 6)){ S.slots = slotMax(); addLog({ t:'fx', notes:[{ c:'good', t:'👁️ Sloty paktu obnoveny' }] }); }
      if(hodiny >= (species().trans ? 4 : 6)){ rechargeAbilities(); addLog({ t:'fx', notes:[{ c:'good', t:'✨ Schopnosti obnoveny' }] }); hist('Spánkem se hráči obnovily všechny schopnosti a sloty kouzel.'); }
      hist(`Hráč se vyspal (${hodiny} h${safe ? '' : ', noc venku proběhla klidně'}). Je ${timeStr()}, uzdravil se o ${r.healed} HP, únava ${Math.round(S.needs.unava)}/100.`);
    }
    return;
  }

  if(S.arriveH){ const z = S.arriveH; S.arriveH = 0; advanceTime(z, false); if(auto) return; }   /* zbytek cesty po události */
  if(!auto){
    const h = ef.cas_hodiny === undefined || ef.cas_hodiny === null || ef.cas_hodiny === '' ? 1/6 : clamp(Number(ef.cas_hodiny) || 0, 0, 12);
    if(h) advanceTime(h, false);
  }
}

function checkDeath(){
  if(S.char.hp > 0 || S.dead || S.dying) return;
  if(species().relentless && !S.relentlessUsed){
    S.relentlessUsed = true; S.char.hp = 1;
    addLog({ t:'fx', notes:[{ c:'good', t:'💪 Nezlomnost: místo pádu zůstáváš na 1 HP' }] });
    hist('Hráč (ork) měl padnout, ale díky Nezlomnosti zůstal stát s 1 HP (jednou za odpočinek).');
    return;
  }
  startDying();
}

/* Úkol může od AI přijít jako text i jako objekt – sjednotit. */
function normQuest(x){
  if(!x) return null;
  if(typeof x === 'object'){
    const title = String(x.nazev || x.title || x.ukol || x.jmeno || x.popis || '').trim().slice(0,120);
    return title && title !== '[object Object]' ? { title, popis:String(x.popis && x.popis !== title ? x.popis : '').trim().slice(0,240), done:!!x.done } : null;
  }
  const title = String(x).trim().slice(0,120);
  return title && title !== '[object Object]' ? { title, popis:'', done:false } : null;
}

function applyEffects(ef){
  const notes = [], c = S.char;

  if(ef.konec_boje && S.foes.length){ S.foes = []; endCombat(); notes.push({ c:'loc', t:'🏳️ Boj skončil' }); }
  const hadFoes = S.foes.length;
  const fresh = new Set();
  for(const raw of arr(ef.nepratele).slice(0,6)){
    if(S.foes.length >= 6) break;
    const f = sanitizeFoe(raw, fresh);
    if(f){ S.foes.push(f); fresh.add(f.id); notes.push({ c:'foe', t:`👹 ${f.jmeno}` }); }
  }
  if(S.foes.length && (!hadFoes || !S.cb)) S.startCombatPending = ['hrac','nepratele'].includes(ef.prekvapeni) ? ef.prekvapeni : 'zadne';
  else if(S.foes.length) joinCombat();

  let hp = clamp(int(ef.hp), -30, 30);
  if(hp < 0 && c.temp){ const ab = Math.min(c.temp, -hp); c.temp -= ab; hp += ab; if(ab) notes.push({ c:'good', t:`🛡️ ${ab} pohltily dočasné životy` }); }
  if(hp){ const b = c.hp; c.hp = clamp(b + hp, 0, c.maxHp); const d = c.hp - b; if(d) notes.push({ c:d>0?'good':'bad', t:(d>0?'+':'') + d + ' HP' }); if(hp < 0) concCheck(-hp); }

  /* Peníze a přidané věci – nákup bez dostatku zlata neproběhne vůbec. */
  const g = clamp(int(ef.zlato), -5000, 5000);
  const gifts = arr(ef.pridat).slice(0,5);
  if(g < 0 && c.zlato + g < 0){
    notes.push({ c:'bad', t:`💰 Nemáš dost zlata (chybí ${-(c.zlato + g)})` });
    hist(`Transakce se NEUSKUTEČNILA: hráč má jen ${c.zlato} zl., potřeboval ${-g} zl. Nic nezaplatil a nic nedostal.`);
  }else{
    if(g){ c.zlato += g; notes.push({ c:g>0?'gold':'bad', t:(g>0?'+':'') + g + ' zl.' }); sfx('coin'); }
    const jz = ef.jezdecke;
    if(jz && typeof jz === 'object' && MOUNTS[jz.typ]){ S.mount = { typ:jz.typ, nazev:String(jz.nazev || MOUNTS[jz.typ].n).slice(0,30) }; notes.push({ c:'good', t:`${MOUNTS[jz.typ].i} ${S.mount.nazev}` }); }
    else if(jz === 'ztraceno' || jz === 'ztracen' || jz === 'zadne'){ if(S.mount) notes.push({ c:'bad', t:`− ${S.mount.nazev}` }); S.mount = null; }
    const op = ef.oprava;
    if(op){
      const list = op === 'vse' || (Array.isArray(op) && op.includes('vse')) ? S.inv.filter(i => wearOf(i) < 100 && ['zbran','zbroj','stit'].includes(i.typ)) : arr(op).map(findItem).filter(Boolean);
      for(const it of list){ if(wearOf(it) < 100){ it.stav = 100; notes.push({ c:'good', t:`🔨 Opraveno: ${it.nazev}` }); } }
    }
    for(const raw of gifts){

function takeLoot(mode){

}

function setPending(z){
  S.pending = null;
  if(!z || typeof z !== 'object' || S.dead) return;
  let utok = ['zbran','kouzlo'].includes(z.utok) ? z.utok : null;
  if(utok === 'kouzlo' && !spell()) utok = 'zbran';
  let vl = z.vlastnost, foe = null, dc = clamp((int(z.obtiznost) || 12) + (z.utok ? 0 : diff() === 'pribeh' ? -2 : diff() === 'kruta' ? 2 : 0), 5, 30);

    vl = utok === 'kouzlo' ? spell().vlastnost : (w ? w.vlastnost : fists().stat);
    foe = findFoe(z.cil) || S.foes[0] || null;
    if(foe) dc = foe.obrana;
  }
  /* dovednost, záchranný hod, nástroj */
  let dov = null, zach = false, nas = null;
  if(!utok){

  const proti = ['jed','strach','kouzlo','spanek','nemoc','kletba'].includes(z.proti) ? z.proti : null;
  /* výhoda a nevýhoda s důvody (D&D: jakákoli výhoda + jakákoli nevýhoda se ruší) */
  const up = [], down = [], why = String(z.proc || z.duvod_vyhody || '').trim().slice(0, 70);
  if(z.vyhoda) up.push(why || 'situace ti nahrává');

  if(hasAdvAgainst(proti, vl)) up.push(`${(species().adv || []).includes(proti) ? species().nazev : obor()?.nazev || 'tvůj původ'} – odolnost proti ${PROTI_N[proti] || proti}`);

  if(utok){
    if(pc().srazen) down.push('ležíš na zemi');
    if(pc().skryty) up.push('jsi skrytý – nepřítel tě nevidí');
    if(foe){ const rg = utok === 'kouzlo' || isRanged(usableWeapon());
      if(foe.st?.srazen) (rg ? down : up).push(rg ? `${foe.jmeno} leží – na dálku se trefuješ hůř` : `${foe.jmeno} leží na zemi`);
      if(foe.vex) up.push(`${foe.jmeno} je rozhozený tvým předchozím útokem`); }
  }
  let [wa, ww] = weatherAdv(vl, utok, utok === 'zbran' && isRanged(usableWeapon()));
  if(wa < 0 && utok === 'zbran' && isRanged(usableWeapon()) && featHas('ostrostrelec')) wa = 0;
  if(wa > 0) up.push(WX_WHY[ww] || ww); if(wa < 0) down.push(WX_WHY[ww] || ww);
  if(nas && dov && profSkills().has(dov)) up.push(`umíš dovednost i nástroj (${nas})`);
  let adv = up.length && down.length ? 0 : up.length ? 1 : down.length ? -1 : 0;
  S.pending = { vlastnost:vl, obtiznost:dc, duvod:String(z.duvod || '').slice(0,100), utok, cilId:foe ? foe.id : null, proti, adv, advUp:up, advDown:down, wxWhy:wa ? ww : '', dovednost:dov, zachrana:zach, nastroj:nas };
}

function rollParts(p){
  const parts = [{ n:statName(p.vlastnost), v:mod(S.char.stats[p.vlastnost]) }];
  const w = usableWeapon();
  if(p.utok) parts.push({ n:'Zdatnost', v:profBonus() });
  if(p.utok === 'zbran' && w && w.bonus) parts.push({ n:w.nazev, v:w.bonus });
  if(p.utok === 'zbran' && w && wearPenalty(w)) parts.push({ n:'opotřebení', v:-wearPenalty(w) });
  if(p.utok === 'zbran' && S.nextAttack?.hit) parts.push({ n:S.nextAttack.nazev, v:S.nextAttack.hit });
  if(S.nextRoll && S.nextRoll.v && (S.nextRoll.stat === p.vlastnost || S.nextRoll.stat === '*') && !(S.nextRoll.checkOnly && p.utok)) parts.push({ n:S.nextRoll.nazev, v:S.nextRoll.v });
  if(p.utok && S.nextAttack?.spell && p.utok === 'kouzlo' && S.nextAttack.hit) parts.push({ n:S.nextAttack.nazev, v:S.nextAttack.hit });
  if(p.utok && S.char.level >= 3 && perk('attackBonus')) parts.push({ n:obor().nazev, v:perk('attackBonus') });
  if(!p.utok){
    const pb = profBonus();
    if(p.zachrana){ if(saveProf(p.vlastnost)) parts.push({ n:'Zdatnost (záchrana)', v:pb }); }
    else if(p.dovednost){
      if(expertSkills().has(p.dovednost)) parts.push({ n:'Odbornost · ' + skillName(p.dovednost), v:2 * pb, k:'prof' });
      else if(profSkills().has(p.dovednost)) parts.push({ n:'Zdatnost · ' + skillName(p.dovednost), v:pb, k:'prof' });
      else if(jackOfAll()) parts.push({ n:'Všeuměl', v:Math.floor(pb / 2), k:'prof' });
    }
    if(p.nastroj && !(p.dovednost && profSkills().has(p.dovednost))) parts.push({ n:'Zdatnost · ' + p.nastroj, v:pb });
    const sb = S.char.level >= 3 ? perk('statBonus') : null;
    if(sb && (sb[p.vlastnost] || sb.vse)) parts.push({ n:obor().nazev, v:(sb[p.vlastnost] || 0) + (sb.vse || 0) });
    if((p.zachrana || p.proti) && S.char.cls === 'paladin' && S.char.level >= 6) parts.push({ n:'Aura ochrany', v:Math.max(1, mod(S.char.stats.charisma)) });
  }
  const g = gearBonus(p.vlastnost);
  if(g) parts.push(g);
  return parts.concat(condParts(p.vlastnost, !!p.utok));
}
function attackInfo(p){

const partsText = parts => parts.map(x => `${fmtMod(x.v)} ${x.n}`).join(' ');


/* Hod kostkami zranění `mult`-krát (kritický zásah, Mocný úder), bonus se přičte jednou. */
function rollDiceMult(str, mult){
  const d = parseDice(str) || { n:1, s:4, p:0 };
  let t = 0;
  for(let i = 0; i < d.n * mult; i++) t += 1 + Math.floor(Math.random() * d.s);
  return Math.max(0, t + d.p);
}
let rolling = false;

    const dmg = Math.max(1, rollDiceMult(a.dice, mult) + sm + a.bonus + extra) + fxd;

    popis += ` Zranění ${dmg} (${a.dice}${mult > 1 ? ' ×' + mult + ' kostky' : ''} ${fmtMod(sm)}${a.bonus ? ' ' + fmtMod(a.bonus) : ''}${extra ? ' +' + extra + ' ' + na.nazev : ''}${fxn.length ? ' ' + fxn.join(' ') : ''}).`;
    sfx('clash');
    popis += foe ? ' ' + hurtFoe(foe, dmg) : ' (cíl není ve hře sledovaný – vyprávěj účinek přiměřeně.)';
    if(foe && foe.hp === 0 && isBossFoe(foe) && ls.get('dz_finisher') !== 'off'){ S.finisherNext = foe.jmeno; }
  }else if(p.utok) sfx('miss');
  if(p.utok){ delete pc().skryty; if(foe) delete foe.vex; }
  if(p.utok === 'zbran'){
    const mt = applyMastery(weaponMastery(usableWeapon()), ok, foe, a.dice, mod(S.char.stats[p.vlastnost]), d);
    if(mt) popis += ' ' + mt;
    if(CLASSES[S.char.cls].martial && S.char.level >= 5 && S.foes.length) popis += ' ' + extraAttack(foe);
    if(S.char.cls === 'valecnik' && S.char.level >= 11 && S.foes.length) popis += ' ' + extraAttack(foe);
    if(S.char.cls === 'valecnik' && S.char.level >= 20 && S.foes.length) popis += ' ' + extraAttack(foe);
  }
  if(p.hide){ if(ok){ pc().skryty = true; addLog({ t:'fx', notes:[{ c:'good', t:'🫥 Jsi skrytý' }] }); popis += ' Hráč je teď SKRYTÝ (příští útok s výhodou, útoky na něj s nevýhodou).'; } else popis += ' Nepřátelé ho dál vidí.'; }
  if(p.escape && ok){ delete pc().uchopen; addLog({ t:'fx', notes:[{ c:'good', t:'🔓 Vyprostil ses' }] }); popis += ' Hráč se vyprostil ze sevření.'; }
  if(p.utok === 'zbran') wear(usableWeapon(), d === 1 ? 8 : 1 + (Math.random() < 0.5 ? 1 : 0));
  hist(popis);
  callDM({ typ:'hod', popis });
}

/* =========================================================
   AKCE HRÁČE A PRÁCE S PŘEDMĚTY
   ========================================================= */
const canAct = () => S && !busy && !S.pending && !S.loot && !S.dead && !S.queue && !S.dying;

/* Kontrola inventáře: když hráč napíše, že použije/vytáhne/vypije… věc, kterou nemá, hra to AI výslovně řekne. */
const fold = t => low(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const ITEM_VERB = /\b(pouziju|pouziji|pouzij|vypiju|vypiji|vytahnu|vytahnu si|vytahuju|vyndam|nasadim|navleknu|obleknu|pripnu|hodim|vrhnu|mrstim|zapalim|rozsvitim|prectu|snim|sniju|zahraju na|zatroubim na|nabidnu mu|nabidnu ji|nabidnu|daruju|dam mu|dam ji|ukazu mu|ukazu ji|ukazu|vystrelim z|strelim z|odemknu|pacim|pripravim si|natru|obvazu)\s+([^.,;!?]+)/g;
const SKIP_W = /^(ho|ji|je|to|ten|ta|tu|tom|svuj|svou|svoje|svym|svymi|si|se|mu|jim|na|do|z|ze|s|se|proti|a|pak|hned|rychle|opatrne|jeho|jeji|jejich|vsechno|vse|neco|nejaky|nejakou|nejake|posledni|cely|celou|tento|tuto|toto|ruce|ruku|rukou|pest|pesti|nohu|hlas|oci|kouzlo|schopnost|plan|lest|trik|odvahu|silu|vsechnu|dvere|zamek|okno|bednu|truhlu)$/;
const ITEM_SYN = { zbran:'zbran mec sekera dyka luk kuse kopi palcat hul', zbroj:'zbroj brneni kosile', stit:'stit puklir', lektvar:'lektvar napoj elixir lahvicka', svitek:'svitek svitky', jidlo:'jidlo zasoby chleba chleb maso syr davku', doplnek:'prsten amulet nahrdelnik', ostatni:'' };
function missingItems(text){
  if(!S) return [];
  const T = fold(text), out = [];
  const have = new Set();
  for(const it of S.inv){ for(const w of fold(it.nazev + ' ' + (ITEM_SYN[it.typ] || '')).split(/[^a-z0-9]+/)) if(w.length >= 3) have.add(w.slice(0, 4)); }
  if(S.char.zlato > 0) for(const w of ['zlat','penez','penize','minc','mesec']) have.add(w.slice(0, 4));
  for(const a of knownAbilities ? knownAbilities() : []) for(const w of fold(a.nazev).split(/[^a-z0-9]+/)) if(w.length >= 3) have.add(w.slice(0, 4));
  const sp = spell(); if(sp) for(const w of fold(sp.nazev).split(/[^a-z0-9]+/)) if(w.length >= 3) have.add(w.slice(0, 4));
  let m; ITEM_VERB.lastIndex = 0;
  while((m = ITEM_VERB.exec(T))){
    /* úsek za slovesem: přeskoč úvodní zájmena/předložky („po něm“), pak ber slova do první spojky či předložky */
    const PREP = /^(a|i|na|s|se|do|po|z|ze|k|ke|proti|u|v|ve|za|pred|pod|nad|mezi|aby|kdyz|nebo|pak|abych)$/;
    const PRON = /^(nem|ni|nej|nemu|ho|mu|ji|je|jim|si|se|to|ten|ta|tu|svuj|svou|svoje|svym|jeho|jeji|jejich)$/;
    const raw = m[2].split(/\s+/).filter(Boolean), st0 = m.index + m[0].length - m[2].length;
    let i = 0; while(i < raw.length && (PREP.test(raw[i]) || PRON.test(raw[i]))) i++;
    const words = []; for(; i < raw.length && words.length < 3; i++){ if(PREP.test(raw[i])) break; if(!SKIP_W.test(raw[i])) words.push(raw[i]); }
    if(!words.length || words.every(w => w.length < 3)) continue;
    if(words.some(w => w.length >= 3 && have.has(w.slice(0, 4)))) continue;
    /* stejná slova v původním textu (fold() nemění délku) */
    const origAll = String(text).substr(st0, m[2].length).split(/\s+/).filter(Boolean);
    const orig = words.map(w => origAll[raw.indexOf(w)] || w).slice(0, 2).join(' ').replace(/[„“"]/g, '');
    if(!out.includes(orig)) out.push(orig);
  }
  return out.slice(0, 3);
}
function act(text, shown){
  text = String(text || '').trim().slice(0,500);
  if(!text || !canAct()) return;
  twFinish(); stopSpeak();
  addLog({ t:'player', text:shown || text });
  book('hrac', shown || text);
  const miss = missingItems(text);
  if(miss.length){
    addLog({ t:'fx', notes:miss.map(x => ({ c:'bad', t:`🎒 V batohu nic jako „${x}“ nemáš` })) });
    text += ` [HRA: hráč NEMÁ v inventáři nic jako ${miss.map(x => '„' + x + '“').join(', ')} (ověřeno hrou). Pokud to není věc z okolí, která tam ve scéně opravdu je, v příběhu ji použít nemůže – akci odmítni nebo popiš, že ji nenašel.]`;
  }
  S.history.push({ kdo:'hrac', text });
  $('#input').value = ''; autosize();
  callDM({ typ:'akce', text });
}

function equipItem(id){
  const it = S.inv.find(x => x.id === id);
  if(!it || busy || S.dead || !TYPES[it.typ].slot) return;
  const slot = TYPES[it.typ].slot, prev = equipped(slot);
  S.equip[slot] = it.id;
  hist(`Hráč si nasadil: ${it.nazev}${prev ? ` (místo ${prev.nazev})` : ''}.`);
  addLog({ t:'fx', notes:[{ c:'good', t:`${TYPES[it.typ].i} Nasazeno: ${it.nazev}` }] });
  render(); save();
}
function unequip(slot){
  const it = equipped(slot);
  if(!it || busy || S.dead) return;
  S.equip[slot] = null;
  hist(`Hráč si sundal: ${it.nazev}.`);
  render(); save();
}
function dropItem(id){
  const it = S.inv.find(x => x.id === id);
  if(!it || busy || S.dead) return;
  if(!confirm(`Zahodit ${it.nazev}${it.pocet > 1 ? ' (všech ' + it.pocet + ' ks)' : ''}?`)) return;
  takeOut(it, it.pocet);
  hist(`Hráč zahodil: ${it.nazev}${it.pocet > 1 ? ' ×' + it.pocet : ''}.`);
  addLog({ t:'fx', notes:[{ c:'bad', t:'− ' + it.nazev }] });
  render(); save();
}

async function useItem(id){
  const it = S.inv.find(x => x.id === id);
  if(!it || !canAct()) return;
  const c = S.char;
  if(it.typ === 'lektvar'){
    if(it.leceni && !it.efekt && c.hp >= c.maxHp && !confirm(`Máš plné životy (${c.hp}/${c.maxHp}). Opravdu vypít ${it.nazev}?`)) return;
    closeDrawer();
    if(it.leceni){
      const b = c.hp, r = rollDice(it.leceni);
      c.hp = Math.min(c.maxHp, c.hp + r.total);
      takeOut(it);
      addLog({ t:'fx', notes:[{ c:'good', t:`🧪 +${c.hp - b} HP` }] });
      return act(`Vypiju ${it.nazev}. [HRA: vyléčeno ${c.hp - b} HP (hod ${it.leceni} = ${r.total}), hráč má teď ${c.hp}/${c.maxHp} HP]`, `🧪 Vypiju ${it.nazev}`);
    }
    takeOut(it);
    return act(`Vypiju ${it.nazev}. [HRA: lektvar spotřebován, účinek: ${it.efekt}. Vyprávěj ho.]`, `🧪 Vypiju ${it.nazev}`);
  }
  if(it.typ === 'svitek'){
    if(it.zraneni && S.foes.length){
      const foe = S.foes.length === 1 ? S.foes[0]
        : await pick(`Na koho použít ${it.nazev}?`, S.foes.map(f => ({ label:`${f.jmeno} (${f.hp}/${f.maxHp} HP)`, value:f })));
      if(!foe || !canAct() || !S.inv.includes(it)) return;
      closeDrawer();
      const dmg = Math.max(1, rollDice(it.zraneni).total);
      takeOut(it);
      const txt = hurtFoe(foe, dmg);
      return act(`Použiju ${it.nazev} na ${foe.jmeno}. [HRA: svitek zasáhl za ${dmg} zranění. ${txt}]`, `📜 ${it.nazev} → ${foe.jmeno}`);
    }
    closeDrawer();
    takeOut(it);
    return act(`Přečtu ${it.nazev}. [HRA: svitek spotřebován${it.zraneni ? ', ale není tu žádný nepřítel – útočné kouzlo vyšumí naprázdno' : ', účinek: ' + it.efekt}.]`, `📜 Přečtu ${it.nazev}`);
  }
  if(it.typ === 'jidlo'){
    if(S.needs.hlad < 15 && !confirm(`Nemáš hlad. Opravdu teď jíst ${it.nazev}?`)) return;
    closeDrawer();
    const b = S.needs.hlad;
    S.needs.hlad = Math.max(0, b - 50);
    takeOut(it);
    addLog({ t:'fx', notes:[{ c:'good', t:`🍖 Hlad ${Math.round(b)} → ${Math.round(S.needs.hlad)}` }] });
    return act(`Najím se (${it.nazev}). [HRA: hlad klesl z ${Math.round(b)} na ${Math.round(S.needs.hlad)}/100. Jídlo trvá chvíli – "cas_hodiny": 0.5]`, `🍖 Najím se`);
  }
  /* Ostatní: připraví text, hráč ho doplní. */
  closeDrawer();
  $('#input').value = `Použiju ${it.nazev} `; autosize(); $('#input').focus();
}

/* ---------- Výběr z možností (cíl apod.) ---------- */
let pickResolve = null;
let detailId = null;
function openSheet(html, rc){
  const sh = $('#sheet');
  sh.className = 'sheet ' + (rc || '');
  sh.innerHTML = '<div class="grip"></div>' + html;
  sh.scrollTop = 0;
  requestAnimationFrame(() => { sh.classList.add('on'); $('#sheetShade').classList.add('on'); });
}
function closeSheet(){
  $('#sheet').classList.remove('on'); $('#sheetShade').classList.remove('on');
  detailId = null;
  if(pickResolve){ const r = pickResolve; pickResolve = null; r(null); }
}
function pick(title, options){
  closeSheet();
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3>${options.map((o,i) => `<button class="opt" data-pick="${i}">${esc(o.label)}</button>`).join('')}<button class="cancel" data-pick="-1">Zrušit</button>`);
    $('#sheet')._opts = options;
    pickResolve = res;
  });
}
$('#sheet').onclick = e => {
  const p = e.target.closest('[data-pick]');
  if(p){ const i = int(p.dataset.pick), v = i >= 0 ? $('#sheet')._opts[i].value : null, r = pickResolve; pickResolve = null; closeSheet(); if(r) r(v); return; }
  const ab = e.target.closest('[data-abil]');
  if(ab && !ab.disabled) return useAbility(ab.dataset.abil);
  const ob = e.target.closest('[data-obor]');
  if(ob) return chooseSubclass(ob.dataset.obor);
  const ft = e.target.closest('[data-feat]'); if(ft) return chooseFeat(ft.dataset.feat);
  const ln = e.target.closest('[data-learn]'); if(ln) return learnSpell(ln.dataset.learn);
  const al = e.target.closest('[data-align]');
  if(al && S._povDraft){ S._povDraft.presvedceni = al.dataset.align; al.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === al)); return; }
  const b = e.target.closest('[data-act]');
  if(b && !b.disabled) journalAction(b);
};
$('#sheetShade').onclick = closeSheet;
$('#diceOv').onclick = () => diceSkip && diceSkip();
$('#mic').onclick = toggleMic;
$('#recapBtn').onclick = recapOpen;
$('#sndBtn').onclick = () => {
  const on = !(sfxOn() || ambOn());
